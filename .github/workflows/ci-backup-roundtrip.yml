# ci-backup-roundtrip (audit-register row 9: backup-restore-no-automated-roundtrip):
# the #395 incident silently lost 224M hypertable rows because a per-schema pg_dump
# misses _timescaledb_internal chunk data yet pg_restores "successfully". This job
# mechanically proves — weekly and on any backup-pipeline edit — that the EXACT
# `ay backup` / `ay restore` command sequence (deploy/backup/backup.sh dump +
# ay.ps1 'restore' verb) round-trips a hypertable, a compressed chunk, and a
# continuous aggregate's materialized rows. Keep the commands here in lockstep
# with ay.ps1 / backup.sh — the tripwire step below fails when they drift.
name: ci-backup-roundtrip

on:
  schedule:
    - cron: "0 3 * * 0" # Sunday 03:00 UTC — weekly proof the DR pipeline still round-trips
  workflow_dispatch:
  pull_request:
    paths:
      - "ay.ps1"
      - "deploy/backup/backup.sh"
      - ".github/workflows/ci-backup-roundtrip.yml"

concurrency:
  group: ci-backup-roundtrip-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # SAME image tag as deploy/docker-compose.yml `timescaledb:` — a skew here would
  # prove a restore path the owner's stack doesn't actually run.
  TSDB_IMAGE: timescale/timescaledb:2.17.2-pg17

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Drift tripwire — mirrored tokens still present in the real pipeline
        run: |
          # This workflow hardcodes the ay dump/restore sequence. If a load-bearing
          # token vanishes from ay.ps1 / deploy/backup/backup.sh, this mirror is
          # stale. (-Fc and --globals-only live in backup.sh — `ay backup` delegates
          # to it; the pre/post_restore dance and --no-owner live in ay.ps1.)
          missing=0
          for tok in '-Fc' '--globals-only' 'timescaledb_pre_restore' 'timescaledb_post_restore' '--no-owner'; do
            if ! grep -qF -e "$tok" ay.ps1 deploy/backup/backup.sh; then
              echo "missing token: $tok"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::backup pipeline drifted — keep ci-backup-roundtrip.yml in lockstep with ay.ps1 (and deploy/backup/backup.sh)"
            exit 1
          fi

      - name: Start pinned TimescaleDB
        run: |
          docker run -d --name tsdb -e POSTGRES_PASSWORD=test "$TSDB_IMAGE"
          # -h 127.0.0.1 so the init-time temp server (unix-socket only) can't
          # answer the probe before the real server is up
          for i in $(seq 1 60); do
            if docker exec tsdb pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then
              echo "postgres ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::timescaledb never became ready"
          docker logs tsdb
          exit 1

      - name: Seed fixture DB 'src' (hypertable + compressed chunk + cagg)
        run: |
          PSQL="docker exec tsdb psql -U postgres -v ON_ERROR_STOP=1"
          $PSQL -d postgres -c "CREATE DATABASE src"
          $PSQL -d src -c "CREATE EXTENSION IF NOT EXISTS timescaledb"
          $PSQL -d src -c "CREATE SCHEMA marketdata"
          $PSQL -d src -c "CREATE TABLE marketdata.candles (bucket timestamptz NOT NULL, token int NOT NULL, close double precision NOT NULL)"
          $PSQL -d src -c "SELECT create_hypertable('marketdata.candles', 'bucket', chunk_time_interval => INTERVAL '1 day')"
          # 1000 rows x 3 min = ~50 h -> 3 daily chunks
          $PSQL -d src -c "INSERT INTO marketdata.candles SELECT '2026-01-01T00:00:00Z'::timestamptz + i * INTERVAL '3 minutes', 1, i::double precision FROM generate_series(0, 999) i"
          # materialized_only=true so the post-restore cagg count reads ONLY
          # materialized rows (realtime aggregation would recompute from the base
          # table and mask lost materialization)
          $PSQL -d src -c "CREATE MATERIALIZED VIEW marketdata.candles_1h WITH (timescaledb.continuous, timescaledb.materialized_only = true) AS SELECT time_bucket('1 hour', bucket) AS bucket, token, avg(close) AS close FROM marketdata.candles GROUP BY 1, 2 WITH NO DATA"
          $PSQL -d src -c "CALL refresh_continuous_aggregate('marketdata.candles_1h', NULL, NULL)"
          $PSQL -d src -c "ALTER TABLE marketdata.candles SET (timescaledb.compress, timescaledb.compress_segmentby = 'token')"
          # compress exactly the first (2026-01-01) chunk
          $PSQL -d src -c "SELECT compress_chunk(c) FROM show_chunks('marketdata.candles', older_than => '2026-01-02T00:00:00Z'::timestamptz) c"

          # --- OPS-R01: seed the OTHER three lineages (admin/strategy/backtest) + the
          #     service roles + the CD-1 cross-schema grant, so the round-trip proves
          #     ay.ps1's 4-lineage post-restore manifest (roles + grants included), not
          #     just the marketdata hypertable. Roles are cluster-global; a fresh
          #     container has none, and || true keeps a container-reuse rerun clean.
          docker exec tsdb psql -U postgres -d src -c "CREATE ROLE ay_marketdata NOLOGIN" || true
          docker exec tsdb psql -U postgres -d src -c "CREATE ROLE ay_strategy NOLOGIN" || true
          docker exec tsdb psql -U postgres -d src -c "CREATE ROLE ay_backtest NOLOGIN" || true
          $PSQL -d src -c "CREATE SCHEMA IF NOT EXISTS admin"
          $PSQL -d src -c "CREATE SCHEMA IF NOT EXISTS strategy"
          $PSQL -d src -c "CREATE SCHEMA IF NOT EXISTS backtest"
          # each lineage's flyway_schema_history is the universal per-lineage witness ay.ps1 probes
          for s in admin marketdata strategy backtest; do
            $PSQL -d src -c "CREATE TABLE ${s}.flyway_schema_history (installed_rank int PRIMARY KEY, success boolean)"
            $PSQL -d src -c "INSERT INTO ${s}.flyway_schema_history VALUES (1, true)"
          done
          $PSQL -d src -c "CREATE TABLE marketdata.instruments (token int PRIMARY KEY, tradingsymbol text)"
          $PSQL -d src -c "INSERT INTO marketdata.instruments VALUES (1, 'NIFTY')"
          $PSQL -d src -c "CREATE TABLE marketdata.options_chain_snapshots (id bigint PRIMARY KEY)"
          $PSQL -d src -c "CREATE TABLE strategy.signals (id bigint PRIMARY KEY)"
          $PSQL -d src -c "CREATE TABLE backtest.backtest_runs (id bigint PRIMARY KEY)"
          $PSQL -d src -c "CREATE TABLE backtest.jobs (id bigint PRIMARY KEY)"
          # the ONE cross-schema grant (CD-1): ay_backtest reads marketdata (per-object ACL,
          # rides the whole-db dump, NOT globals — so the restore genuinely re-applies it)
          $PSQL -d src -c "GRANT USAGE ON SCHEMA marketdata TO ay_backtest"
          $PSQL -d src -c "GRANT SELECT ON ALL TABLES IN SCHEMA marketdata TO ay_backtest"

          src_base=$($PSQL -t -A -d src -c "SELECT count(*) FROM marketdata.candles")
          src_compressed_range=$($PSQL -t -A -d src -c "SELECT count(*) FROM marketdata.candles WHERE bucket < '2026-01-02T00:00:00Z'")
          src_cagg=$($PSQL -t -A -d src -c "SELECT count(*) FROM marketdata.candles_1h")
          src_chunks=$($PSQL -t -A -d src -c "SELECT count(*) FROM timescaledb_information.chunks WHERE hypertable_schema = 'marketdata' AND hypertable_name = 'candles'")
          src_compressed_chunks=$($PSQL -t -A -d src -c "SELECT count(*) FROM timescaledb_information.chunks WHERE hypertable_schema = 'marketdata' AND hypertable_name = 'candles' AND is_compressed")
          echo "src: base=$src_base compressed_range=$src_compressed_range cagg=$src_cagg chunks=$src_chunks compressed_chunks=$src_compressed_chunks"
          # the fixture itself must be meaningful, or the round-trip proves nothing
          [ "$src_base" -eq 1000 ] || { echo "::error::fixture base count $src_base != 1000"; exit 1; }
          [ "$src_chunks" -ge 2 ] || { echo "::error::fixture spans $src_chunks chunk(s), need >= 2"; exit 1; }
          [ "$src_compressed_chunks" -ge 1 ] || { echo "::error::no compressed chunk in fixture"; exit 1; }
          [ "$src_cagg" -gt 0 ] || { echo "::error::cagg materialized 0 rows"; exit 1; }
          {
            echo "SRC_BASE=$src_base"
            echo "SRC_COMPRESSED_RANGE=$src_compressed_range"
            echo "SRC_CAGG=$src_cagg"
          } >> "$GITHUB_ENV"

      - name: Dump exactly as `ay backup` does (deploy/backup/backup.sh)
        run: |
          # 1) cluster globals, 2) WHOLE-DATABASE -Fc (never -n per-schema: chunk
          # data lives in _timescaledb_internal, outside any dumped namespace — #395)
          docker exec tsdb pg_dumpall -U postgres --globals-only -f /tmp/globals.sql
          docker exec tsdb pg_dump -U postgres -Fc -d src -f /tmp/src-full.dump
          docker exec tsdb ls -l /tmp/globals.sql /tmp/src-full.dump
          # OPS-R01 (review R3): make the roles/globals validation NON-vacuous. The three
          # ay_* roles were created in this SAME cluster as dst, so without dropping them
          # the post-restore roles=3/3 check would pass even if the globals.sql restore
          # did nothing. Drop the src DB first (its grants depend on ay_backtest), then
          # the roles — the globals restore below MUST recreate them for the check to pass.
          docker exec tsdb dropdb -U postgres src
          docker exec tsdb psql -U postgres -v ON_ERROR_STOP=1 -d postgres -c "DROP ROLE ay_marketdata; DROP ROLE ay_strategy; DROP ROLE ay_backtest"
          leftover=$(docker exec tsdb psql -U postgres -t -A -d postgres -c "SELECT count(*) FROM pg_roles WHERE rolname IN ('ay_marketdata','ay_strategy','ay_backtest')")
          [ "$leftover" = "0" ] || { echo "::error::ay_* roles still present after drop — the post-restore roles check would be vacuous"; exit 1; }
          echo "src DB + ay_* roles dropped; only the dumps carry them now"

      - name: Restore into 'dst' exactly as `ay restore` does (ay.ps1)
        run: |
          # -T template0 mirrors ay restore (review R1c): the target must be genuinely
          # empty so the anchored benign-error patterns can only match the pre-created
          # extension + template0's public schema
          docker exec tsdb dropdb -U postgres --if-exists dst
          docker exec tsdb createdb -U postgres -T template0 dst
          # globals into 'postgres'; a CREATE ROLE that already exists is a
          # tolerated no-op (ay restore uses Invoke-ComposeAllowFail here)
          docker exec tsdb psql -U postgres -d postgres -v ON_ERROR_STOP=0 -f /tmp/globals.sql || true
          docker exec tsdb psql -U postgres -d dst -c "CREATE EXTENSION IF NOT EXISTS timescaledb"
          # pre_restore disables chunk routing + background jobs so pg_restore can
          # write the _timescaledb_internal chunk data directly; post_restore re-enables
          docker exec tsdb psql -U postgres -d dst -c "SELECT timescaledb_pre_restore()"
          # OPS-R01 (review R3): mirror ay restore's STRICT error-classification gate —
          # capture output, tolerate ONLY the anchored benign patterns (the exact objects
          # that pre-exist in a template0 clone), fail on anything else AND on an
          # unclassified non-zero exit. No blanket `|| echo` tolerance.
          restore_rc=0
          restore_out=$(docker exec tsdb pg_restore -U postgres -d dst --no-owner /tmp/src-full.dump 2>&1) || restore_rc=$?
          printf '%s\n' "$restore_out"
          benign_re='extension "timescaledb" already exists|schema "public" already exists|must be owner of extension timescaledb'
          err_lines=$(printf '%s\n' "$restore_out" | grep -iE 'pg_restore: *error:|^ *ERROR:' || true)
          benign_count=0; fatal_lines=""
          if [ -n "$err_lines" ]; then
            benign_count=$(printf '%s\n' "$err_lines" | grep -ciE "$benign_re" || true)
            fatal_lines=$(printf '%s\n' "$err_lines" | grep -viE "$benign_re" || true)
          fi
          if [ -n "$fatal_lines" ]; then
            echo "::error::pg_restore reported non-benign error(s) (exit=$restore_rc):"
            printf '%s\n' "$fatal_lines"
            exit 1
          fi
          # Review round 3: a non-zero exit is tolerated ONLY when pg_restore terminated
          # NORMALLY — PG17 pg_restore.c prints 'pg_restore: warning: errors ignored on
          # restore: N' iff n_errors>0 then exits 1 — AND N equals our benign-classified
          # count. Killed-after-a-benign-line (exit 137, no summary) or a summary above
          # the benign count is FATAL. Mirrors ay.ps1 exactly.
          summary_n=$(printf '%s\n' "$restore_out" | grep -ioE 'warning: *errors ignored on restore: *[0-9]+' | grep -oE '[0-9]+' | tail -1 || true)
          if [ "$restore_rc" -ne 0 ]; then
            if [ -z "$summary_n" ]; then
              echo "::error::pg_restore exit=$restore_rc WITHOUT its terminal 'errors ignored on restore' summary — abnormal termination (killed, connection lost, partial run)"
              exit 1
            fi
            if [ "$summary_n" -ne "$benign_count" ]; then
              echo "::error::pg_restore summary reports $summary_n ignored error(s) but only $benign_count classified benign — unaccounted error(s)"
              exit 1
            fi
            echo "pg_restore exit=$restore_rc tolerated: $benign_count benign error line(s), terminal summary consistent"
          fi
          docker exec tsdb psql -U postgres -d dst -c "SELECT timescaledb_post_restore()"
          docker exec tsdb psql -U postgres -d dst -c "ANALYZE"

      - name: Assert the round-trip lost nothing
        run: |
          PSQL="docker exec tsdb psql -U postgres -v ON_ERROR_STOP=1"
          dst_base=$($PSQL -t -A -d dst -c "SELECT count(*) FROM marketdata.candles")
          dst_compressed_range=$($PSQL -t -A -d dst -c "SELECT count(*) FROM marketdata.candles WHERE bucket < '2026-01-02T00:00:00Z'")
          dst_cagg=$($PSQL -t -A -d dst -c "SELECT count(*) FROM marketdata.candles_1h")
          dst_compressed_chunks=$($PSQL -t -A -d dst -c "SELECT count(*) FROM timescaledb_information.chunks WHERE hypertable_schema = 'marketdata' AND hypertable_name = 'candles' AND is_compressed")
          echo "dst: base=$dst_base (src $SRC_BASE) compressed_range=$dst_compressed_range (src $SRC_COMPRESSED_RANGE) cagg=$dst_cagg (src $SRC_CAGG) compressed_chunks=$dst_compressed_chunks"
          fail=0
          [ "$dst_base" = "$SRC_BASE" ] || { echo "::error::base row count diverged: $dst_base != $SRC_BASE (the #395 silent-hypertable-loss class)"; fail=1; }
          { [ "$dst_compressed_range" = "$SRC_COMPRESSED_RANGE" ] && [ "$dst_compressed_range" -gt 0 ]; } || { echo "::error::compressed-chunk rows diverged: $dst_compressed_range != $SRC_COMPRESSED_RANGE"; fail=1; }
          [ "$dst_compressed_chunks" -ge 1 ] || { echo "::error::no compressed chunk survived the restore"; fail=1; }
          { [ "$dst_cagg" = "$SRC_CAGG" ] && [ "$dst_cagg" -gt 0 ]; } || { echo "::error::cagg materialized rows diverged: $dst_cagg != $SRC_CAGG"; fail=1; }
          # the candle-style zero-row gate `ay restore` itself applies since #501
          [ "$dst_base" -gt 0 ] || { echo "::error::marketdata.candles EMPTY after restore"; fail=1; }
          # OPS-R01: the SAME 4-lineage post-restore manifest ay.ps1 runs — a key relation
          # in each lineage (admin/marketdata/strategy/backtest), the three service roles,
          # and the CD-1 cross-schema grant. A dump missing any of these used to restore
          # "successfully" on the marketdata-candles-only gate.
          for obj in admin.flyway_schema_history \
                     marketdata.flyway_schema_history marketdata.candles marketdata.instruments marketdata.options_chain_snapshots \
                     strategy.flyway_schema_history strategy.signals \
                     backtest.flyway_schema_history backtest.backtest_runs backtest.jobs; do
            present=$($PSQL -t -A -d dst -c "SELECT to_regclass('$obj') IS NOT NULL")
            [ "$present" = "t" ] || { echo "::error::lineage relation missing after restore: $obj"; fail=1; }
          done
          dst_roles=$($PSQL -t -A -d dst -c "SELECT count(*) FROM pg_roles WHERE rolname IN ('ay_marketdata','ay_strategy','ay_backtest')")
          [ "$dst_roles" = "3" ] || { echo "::error::service roles incomplete after restore: found $dst_roles/3"; fail=1; }
          # SELECT AS ay_backtest proves the dump's per-object grant restored (permission
          # denied => the cross-schema grant was lost). ON_ERROR_STOP=1 + 2>&1 || true so a
          # denial is captured as text, not an aborted step.
          grant_probe=$(docker exec tsdb psql -U postgres -t -A -v ON_ERROR_STOP=1 -d dst -c "SET ROLE ay_backtest; SELECT count(*) FROM marketdata.instruments; RESET ROLE" 2>&1 || true)
          if echo "$grant_probe" | grep -qiE 'permission denied|ERROR:'; then echo "::error::cross-schema grant lost after restore: $grant_probe"; fail=1; fi
          echo "lineage manifest: roles=$dst_roles/3, grant_probe=$grant_probe"
          [ "$fail" -eq 0 ] || exit 1
          echo "round-trip OK: $dst_base base rows, $dst_cagg cagg rows, compressed chunk intact, 4 lineages + roles + grant validated"

      - name: Container logs (diagnosis)
        if: failure()
        run: docker logs tsdb || true
