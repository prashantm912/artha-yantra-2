# Codex skill-suite harness guard: runs the pure-bash selftest.sh (C1 abs-state-dir,
# C2 literal substitution, M3 worktree-key-fold, capacity-fallback, legacy-key migration)
# whenever the shared harness changes. No secrets, no Codex CLI call — just the regression
# checks the cross-vendor review caught during the spike. Path-filtered, mirrors ci-react's shape.
name: ci-codex-harness

on:
  pull_request:
    paths:
      - ".claude/skills/codex/**"
      - ".github/workflows/ci-codex-harness.yml"
  push:
    branches: [main]
    paths:
      - ".claude/skills/codex/**"

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Codex harness selftest (pure bash, no Codex call)
        run: bash .claude/skills/codex/scripts/selftest.sh
