# Phase 24 (CD-8): the committed OpenAPI 3.1 specs are the contract. Every PR
# regenerates them from code (mock profile, the ContractCaptureTest path that
# also lints /api/v1 prefixes + the error envelope). The generated TS client must
# compile under tsc --strict.
#
# task_b3b59719 - WHAT THE BREAKING GATE COMPARES, AND WHAT IT CANNOT SEE.
#
# This header used to claim "BREAKING changes fail". That was false, and the workflow
# itself was why: the gate mounted the BRANCH's committed spec against the BRANCH's
# freshly-captured code spec. Both sides were the branch, so it never compared against
# main - and the very next step tells you to re-capture the spec (as do CLAUDE.md and
# ship-a-change), which makes both sides identical again. It had teeth only on a PR that
# forgot to re-capture, i.e. never on the PRs it exists for. Now: the breaking gate diffs
# the MERGE BASE's committed spec against this branch's code spec - "does this PR break a
# consumer sitting on main today?", which is the only question worth asking.
#
# It matters because consumers read these keys OVER THE WIRE with no compile-time link -
# e.g. strategy-signal's registry/UniverseResolver.java:142-148 reads asOf / items /
# exchange / tradingsymbol out of market-data's constituents response via JsonNode.path().
# A renamed key silently breaks live universe resolution and no compiler catches it.
#
# task_ade97df8 - THE GATE CAN NOW SEE A RENAMED RESPONSE KEY. It could not before, for two
# independent reasons, and NEITHER fix alone was enough (all measured against the real specs
# with the real image, openapi-diff 2.1.7):
#   1. openapi-diff does not diff `openapi: 3.1.0` schemas. At 3.1.0 a RENAMED response
#      property reports "No differences. Specifications are equivalent" - the property-set
#      change is not even recorded - and a retype reports the nonsense "Changed property type:
#      checksum (object -> object)", because the parser never resolves `type: string` at 3.1.
#      So the gate now relabels BOTH sides to 3.0.1 for the DIFF STEP ONLY (the committed specs
#      stay 3.1.0). openapi_relabel_30.py REFUSES to relabel a spec using a 3.1-only construct
#      rather than mangle it silently — EXCEPT the nullability type array (`type: ["number","null"]`),
#      which converts losslessly to 3.0's `type: number, nullable: true` (the only way springdoc can
#      express a nullable response field at 3.1: swagger-core's 3.1 serializer drops `nullable`, so
#      sources spell it `@Schema(types = {"number","null"})`). Genuine unions still refuse.
#   2. springdoc emitted no `required` array for record-backed schemas, so every property was
#      optional - and openapi-diff has no "response property removed" rule at all (its enum has
#      only incompatible.response.required.decreased). A renamed OPTIONAL response property was
#      "backward compatible" by construction. common-web-core's RecordRequiredModelConverter +
#      ResponseRequiredCustomizer now emit `required` for the record components Jackson always
#      writes. RESPONSE-ONLY schemas: on a request body `required` would claim the client MUST
#      send a key the server actually accepts as absent.
# With both, a renamed response key reports "Missing property: items[n].tradingsymbol (string)"
# and exits 1. Adding a response field stays green (required INCREASED on a response = the
# server promising more).
# STILL NOT CAUGHT by openapi-diff, deliberately: a rename inside a RECORD reachable from BOTH a
# request and a response (no such record exists today — ItemRequest is request-only, and JsonNode,
# which does appear in both, is not a record so it never carries `required` anyway), and any
# request-body property rename. Do not broaden this comment past what is measured.
#
# A REMOVED OR RENAMED COMPONENT NAME IS CAUGHT BY A SECOND, SEPARATE GATE - openapi-diff is
# structurally blind to it. openapi-diff compares STRUCTURE, not the component dictionary: rename a
# schema component and update every `$ref` to it, and the two documents describe the same requests
# and responses, so it reports "backward compatible" and exits 0. MEASURED on the real specs, not
# assumed: PR #1173's round-1 tree (f2c633e4) vs its merge base (1f6186a7) DELETED SEVEN published
# market-data component keys - Heatmap, StrikeMove, Report, PortfolioStat, SetupStat, SlotCell,
# YearReturn - by renaming BOTH twins of each springdoc simple-name collision, and openapi-diff
# printed "API changes are backward compatible", exit 0. Only a human review caught it.
# Component names are not decoration: contracts/gen/*.d.ts indexes them
# (`components["schemas"]["Heatmap"]`), as does every other generated client, so deleting one breaks
# consumers whose wire bytes never changed.
# The "Removed-component-name gate" step below therefore compares the COMPONENT KEY SETS of the same
# two sides the breaking gate uses - the MERGE BASE's committed spec vs THIS branch's code spec -
# and fails on any key that main publishes and this branch does not. A rename is a removal plus an
# addition and is deliberately NOT special-cased: the additive fix (rename only the NEWCOMER twin,
# the incumbent keeps the name it already published) is exactly what passes. Additions are ignored,
# so an ordinary new-endpoint PR is unaffected. Escape hatch is the breaking gate's, deliberately
# ONE mechanism and not a second one: a `Contract break: APPROVED (<reason>)` line in the PR body,
# `hotfix/*` exempt.
# BOTH gates anchor that token to a COMPLETE, STANDALONE LINE. Unanchored - as both were until
# #1183 - it matched anywhere in the body, so a PR that merely QUOTED the token inside a sentence
# waived the gate. #1183's own body did that while documenting this mechanism. Trailing prose now
# disqualifies a line; leading indentation does not, and the trailing whitespace class absorbs the
# CR in GitHub's `\r\n` bodies (without it `$` would never match and the hatch would be dead).
# Residual, accepted: a token sitting ALONE on its own line inside a fenced code block still
# counts. That is indistinguishable from an approval without parsing Markdown, and writing the
# line by itself is what an approver does anyway.
#   COVERAGE ASYMMETRY - stated because a future session will trust this header. For the four Java
#   services the branch side is the FRESHLY CAPTURED services/<svc>/target/contracts/*.json, so a
#   rename is caught even if the author forgot to re-capture the committed spec. optimizer-service
#   has no such artifact (it is Python - see the loop-1 comment in the breaking-gate step), so its
#   branch side is the COMMITTED contracts/optimizer-service.openapi.json. That is still merge base
#   vs branch - two different commits, never branch-vs-itself - but it only sees a rename once the
#   author re-dumps, and nothing else looks at that service's component names either:
#   optimizer_spec_staleness.py projects OPERATIONS only (method+path, parameter names, requestBody
#   presence, response-code set), never components.
#   STILL NOT CAUGHT by either gate: a component RETYPE or field-level change that openapi-diff
#   judges compatible, plus everything already listed above.
#
# WHICH SERVICES EACH GATE LOOKS AT - ONE DERIVED LIST, NOT FIVE TYPED-OUT ONES.
# Measured 2026-08-01: this file carried FIVE independent hardcoded service lists (the Maven
# capture reactor, the breaking gate, the removed-component-name gate, the warn-vs-code step,
# and the tsc --strict loop). A newly added service appeared in NONE of them and nothing failed -
# the checks simply never looked at it. A check that never looked is indistinguishable from a
# check that passed, which is this workflow's recurring failure mode in yet another costume.
# It surfaced only because the removed-component-name gate's author went looking for a derivable
# list and found none.
# .github/scripts/contract_service_inventory.sh is now that list. It derives the service set from
# contracts/*.openapi.json - definitional, since this header's first line says the committed specs
# ARE the contract - and splits it on services/<svc>/pom.xml, which is precisely what the five
# lists disagreed about: a Maven module has a freshly captured target/contracts artifact, a
# non-Maven one has only its committed dump. Coverage is UNCHANGED by the unification; the PR
# that introduced it carries the per-gate before/after membership table.
#   IT FAILS THE JOB, LOUDLY, on anything it cannot classify: a spec whose services/<svc>/ is
#   gone, a service dir with no committed spec, a service with a spec but no pom.xml that is not
#   DECLARED non-Java, or a declaration that no longer matches the tree. Excluding a service from
#   a gate is therefore an edit somebody makes and a reviewer sees, never an omission.
#   Every consuming loop asserts its list is non-empty before running (`${VAR:?}`). That guard is
#   load-bearing, not decoration: `for svc in ; do` iterates zero times and exits 0, so a skipped
#   or broken inventory step would otherwise turn every gate below into a silent green.
#   ENUMERATED IS NOT EXAMINED, and the difference needed its own step. A Java service with a
#   pom.xml and a committed spec but no working ContractCaptureTest used to pass the whole job
#   green with its spec never compared against code: the capture step cannot fail for a missing
#   test (`failIfNoSpecifiedTests=false` is required for the upstream libs in the reactor), BOTH
#   hard gates `continue` on "new service" before they read the branch-side artifact, and the
#   drift check only warns. The "Every Java service actually captured a spec" step now demands
#   services/<svc>/target/contracts/<svc>.openapi.json for every Java inventory entry and fails
#   loudly if it is absent. Note this is the BRANCH side only - it asserts the artifact exists,
#   not that any particular gate compared it.
#   STILL POSSIBLE TO MISS, stated because a future session will trust this header: a service that
#   never commits an OpenAPI spec at all gets no CONTRACT checking - the inventory forces it to be
#   declared in EXEMPT_SERVICES, so it is visible and deliberate, but declaring it does not test
#   it. margin-service is exactly that today (four live routes, a hand-maintained api-surface.json,
#   no OpenAPI document, covered only by the path-filtered non-required ci-margin.yml). And a new
#   service still needs its own ci-java.yml matrix shard or its TESTS never run - a separate,
#   already-documented trap that this inventory does not address.
# task_db8bdf1e - `contracts` is a REQUIRED status check, so it must never be skipped at the
# WORKFLOW level. GitHub reports a job skipped by an `if:` as Success, but a workflow skipped
# by `paths:` stays Pending forever and blocks the PR ("You should not use path or branch
# filtering to skip workflow runs if the workflow is required" - GitHub docs). The old
# `paths:` filter here is therefore replaced by a `changes` classifier + an `if:` gate; the
# job name is unchanged so the required context still resolves. See ci-java.yml's header for
# the full rationale.
name: ci-contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.classify.outputs.contracts }}
      optimizer: ${{ steps.classify.outputs.optimizer }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # FAIL SAFE = RUN (see ci-java.yml): an unresolvable base must capture the specs,
          # never silently declare the contract unchanged.
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" || true
            base="$(git merge-base HEAD "origin/$BASE_REF" 2>/dev/null || true)"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null && base="$BEFORE_SHA" || base=""
          fi

          if [ -z "$base" ]; then
            echo "::notice::change base did not resolve — running the contract gate (fail-safe)"
            echo "contracts=true" >> "$GITHUB_OUTPUT"
            echo "optimizer=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "diff base: $base"
          files="$(git diff --name-only "$base" HEAD)"
          echo "$files"

          if echo "$files" | grep -Eq '^(services/|libs/|contracts/|\.github/workflows/ci-contracts\.yml$|\.github/scripts/openapi_relabel_30\.py$|\.github/scripts/optimizer_spec_staleness\.py$|\.github/scripts/contract_service_inventory\.sh$)'; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
          else
            echo "contracts=false" >> "$GITHUB_OUTPUT"
          fi

          # task_e2d15c21 - a SECOND, narrower classification. optimizer-service's spec cannot be
          # captured without its Python dependencies, so the step that validates the committed API
          # surface against the LIVE app is too heavy to run on every contract-relevant PR (most of
          # which are pure-Java). It runs only when this PR could actually have changed that surface
          # - i.e. touched the service (routes, or the dependency locks that pin fastapi/pydantic)
          # or hand-edited one of its two committed artifacts. Nothing outside these paths can move
          # the app's route table, so narrowing here loses no coverage. Fail-safe above is TRUE.
          if echo "$files" | grep -Eq '^(services/optimizer-service/|contracts/optimizer-service\.)'; then
            echo "optimizer=true" >> "$GITHUB_OUTPUT"
          else
            echo "optimizer=false" >> "$GITHUB_OUTPUT"
          fi

  contracts:
    needs: changes
    # ALWAYS materialise, gate the STEPS — never the job. Two reasons, both load-bearing:
    # (1) a job skipped via `if:` because its dependency failed or was cancelled still reports as
    #     SKIPPED, and branch protection counts a skipped required check as satisfied — so a broken
    #     classifier would let contract-changing code merge with the gate never having run. `changes`
    #     is not itself a required context, so nothing else would have caught it.
    # (2) symmetry with ci-java's build-test, where a job-level `if` would additionally prevent the
    #     check name from ever being created.
    # The first step below turns a non-successful classifier into an explicit RED.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Classifier must have succeeded
        if: needs.changes.result != 'success'
        run: |
          echo "::error::the changes classifier did not succeed (${{ needs.changes.result }}) — refusing to report the contract gate green without knowing what changed"
          exit 1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: needs.changes.outputs.contracts == 'true'
        with:
          # The breaking gate diffs against the merge base; the default shallow
          # fetch does not contain it.
          fetch-depth: 0

      - name: Contract service inventory (the ONE list every gate below loops over)
        if: needs.changes.outputs.contracts == 'true'
        # Runs BEFORE the capture step on purpose: it is derived from the COMMITTED specs,
        # which exist at checkout, never from services/<svc>/target/, which does not exist
        # until the capture step this list drives has already run.
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          # Explicit `bash`, like the sibling scripts' explicit `python3`: these files are
          # committed 100644 (this repo is authored on Windows with core.filemode=false, so an
          # exec bit never survives) and a direct ./ invocation would die "Permission denied".
          # No pipe: the script's exit code must survive. It fails CLOSED on any service it
          # cannot classify, and the append happens only after it has succeeded.
          bash .github/scripts/contract_service_inventory.sh > "$tmp"
          cat "$tmp" >> "$GITHUB_ENV"
          echo "--- exported to \$GITHUB_ENV ---"
          cat "$tmp"

      - name: Resolve the merge base (fail loudly if it does not)
        if: needs.changes.outputs.contracts == 'true' && github.event_name == 'pull_request'
        id: mergebase
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # fetch-depth:0 already has it in practice; this makes the dependency explicit
          # and survives a fork PR, where origin is the BASE repo.
          git fetch --no-tags --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          BASE_SHA="$(git merge-base HEAD "origin/$BASE_REF")"
          if [ -z "$BASE_SHA" ]; then
            echo "::error::merge base against origin/$BASE_REF did not resolve - the breaking gate must not run blind."
            exit 1
          fi
          echo "merge base: $BASE_SHA"
          git log -1 --oneline "$BASE_SHA"
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        if: needs.changes.outputs.contracts == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Regenerate specs from code (capture tests, mock profile)
        if: needs.changes.outputs.contracts == 'true'
        # -am builds the Java contract services PLUS every upstream module and the parent POMs
        # in one reactor (a -pl install of leaf libs alone never installs the common-web / parent
        # POMs). Upstream modules run zero tests (no ContractCaptureTest +
        # failIfNoSpecifiedTests=false).
        run: |
          set -euo pipefail
          : "${AY_CONTRACT_SERVICES_JAVA:?the inventory step did not run - refusing to capture an unknown set of specs. An empty list here would build nothing and exit 0.}"
          pl=""
          for svc in $AY_CONTRACT_SERVICES_JAVA; do pl="${pl:+$pl,}services/$svc"; done
          echo "reactor: -pl $pl"
          ./mvnw -ntp -pl "$pl" -am test \
            -Dtest=ContractCaptureTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Every Java service actually captured a spec (enumerated is not examined)
        if: needs.changes.outputs.contracts == 'true'
        # ENUMERATING A SERVICE IS NOT THE SAME AS EXAMINING IT. Without this step a Java service
        # with a pom.xml AND a committed spec but NO working ContractCaptureTest passes the whole
        # job green, its committed spec never once compared against its code. Three things have to
        # be true at the same time, and all three are load-bearing design decisions elsewhere:
        #   1. the capture step CANNOT fail for a missing test - `-Dsurefire.failIfNoSpecifiedTests
        #      =false` is required, because every upstream lib in the `-am` reactor legitimately
        #      has no ContractCaptureTest. So an absent, misnamed, or wrong-output-path capture
        #      test produces no artifact and Maven still exits 0.
        #   2. BOTH hard gates `continue` on "absent from the merge base = a new service" BEFORE
        #      they ever look at the branch-side artifact - which is correct for the question they
        #      ask (nothing on main consumes it yet), but it means a NEW service's artifact is
        #      never demanded by either of them.
        #   3. the drift check below is warning-only, by design.
        # Net: the checks do not fail, they simply never look - the exact shape the inventory
        # above exists to end, one level in. The inventory guarantees a service is ENUMERATED;
        # this step is what makes it EXAMINED.
        # Deliberately NOT folded into the capture step: a separate step is independently visible
        # as success/skipped in the job's step list, and this is precisely the kind of check whose
        # having-run must be readable rather than inferred.
        run: |
          set -euo pipefail
          : "${AY_CONTRACT_SERVICES_JAVA:?the inventory step did not run - refusing to assert capture over an empty service list.}"
          missing=""
          for svc in $AY_CONTRACT_SERVICES_JAVA; do
            art="services/$svc/target/contracts/$svc.openapi.json"
            if [ -f "$art" ]; then
              echo "  captured: $art"
            else
              missing="${missing:+$missing }$svc"
              echo "::error::$svc has services/$svc/pom.xml and a committed contracts/$svc.openapi.json, but the capture run produced no $art. Its committed spec would never be compared against its code: both merge-base gates skip a service that is new on this branch before they read the branch-side artifact, and the drift check only warns. Add a working ContractCaptureTest for this service, or fix its name / output path."
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::no captured spec for: $missing"
            exit 1
          fi
          echo "every Java contract service captured a spec."

      - name: Breaking-change gate (merge base vs this branch's code)
        # Skipped on push:main - the PR already merged; there is nothing left to gate.
        if: needs.changes.outputs.contracts == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ steps.mergebase.outputs.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          case "$PR_BRANCH" in
            hotfix/*)
              echo "::notice::hotfix branch - breaking-contract gate exempt by design (a live incident must not wait on a contract gate)."
              exit 0
              ;;
          esac

          # openapi_relabel_30.py validates each relabeled spec against the OpenAPI 3.0 schema and
          # refuses (exit 2) on any 3.1-only construct - the allow-list backstop that makes the
          # relabel sound (a deny-list cannot). --break-system-packages: the ubuntu-latest system
          # python is PEP-668 externally-managed. If this install fails the script's own import
          # guard fails the gate CLOSED (a loud exit 2), never a silent skip.
          python3 -m pip install --quiet --break-system-packages openapi-spec-validator

          mkdir -p /tmp/basespec /tmp/freshspec
          broke=""
          # task_e2d15c21 - optimizer-service is DELIBERATELY ABSENT from this loop, and from the
          # staleness loop below, for two independent reasons. MEASURED, not assumed:
          #   1. It is Python, so there is no services/<svc>/target/contracts/*.json to read - the
          #      spec only exists after `pip install` + a capture run. (Steps A/B further down DO
          #      pay that cost, but only when the narrow `optimizer` classification fires. This
          #      loop has no such gate: it runs on every contract-relevant PR, most of them
          #      pure-Java, and would have to build the optimizer's environment for all of them.)
          #   2. Far more decisive: openapi_relabel_30.py REFUSES the FastAPI document (exit 2).
          #      pydantic spells an optional field `anyOf: [{...}, {"type": "null"}]` - 134
          #      occurrences in the committed spec, 132 of them carrying a `title` sibling. Note
          #      what is and is not the problem: 3.0 CAN express nullability (`type: X,
          #      nullable: true`), and springdoc's 3.1 type-array spelling already converts. What
          #      fails is that the relabel's anyOf converter matches only a BARE
          #      `{anyOf: [{$ref}, {type: null}]}` - pydantic's form has a `title` sibling and
          #      wraps a PRIMITIVE, not a $ref - so nothing converts it and the 3.0 validator
          #      correctly rejects the leftover `type: "null"`. Since exit 2 is a TOOL failure and
          #      this step is `set -e`, adding the name today would turn the required `contracts`
          #      check RED on every PR.
          #      TEACHING the converter that form is tractable and is the real fix, but it edits
          #      the invariant guarding all four Java specs, so it is a separate change with its
          #      own fixtures: primitive anyOf, $ref anyOf, a GENUINE union (must still refuse),
          #      3.0 validation of the result, and byte-unchanged output for all four Java specs.
          # What optimizer-service DOES get: the TS-client loop below (which reads the COMMITTED
          # spec, so it transfers unchanged) plus the semantic staleness gate. docs/design/
          # ARTHAYANTRA_2_STAGE_D_BACKTEST_OPTIMIZER.md states exactly that and no more. The
          # residual gap is real and named there: no merge-base comparison of the DOCUMENT guards
          # this service - EXCEPT its component NAMES, which the removed-component-name gate below
          # does compare against the merge base (committed dump on both sides, since there is no
          # capture artifact; see this file's header for that asymmetry). Everything else about
          # this service's spec - operations, properties, types - is still unguarded across the
          # merge base.
          #
          # The name is no longer typed out here. _JAVA is the inventory's derived list; the
          # exclusion is now a DECLARATION in contract_service_inventory.sh, and a future
          # non-Maven contract service cannot join optimizer-service in this carve-out without
          # someone editing that declaration - which is the point. Membership is unchanged.
          : "${AY_CONTRACT_SERVICES_JAVA:?the inventory step did not run - refusing to report the breaking gate green over an empty service list.}"
          for svc in $AY_CONTRACT_SERVICES_JAVA; do
            echo "=== $svc ==="
            # A spec absent from the merge base = a NEW service. Nothing on main consumes it
            # yet, so there is no compatibility question to answer.
            # EVIDENCE OF ABSENCE, NOT ABSENCE OF A SUCCESSFUL READ - this used to be
            # `if ! git show … ; then continue`, which read a git error or a failed redirect as
            # "new service" and silently skipped the spec, reporting green having compared
            # nothing. Same fix, same shape, as the removed-component-name gate below: the two
            # must not diverge. `present=$(…)` is a checked assignment, so a git failure aborts
            # under `set -e`; the extraction is then UNGUARDED.
            base_path="contracts/$svc.openapi.json"
            present="$(git ls-tree -r --name-only "$BASE_SHA" -- "$base_path")"
            if [ -z "$present" ]; then
              echo "::notice::$svc has no spec at the merge base (new service) - nothing to break."
              continue
            fi
            git show "$BASE_SHA:$base_path" > "/tmp/basespec/raw-$svc.json"
            # task_ade97df8 - RELABEL BOTH SIDES TO 3.0.1 FOR THE DIFF STEP ONLY. openapi-diff
            # 2.1.7 does not diff 3.1 schemas: at 3.1.0 a RENAMED response property reports "No
            # differences. Specifications are equivalent". The same bytes at 3.0.1 report
            # "Missing property: items[n].tradingsymbol (string)" and exit 1. The COMMITTED specs
            # stay 3.1.0; these are throwaway copies. The script REFUSES to relabel a spec that
            # uses a 3.1-only construct (exit 2) rather than silently mangle it.
            python3 .github/scripts/openapi_relabel_30.py \
              "/tmp/basespec/raw-$svc.json" "/tmp/basespec/$svc.openapi.json" 3.0.1
            python3 .github/scripts/openapi_relabel_30.py \
              "services/$svc/target/contracts/$svc.openapi.json" "/tmp/freshspec/$svc.openapi.json" 3.0.1
            # No pipe, no `||`: the exit code must survive. `set +e`/`set -e` around the call so we
            # can read the STATUS rather than only "nonzero", which `if !` would flatten.
            set +e
            docker run --rm \
              -v "/tmp/basespec:/base:ro" \
              -v "/tmp/freshspec:/fresh:ro" \
              openapitools/openapi-diff:latest \
              --fail-on-incompatible \
              "/base/$svc.openapi.json" "/fresh/$svc.openapi.json"
            rc=$?
            set -e
            # Exit 1 is the ONLY "incompatible" answer. Any other nonzero means the TOOL failed
            # (parse error, bad mount, image pull, OOM) — it is NOT a verdict, and it must never
            # reach the escape hatch below: an approval token would then wave through a run that
            # checked NOTHING, which is this workflow's original sin in a new costume. Fail here.
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
              echo "::error::openapi-diff exited $rc for $svc — that is a TOOL failure, not a compatibility verdict. The gate cannot answer its question, so it fails. This is NOT waivable by the PR-body token."
              exit 1
            fi
            if [ "$rc" -eq 1 ]; then
              broke="$broke $svc"
            fi
          done

          if [ -z "$broke" ]; then
            echo "No breaking change against the merge base."
            exit 0
          fi

          # ---- Escape hatch ------------------------------------------------------------
          # An INTENTIONAL break must be expressible, or this gate gets deleted the first
          # time it is inconvenient - which is worse than the status quo. Mirrors
          # ci-review-verdict's SKIPPED (<reason>): a parenthesised, NON-EMPTY reason.
          # Read live from the API, NOT github.event.pull_request.body: a re-run replays the
          # ORIGINAL event payload, so a body edited to add the token would never be seen.
          # `|| true`: a gh hiccup must not abort the step with a stack trace instead of the
          # guidance below. An empty BODY simply finds no token, so this still fails CLOSED.
          BODY="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""' 2>/dev/null || true)"
          REASON='\([^)]*[^)[:space:]][^)]*\)'
          # ANCHORED TO A COMPLETE, STANDALONE LINE. Unanchored, the token matched ANYWHERE in the
          # body, so merely QUOTING it while discussing the mechanism waived the gate - that is not
          # hypothetical, #1183's own body did exactly that and had to be reworded to avoid
          # self-approving. Trailing prose now disqualifies the line. Leading indentation is
          # tolerated (an indented example still counts - see the header), and the trailing
          # `[[:space:]]*` absorbs the CR that GitHub stores in PR bodies (\r\n line endings), which
          # would otherwise make `$` never match and disable the escape hatch entirely.
          PATTERN="^[[:space:]]*Contract break:[[:space:]]*APPROVED[[:space:]]*${REASON}[[:space:]]*$"

          if printf '%s' "$BODY" | grep -qE "$PATTERN"; then
            echo "::warning::BREAKING contract change against main in:$broke - allowed by an explicit PR-body approval."
            printf '%s' "$BODY" | grep -E "$PATTERN" | head -1
            exit 0
          fi

          cat >&2 <<MSG
          BREAKING contract change vs the merge base ($BASE_SHA) in:$broke

          A consumer sitting on main today would break. Several consumers read these keys
          over the wire with no compile-time link (e.g. strategy-signal's UniverseResolver
          reads asOf / items / exchange / tradingsymbol from market-data's constituents
          response), so nothing else catches this.

          If the break is UNINTENTIONAL: fix the code. Re-capturing the spec will NOT
          silence this gate - the comparison is against the merge base, not your branch.

          If the break is INTENTIONAL and the consumers are being updated with it, add ONE
          line to the PR body, then re-run this job:

            Contract break: APPROVED (SENSEX chain rename; UniverseResolver updated in this PR)

          The reason is mandatory and must be non-empty - "why" is the whole point.
          Exempt: hotfix/* branches. Bypass: an --admin merge (deliberately possible).
          MSG
          exit 1

      - name: Removed-component-name gate (merge base vs this branch's code)
        # A SECOND gate beside openapi-diff, not a refinement of it: openapi-diff compares
        # structure and is blind to the component dictionary, so a removed-and-replaced component
        # name reads "backward compatible". See this file's header for the measured proof.
        # Skipped on push:main for the same reason as the gate above - the PR already merged.
        if: needs.changes.outputs.contracts == 'true' && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ steps.mergebase.outputs.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `comm` compares in the CURRENT locale's collation and only pairs lines correctly if its
          # inputs were sorted in that SAME collation. Pin one locale for the whole step so `sort`
          # and `comm` cannot disagree - a mismatch would mis-pair lines and silently under-report
          # removals, i.e. fail green.
          export LC_ALL=C

          case "$PR_BRANCH" in
            hotfix/*)
              echo "::notice::hotfix branch - removed-component-name gate exempt by design, the same carve-out the breaking gate takes."
              exit 0
              ;;
          esac

          # Every component key, qualified by its section ("schemas/Heatmap"). Only
          # components.schemas exists in all five specs today; qualifying costs one jq clause and
          # means a components.responses / securitySchemes entry cannot slip out unseen later.
          # Looking only where we already thought to look is how the openapi-diff blind spot
          # survived in the first place. Names are compared, never bytes, so `*.json eol=lf` and a
          # CRLF checkout are irrelevant here.
          component_names() {
            jq -r '(.components // {}) | to_entries[] | .key as $sec
                   | ((.value // {}) | keys[]) | "\($sec)/\(.)"' "$1" | sort
          }

          mkdir -p /tmp/namegate
          dropped=""
          : "${AY_CONTRACT_SERVICES_ALL:?the inventory step did not run - refusing to report the name gate green over an empty service list.}"
          for svc in $AY_CONTRACT_SERVICES_ALL; do
            echo "=== $svc ==="
            # BASE SIDE is the breaking gate's base side, off the SAME resolved merge base
            # (steps.mergebase.outputs.sha).
            # EVIDENCE OF ABSENCE, NOT ABSENCE OF A SUCCESSFUL READ. `if ! git show … ; then
            # continue` reads every failure - a git error, an unreadable object, a full /tmp
            # killing the redirect - as "new service", and silently skips that spec. All five
            # could skip and the step would still report green: a false green inside the gate
            # written to prevent false greens. So ASK whether the path exists (a checked
            # assignment - `var=$(cmd)` takes the command's status, so `set -e` aborts on a git
            # failure), then extract UNGUARDED so an extraction failure is a hard error.
            base_path="contracts/$svc.openapi.json"
            present="$(git ls-tree -r --name-only "$BASE_SHA" -- "$base_path")"
            if [ -z "$present" ]; then
              echo "::notice::$svc has no spec at the merge base (new service) - no published name can have been dropped."
              continue
            fi
            git show "$BASE_SHA:$base_path" > "/tmp/namegate/base-$svc.json"
            # BRANCH SIDE is the freshly captured Maven artifact for the Java services, so a
            # forgotten re-capture cannot hide a rename; optimizer-service has no such artifact
            # (Python) and uses its committed dump. NEITHER side is this branch's own committed
            # spec compared against itself - that self-comparison is the blindness this workflow's
            # header opens with, and re-capturing must never be able to silence a gate.
            # Keyed off the inventory's derived non-Java set rather than the literal name:
            # "has no Maven capture artifact" is the actual reason, and spelling it that way
            # means a future non-Java contract service gets the committed-spec side by
            # construction instead of silently looking for a target/ artifact that cannot exist.
            case " ${AY_CONTRACT_SERVICES_NON_JAVA-} " in
              *" $svc "*) fresh="contracts/$svc.openapi.json" ;;
              *)          fresh="services/$svc/target/contracts/$svc.openapi.json" ;;
            esac
            if [ ! -f "$fresh" ]; then
              echo "::error::$svc: the branch-side spec $fresh does not exist. The gate cannot answer its question, so it fails rather than reporting green."
              exit 1
            fi
            # Materialised to files, not process substitution: `set -o pipefail` then makes a jq
            # failure abort the step. Inside <(...) it would produce an empty list, and empty vs
            # empty is "nothing removed" - a false green in a step written to prevent one.
            component_names "/tmp/namegate/base-$svc.json" > "/tmp/namegate/base-$svc.names"
            component_names "$fresh" > "/tmp/namegate/fresh-$svc.names"
            gone="$(comm -23 "/tmp/namegate/base-$svc.names" "/tmp/namegate/fresh-$svc.names")"
            if [ -n "$gone" ]; then
              echo "::error::$svc drops component name(s) that main publishes:"
              echo "$gone" | sed 's/^/    /'
              dropped="$dropped $svc"
            else
              echo "no published component name dropped ($(wc -l < "/tmp/namegate/base-$svc.names") on main, $(wc -l < "/tmp/namegate/fresh-$svc.names") here)"
            fi
          done

          if [ -z "$dropped" ]; then
            echo "No component name removed against the merge base."
            exit 0
          fi

          # ---- Escape hatch: THE SAME ONE as the breaking gate, deliberately ------------------
          # Same token, same live-body read (a re-run replays the ORIGINAL event payload, so
          # github.event.pull_request.body would never see a body edited to add it), same
          # non-empty parenthesised reason, same COMPLETE-LINE anchoring (see the breaking gate's
          # comment for why the unanchored form waived on a mere quotation). One approval sentence
          # covers both gates; a second mechanism would just be another thing to forget - so these
          # three lines must stay byte-identical to their twin above.
          BODY="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""' 2>/dev/null || true)"
          REASON='\([^)]*[^)[:space:]][^)]*\)'
          PATTERN="^[[:space:]]*Contract break:[[:space:]]*APPROVED[[:space:]]*${REASON}[[:space:]]*$"

          if printf '%s' "$BODY" | grep -qE "$PATTERN"; then
            echo "::warning::component name(s) REMOVED against main in:$dropped - allowed by an explicit PR-body approval."
            printf '%s' "$BODY" | grep -E "$PATTERN" | head -1
            exit 0
          fi

          cat >&2 <<MSG
          COMPONENT NAME(S) REMOVED vs the merge base ($BASE_SHA) in:$dropped

          openapi-diff above is GREEN and that means nothing here: it compares structure, not the
          component dictionary, so a removed-and-replaced name reads "backward compatible". The
          names are the API for every generated client - contracts/gen/*.d.ts indexes them as
          components["schemas"]["<Name>"].

          The usual cause is a springdoc simple-name collision being split by renaming BOTH twins.
          Fix it ADDITIVELY: rename only the NEWCOMER with @Schema(name = "..."), and let the
          incumbent keep the name it already published. Wire keys and Java names do not change.

          If the removal is INTENTIONAL and consumers are being updated with it, add ONE line to
          the PR body, then re-run this job:

            Contract break: APPROVED (Heatmap split; contracts/gen + the OI page updated here)

          The reason is mandatory and must be non-empty. Exempt: hotfix/* branches.
          MSG
          exit 1

      - name: Warn - committed spec vs code (did you forget to re-capture?)
        if: needs.changes.outputs.contracts == 'true'
        # A DIFFERENT question from the gate above: that one asks "does this PR break a
        # consumer on main?", this one asks "is contracts/*.json stale vs the code in this
        # PR?". Warn-only by design - the answer is a missing chore, not a broken consumer.
        # optimizer-service is absent HERE too, and adding the name would be actively wrong:
        # `diff -q` is a BYTE diff, and a FastAPI dump's bytes churn across Python / fastapi /
        # pydantic versions (CI 3.12 / 0.115, dev 3.14 / 0.136) - it would warn forever on a
        # perfectly current file. It gets a SEMANTIC equivalent in the next step instead.
        run: |
          set -euo pipefail
          : "${AY_CONTRACT_SERVICES_JAVA:?the inventory step did not run - this step would warn about nothing and exit 0.}"
          for svc in $AY_CONTRACT_SERVICES_JAVA; do
            if ! diff -q "contracts/$svc.openapi.json" "services/$svc/target/contracts/$svc.openapi.json" > /dev/null 2>&1; then
              echo "::warning::contracts/$svc.openapi.json drifts from code - refresh it with -Dcontracts.capture=true"
            fi
          done

      # ---- optimizer-service, both halves of the chain (task_e2d15c21) ---------------------
      # app routes --(step A)--> api-surface.json --(step B)--> openapi.json
      #
      # BOTH halves must run in a REQUIRED job or the pair can agree with each other while both
      # lag the code — the exact false-green this chip exists to close, reproduced one level up.
      # An earlier revision delegated step A to ci-optimizer's pytest. That is NOT sufficient:
      # ci-optimizer is `paths:`-filtered and is not one of main's required contexts, so an
      # optimizer route change that re-captured neither artifact would pass every required check.
      # Nothing needed to merge past a red run — the required half simply never ran.
      #
      # The alternative (make ci-optimizer required) is a bigger, owner-visible move: it is
      # `paths:`-filtered, and a path-skipped required workflow stays Pending forever and blocks
      # the PR (see this file's task_db8bdf1e header). It would first need the same
      # classifier + step-gating restructure this workflow already has, THEN a branch-protection
      # change. Flagged for the owner as the cleaner consolidation; not assumed here.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: needs.changes.outputs.contracts == 'true' && needs.changes.outputs.optimizer == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/optimizer-service/requirements-dev.lock

      - name: A - optimizer-service API surface vs the LIVE app (task_e2d15c21)
        if: needs.changes.outputs.contracts == 'true' && needs.changes.outputs.optimizer == 'true'
        working-directory: services/optimizer-service
        # Runs THE canonical assertion (the same file ci-optimizer runs), not a reimplementation,
        # so there is one source of truth for what "the surface" means. Gated on the narrow
        # `optimizer` classification because it needs the service's dependency set installed;
        # nothing outside those paths can change the app's route table.
        run: |
          set -euo pipefail
          pip install --require-hashes -r requirements-dev.lock
          python -m pytest tests/test_openapi_contract.py -q

      - name: B - optimizer-service dump vs its asserted API surface (task_e2d15c21)
        if: needs.changes.outputs.contracts == 'true'
        # Compares two COMMITTED artifacts, so it needs no optimizer dependencies and cannot
        # false-fail on pydantic serialization churn - which is why it can run unconditionally,
        # on every contract-relevant PR, unlike step A. The dump had rotted to 7 paths while the
        # service served 36; nothing looked, for as long as it existed.
        # HARD, unlike the warn above, for two reasons in the script's docstring: it is fully
        # deterministic (two committed files, no toolchain), and the breaking gate refuses this
        # service, so it is the only structural check the dump gets.
        run: python3 .github/scripts/optimizer_spec_staleness.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.changes.outputs.contracts == 'true'
        with:
          node-version: "22"

      - name: Generated TS client compiles under tsc --strict
        if: needs.changes.outputs.contracts == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/tscheck
          # task_e2d15c21 - optimizer-service IS in this loop, unlike the two above. This one reads
          # the COMMITTED spec, not a Maven target/ artifact, so being Python costs it nothing, and
          # frontend-react's `gen:api` script has always regenerated its .d.ts - only CI never
          # checked. Its absence also meant `diff -r` reported "Only in contracts/gen:
          # optimizer-service.d.ts" on every run: a permanent, meaningless warning.
          # _ALL, not _JAVA: reading the committed spec is exactly what makes this the one loop
          # that never needed the Java/non-Java split.
          : "${AY_CONTRACT_SERVICES_ALL:?the inventory step did not run - an empty loop here would generate no clients and tsc would pass over zero files.}"
          for svc in $AY_CONTRACT_SERVICES_ALL; do
            npx -y openapi-typescript@7 "contracts/$svc.openapi.json" -o "/tmp/tscheck/$svc.d.ts"
          done
          diff -r contracts/gen /tmp/tscheck || echo "::warning::contracts/gen drifts - regenerate with npx openapi-typescript"
          cd /tmp/tscheck
          npm init -y > /dev/null
          npm install --no-save typescript@5.9 > /dev/null
          printf '{"compilerOptions":{"strict":true,"noEmit":true,"skipLibCheck":false},"include":["*.d.ts"]}' > tsconfig.json
          npx tsc -p tsconfig.json
