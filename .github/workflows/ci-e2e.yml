# Phase 27 (C-2.20): the regression net - Playwright smoke against the FULL
# mock compose stack (credential-free), on PRs to main + nightly. Container
# logs dump on failure. Later UI phases only APPEND journeys here.
name: ci-e2e

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 22 * * *" # nightly 04:00 IST
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build service jars (host-build pattern)
        run: ./mvnw -ntp -q -DskipTests package

      - name: Build frontend dist
        working-directory: frontend-ui
        run: |
          npm ci
          npm run build

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Smoke suite (global setup boots compose + waits for health)
        working-directory: e2e
        env:
          CI: "true"
        run: npx playwright test

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yml --env-file .env ps || true
          for c in $(docker ps -a --format '{{.Names}}' | grep '^ay-'); do
            echo "===== $c ====="
            docker logs --tail 200 "$c" || true
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7
