# Phase 27 (C-2.20): the regression net - Playwright smoke against the FULL
# mock compose stack (credential-free), on PRs to main + nightly. Container
# logs dump on failure. Later UI phases only APPEND journeys here.
name: ci-e2e

on:
  push:
    branches: [main] # audit P2: catch a merge-race break on main, not ~24h later at the nightly
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 22 * * *" # nightly 04:00 IST
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          # both npm ci calls below (frontend-react + e2e) hit the shared npm cache
          cache: npm
          cache-dependency-path: |
            frontend-react/package-lock.json
            e2e/package-lock.json

      - name: Build service jars (host-build pattern)
        run: ./mvnw -ntp -q -DskipTests package

      # React cutover: the gateway catch-all now serves frontend-react; compose builds
      # its nginx image from this host-built dist (the frontend-react Dockerfile COPYs dist/).
      - name: Build frontend dist
        working-directory: frontend-react
        run: |
          npm ci
          npm run build

      # Cache the downloaded browser binaries (the slow part of the install);
      # keyed on the e2e lockfile so a Playwright bump invalidates it. On a hit
      # `playwright install` just re-checks the OS deps, no ~120 MB download.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
          restore-keys: pw-${{ runner.os }}-

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Smoke suite (global setup boots compose + waits for health)
        working-directory: e2e
        env:
          CI: "true"
        run: npx playwright test

      # audit P2: the frontend-react e2e + axe a11y suite (OI pages, cockpit, data-ops, scalper
      # checklist, S24 mobile viewport) ran in NO CI — reuse the mock stack the smoke suite just
      # booted. Vite dev server proxies /api + /ws to the running gateway; reset the login limiter
      # (mock Redis db1) first so the one login in FE global-setup can't hit the smoke suite's
      # cooldown.
      - name: Frontend e2e + axe a11y (reuses the booted mock stack)
        working-directory: frontend-react
        env:
          CI: "true"
          E2E_OWNER_PASSWORD: e2e-owner-password
        run: |
          npx playwright install chromium   # FE playwright pins a different browser build than e2e/
          docker exec ay-redis redis-cli -n 1 EVAL "local k=redis.call('keys','login:*'); if #k>0 then redis.call('del',unpack(k)) end; return #k" 0 || true
          npx playwright test

      - name: Dump container logs on failure
        if: failure()
        env:
          # audit P1-7: compose interpolation is fail-closed (:?); the mock harness values
          ARTHA_DB_NAME: artha_mock
          ARTHA_REDIS_DB: "1"
        run: |
          docker compose -f deploy/docker-compose.yml --env-file .env ps || true
          for c in $(docker ps -a --format '{{.Names}}' | grep '^ay-'); do
            echo "===== $c ====="
            docker logs --tail 200 "$c" || true
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7
