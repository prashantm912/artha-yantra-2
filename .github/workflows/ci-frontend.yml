# Phase 25 (plan 9.6): lint -> unit tests (Vitest/jsdom) -> production build
# (budgets enforced by angular.json) -> nginx image. Path-filtered; gitleaks
# rides the repo-wide hook + the dedicated gitleaks workflow.
name: ci-frontend

on:
  pull_request:
    paths:
      - "frontend-ui/**"
      - "contracts/**"
      - ".github/workflows/ci-frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend-ui/**"
      - "contracts/**"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (ESLint + Stylelint, no-explicit-any, no raw hex)
        run: npm run lint

      - name: Unit tests (Vitest + jsdom)
        run: npm run test:ci

      - name: Production build (budgets enforced)
        run: npm run build

      - name: nginx image builds
        run: docker build -t arthayantra/frontend-ui:ci .
