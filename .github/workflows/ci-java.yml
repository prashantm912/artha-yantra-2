# ci-java (A.10): the mechanical reviewer for JVM code. Path-filtered so a
# frontend commit never rebuilds the JVM images. Stages: gitleaks ->
# checkstyle/Error Prone + unit + Testcontainers IT (pinned production
# images) + Modulith verify + JaCoCo (services >= 60% line) -> image build
# -> GHCR push on main only.
name: ci-java

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "libs/**"
      - "tools/**"
      - "pom.xml"
      - ".mvn/**"
      - "config/checkstyle/**"
      # deploy/flyway: the ITs migrate the REAL lineages into Testcontainers, so a
      # migration-only PR must run them (audit P2) — else a column rename/type change
      # merges green and breaks every service IT on the NEXT unrelated PR.
      - "deploy/flyway/**"
      - ".github/workflows/ci-java.yml"
  pull_request:
    paths:
      - "services/**"
      - "libs/**"
      - "tools/**"
      - "pom.xml"
      - ".mvn/**"
      - "config/checkstyle/**"
      # deploy/flyway: the ITs migrate the REAL lineages into Testcontainers, so a
      # migration-only PR must run them (audit P2) — else a column rename/type change
      # merges green and breaks every service IT on the NEXT unrelated PR.
      - "deploy/flyway/**"
      - ".github/workflows/ci-java.yml"

concurrency:
  group: ci-java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # pinned CLI (same version as the local pre-commit hook); full-history
      # scan, no GitHub-API permissions needed
      - name: gitleaks full-history scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner .

  it-naming-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No failsafe plugin exists: *IT.java / *ITCase.java classes are silently NEVER run by
      # surefire (CLAUDE.md build rule). Fail loudly on the naming instead of trusting prose.
      - name: No silently-skipped *IT.java test classes
        run: |
          hits=$(git ls-files '*IT.java' '*ITCase.java')
          if [ -n "$hits" ]; then
            echo "::error::These test classes match *IT/*ITCase and are silently skipped by surefire — rename to *IntegrationTest or *Test:"
            echo "$hits"
            exit 1
          fi

  build-test:
    runs-on: ubuntu-latest
    # Shard the reactor by service so the Testcontainers ITs (the 2-core
    # bottleneck — a single serial `verify` is ~23 min) run on parallel
    # runners. Each shard `-am`-builds its upstream libs, so every lib still
    # gets compiled + checkstyle + Error Prone + JaCoCo + unit-tested in at
    # least one shard; collectively all 4 services + all 5 libs are covered
    # (black76-math rides market-data/backtest, the rest ride every service).
    # jacoco-check is bound PER MODULE (not an aggregate root goal), so the
    # >= 60% line gate is enforced unchanged inside whichever shard owns the
    # module. ModularityTest lives in market-data + strategy-signal — both
    # shards present. fail-fast off so one shard's break doesn't mask others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: market-data
            modules: services/market-data-service
          - shard: backtest
            modules: services/backtest-service
          - shard: strategy-gateway
            modules: services/strategy-signal-service,services/edge-gateway
    name: build-test (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # checkstyle (validate) + Error Prone (compile) + JUnit unit tests +
      # Testcontainers ITs on the pinned production tags (redis:7.4-alpine)
      # + ApplicationModules.verify() + JaCoCo >= 60% line on services
      - name: Build, lint, test, coverage
        # rerunFailingTestsCount retries a flaky test in-run (the Testcontainers/awaitility ITs
        # occasionally time out on the 2-core runner); a genuinely failing test still fails after
        # the retries, so this hides flakes without hiding real breakage.
        run: ./mvnw -ntp -B -pl ${{ matrix.modules }} -am verify -Dsurefire.rerunFailingTestsCount=2
      # surefire records rerun results as <flakyFailure>/<flakyError> in TEST-*.xml; without this
      # a retried-green test vanishes — surface it so flake accumulation stays visible.
      - name: Flaky-test paper trail (retried-green markers)
        if: always()
        run: |
          flaky=$(grep -rl -e '<flakyFailure' -e '<flakyError' --include 'TEST-*.xml' . || true)
          if [ -n "$flaky" ]; then
            echo "::warning title=Flaky tests retried green (shard ${{ matrix.shard }})::see step log for details"
            for f in $flaky; do
              echo "== $f"
              grep -o 'testcase name="[^"]*"' "$f" | sort -u
            done
          fi

  build-images:
    needs: build-test
    # PR wall-clock: on a pull_request this job only VALIDATES that the Dockerfiles build (the
    # login/push steps below are already gated main+push-only), yet `needs: build-test` makes it
    # wait out the ~8m market-data shard first — ~2.5m of pure serial tail on every PR. Skip it on
    # PRs; the Dockerfile build is still validated on the main-push run, before any deploy. On push
    # (main only, per the trigger) the job is UNCHANGED: needs build-test, then build + push.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # context/dockerfile mirror deploy/docker-compose.yml exactly: market-data-service's
        # Dockerfile COPYs deploy/dev-certs/ + services/.../target (repo-root context), while
        # edge-gateway's COPYs target/ (service-dir context). A uniform context breaks one or
        # the other.
        include:
          - service: edge-gateway
            context: services/edge-gateway
            dockerfile: services/edge-gateway/Dockerfile
          - service: market-data-service
            context: .
            dockerfile: services/market-data-service/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package ${{ matrix.service }}
        run: ./mvnw -ntp -B -pl services/${{ matrix.service }} -am package -DskipTests
      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }} -f ${{ matrix.dockerfile }} ${{ matrix.context }}
      # GHCR push on main only (private registry BY CHOICE, A.16/A13)
      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }} \
                     ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
          docker push ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
