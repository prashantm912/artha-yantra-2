# ci-java (A.10): the mechanical reviewer for JVM code. Stages: gitleaks ->
# checkstyle/Error Prone + unit + Testcontainers IT (pinned production
# images) + Modulith verify + JaCoCo (services >= 60% line) -> image build
# -> GHCR push on main only.
#
# task_db8bdf1e - WHY THE `paths:` FILTER IS GONE AND THE FILTERING MOVED INTO A JOB.
#
# `gitleaks` and the three `build-test` shards are REQUIRED status checks on main. A
# workflow-level `paths:` filter made them unsatisfiable on any PR that touched none of
# those paths: GitHub's own docs are explicit that the two skip mechanisms are NOT
# equivalent —
#
#   "If a job within a workflow is skipped due to a conditional, it will report its status
#    as 'Success'. [...] if a workflow is skipped due to path filtering, branch filtering or
#    a commit message, then checks associated with that workflow will remain in a 'Pending'
#    state [and] a pull request that requires those checks to be successful will be blocked
#    from merging. [...] You should not use path or branch filtering to skip workflow runs if
#    the workflow is required."
#
# So every docs-only PR sat BLOCKED and got merged with `--admin`, which bypasses ALL
# required checks including a genuinely red one. The workflow now always triggers and a cheap
# `changes` job decides what actually needs to run.
#
# GATE THE STEPS, NEVER THE JOB — the second trap, and it is subtler than the first. It is
# tempting to put `if: needs.changes.outputs.java == 'true'` on `build-test` and lean on
# "skipped jobs report Success". That does not work here, for two independent reasons:
#   1. `jobs.<id>.if` is evaluated BEFORE `strategy.matrix` is expanded. With the job-level `if`
#      false, the three `build-test (<shard>)` check runs are never CREATED — and a Success rule
#      cannot rescue a check name that does not exist. It would have rebuilt the exact
#      never-reports trap this file exists to remove. (Caught in cross-vendor review, 2026-07-26.)
#   2. A job skipped because its dependency failed also reports SKIPPED, which branch protection
#      COUNTS AS SATISFIED. Since `changes` is not itself a required context, a broken classifier
#      would have silently waved code through with no gate having run.
# So every gated job carries `if: always()`, a first step that FAILS CLOSED when the classifier
# did not succeed, and per-step `if:` on the expensive work. Job NAMES are unchanged, so the six
# required contexts on main keep resolving.
#
# `gitleaks` is deliberately NOT gated: a secret can land in any file type, so a docs-only
# PR is exactly when you still want the scan. It costs ~30s.
#
# PER-SHARD TARGETING (2026-08-03). The classifier used to emit ONE `java` boolean, so any
# qualifying path ran all three shards and the ~8-minute market-data shard was the floor on
# every PR — a catalog-only edit paid the full suite. It now emits one boolean PER SHARD
# (`market_data` / `backtest` / `strategy_gateway`) and each matrix leg gates on its own.
# Three properties are load-bearing and none of them may regress:
#   1. The three `build-test (<shard>)` names still ALWAYS report. A leg with no work runs
#      zero steps and reports SUCCESS; it never vanishes. (Same reason the job-level `if` is
#      still forbidden — see above.)
#   2. Shared code fans out to EVERY dependent shard. Measured, not assumed: `mvnw -o -pl
#      <shard> -am validate` on each shard shows all five libs in all three reactors, so a
#      `libs/` edit sets all three booleans. Under-triggering here would silently skip the
#      tests that catch a shared-lib break — strictly worse than the over-triggering it
#      replaces, so the fail-safe direction everywhere is RUN.
#   3. A wrong `false` is the dangerous failure: it reports a required check green having
#      built nothing. So the mapping lives in .github/scripts/classify_java_shards.sh with a
#      test (classify_java_shards_test.sh) that runs in the `changes` job below, and each leg
#      carries a guard that turns an undecidable gate value into RED rather than a no-op pass.
# The classifier also now matches `contracts/` (per owning service), which the single-boolean
# version did not — the committed-spec and trial-metrics-catalog gates were unreachable.
name: ci-java

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap path classifier. Replaces the workflow-level `paths:` filter (see the header):
  # this ALWAYS runs, so the jobs downstream of it always report a conclusion.
  changes:
    runs-on: ubuntu-latest
    outputs:
      market_data: ${{ steps.classify.outputs.market_data }}
      backtest: ${{ steps.classify.outputs.backtest }}
      strategy_gateway: ${{ steps.classify.outputs.strategy_gateway }}
      java: ${{ steps.classify.outputs.java }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The diff needs the merge base (PR) or the pushed range (main); the default
          # shallow fetch contains neither.
          fetch-depth: 0
      # Guards the path->shard mapping itself. A classifier bug that emits `false` for a shard
      # that should have run reports a REQUIRED context green having built nothing — the one
      # failure mode nothing downstream can catch. Runs before the real classification so a
      # broken mapping fails here, loudly, instead of waving the PR through.
      - name: Classifier self-test
        run: bash .github/scripts/classify_java_shards_test.sh
      - name: Classify changed paths
        id: classify
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # FAIL SAFE = RUN. Any doubt about what changed (unresolvable base, first push on
          # a branch, an event shape we did not anticipate) must run the full suite; the
          # failure mode of guessing "true" is a wasted 8 minutes, and of guessing "false"
          # is an untested merge.
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" || true
            base="$(git merge-base HEAD "origin/$BASE_REF" 2>/dev/null || true)"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            # A force-push or a squash-merge can leave `before` unreachable in this checkout.
            git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null && base="$BEFORE_SHA" || base=""
          fi

          if [ -z "$base" ]; then
            echo "::notice::change base did not resolve — running the full JVM suite (fail-safe)"
            {
              echo "market_data=true"
              echo "backtest=true"
              echo "strategy_gateway=true"
              echo "java=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "diff base: $base"
          # --no-renames is LOAD-BEARING, not a style choice. `git diff --name-only` reports
          # only the DESTINATION of a detected rename, so moving a file from one shard to
          # another makes the SOURCE shard invisible -- it reports its required context GREEN
          # while code was deleted out from under it and its tests never ran. Reproduced against
          # repository rename commit bc9ae69f (cross-vendor review, 2026-08-03), and directly:
          # a backtest -> market-data move classified backtest=false with rename detection on,
          # backtest=true with it off. A rename is exactly when BOTH shards must build.
          files="$(git diff --no-renames --name-only "$base" HEAD)"
          echo "$files"

          # The path -> shard mapping lives in a tested script (see its header for how the
          # fan-out was derived from the real `-am` reactors).
          #
          # #1246 added contracts/metrics/ to the single `java` boolean this replaces, because a
          # catalog-ONLY edit matched nothing and the shards reported pass WITHOUT RUNNING
          # TrialMetricsCatalogConsistencyTest. That coverage is PRESERVED and narrowed: the
          # script routes contracts/metrics/ to the `backtest` shard specifically -- the shard
          # that actually owns that test -- instead of all three. Pinned by an assertion in
          # classify_java_shards_test.sh so it cannot silently regress to routing nowhere.
          out="$(bash .github/scripts/classify_java_shards.sh <<<"$files")"
          echo "--- shard classification ---"
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"

          # HARD FAILURE, not a warning (owner decision 2026-08-03). Fanning out to all three
          # shards does not BUILD an unmapped service — it looks busy while providing no coverage,
          # and CLAUDE.md's rule is "add a matrix shard or its tests NEVER run in CI". Failing here
          # forces the mapping to be updated in the same PR that moves a service. Accepted cost: a
          # service RENAME or REMOVAL also fails until KNOWN_SERVICES is updated, which is exactly
          # when the mapping needs attention. The message below has to make that case readable,
          # because --no-renames means a rename reports BOTH the old and the new directory.
          unowned="$(grep '^unowned_services=' <<<"$out" | cut -d= -f2-)"
          if [ -n "$unowned" ]; then
            echo "::error title=Service directory not covered by any build-test shard::$unowned — no shard builds it, so its tests would never run in CI. If this is a NEW service: add a matrix shard to build-test in ci-java.yml AND add the directory to KNOWN_SERVICES in .github/scripts/classify_java_shards.sh. If this is a RENAME or a REMOVAL: the classifier runs with --no-renames on purpose, so BOTH the old and the new directory are listed here — update KNOWN_SERVICES (and the shard's \`modules:\`) to match the new layout."
            echo "::error::unowned service directories: $unowned"
            exit 1
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      # pinned CLI (same version as the local pre-commit hook); full-history
      # scan, no GitHub-API permissions needed
      - name: gitleaks full-history scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .

  # Same shape and same reasoning as it-naming-guard below: a pure-file repo-hygiene rule, ungated
  # so it runs on EVERY PR rather than only classified ones, ~10s, no classifier entry needed.
  # Guards the two skill trees (.claude/skills, .agents/skills) that load into agent sessions.
  # It deliberately does NOT ride a build-test shard: a guard whose whole purpose is "never merge
  # past a red check with --admin" must not itself be the slowest, flakiest required context.
  # See the script header for the full trade. This job WAS promoted to a required context on
  # 2026-08-04 (#1298) and is now binding — the header's original "not required" caveat is resolved.
  runbook-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # The guard's own red-proofs, run BEFORE the real check so a guard edit that would let a
      # prescription through fails here rather than reporting green.
      - name: Guard self-test
        run: bash .github/scripts/check_runbook_hygiene_test.sh
      - name: Runbook hygiene
        run: bash .github/scripts/check_runbook_hygiene.sh

  it-naming-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # No failsafe plugin exists: *IT.java / *ITCase.java classes are silently NEVER run by
      # surefire (CLAUDE.md build rule). Fail loudly on the naming instead of trusting prose.
      - name: No silently-skipped *IT.java test classes
        run: |
          hits=$(git ls-files '*IT.java' '*ITCase.java')
          if [ -n "$hits" ]; then
            echo "::error::These test classes match *IT/*ITCase and are silently skipped by surefire — rename to *IntegrationTest or *Test:"
            echo "$hits"
            exit 1
          fi

  build-test:
    needs: changes
    # ALWAYS materialise, gate the STEPS — never the job. `jobs.<id>.if` is evaluated BEFORE
    # `strategy.matrix` is expanded, so a false job-level `if` means the three
    # `build-test (<shard>)` check runs are never created at all. "Skipped jobs report Success"
    # cannot rescue a check name that does not exist, so gating the job here would have rebuilt
    # the exact never-reports trap this PR exists to remove (caught in cross-vendor review).
    # `always()` also keeps the contexts reporting when the classifier itself fails — the first
    # step below turns that into an explicit RED rather than a silent pass.
    if: always()
    runs-on: ubuntu-latest
    # Shard the reactor by service so the Testcontainers ITs (the 2-core
    # bottleneck — a single serial `verify` is ~23 min) run on parallel
    # runners. Each shard `-am`-builds its upstream libs, so every lib still
    # gets compiled + checkstyle + Error Prone + JaCoCo + unit-tested in at
    # least one shard; collectively all 4 services + all 5 libs are covered.
    # (This comment used to add "black76-math rides market-data/backtest, the
    # rest ride every service" — that is STALE. Measured 2026-08-03 with
    # `mvnw -o -pl <shard> -am validate`: ALL FIVE libs are in ALL THREE shard
    # reactors — black76-math included, because strategy-signal-service/pom.xml
    # declares it DIRECTLY. The per-shard classifier's fan-out rule depends on
    # this, so do not narrow a `libs/` path to one shard on the old claim.)
    # jacoco-check is bound PER MODULE (not an aggregate root goal), so the
    # >= 60% line gate is enforced unchanged inside whichever shard owns the
    # module. ModularityTest lives in market-data + strategy-signal — both
    # shards present. fail-fast off so one shard's break doesn't mask others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: market-data
            gate: market_data
            modules: services/market-data-service
          - shard: backtest
            gate: backtest
            modules: services/backtest-service
          - shard: strategy-gateway
            gate: strategy_gateway
            modules: services/strategy-signal-service,services/edge-gateway
    name: build-test (${{ matrix.shard }})
    steps:
      # FAIL CLOSED. A classifier that errored or was cancelled must not read as "nothing to
      # build" — without this, `always()` would turn a broken classifier into three green
      # required checks.
      - name: Classifier must have succeeded
        if: needs.changes.result != 'success'
        run: |
          echo "::error::the changes classifier did not succeed (${{ needs.changes.result }}) — refusing to report this shard green without knowing what changed"
          exit 1
      # FAIL CLOSED, second axis. Every step below is gated on `needs.changes.outputs[matrix.gate]`,
      # a DYNAMIC index. If that expression ever stops resolving (an output renamed, a matrix leg
      # added without a `gate:`, a typo), it yields the empty string — which is not 'true', so every
      # step silently no-ops and the shard reports GREEN having built nothing. There is no other
      # trip-wire for that, so assert the value is a decidable boolean before trusting it.
      - name: Shard gate must resolve to a boolean
        if: needs.changes.result == 'success' && needs.changes.outputs[matrix.gate] != 'true' && needs.changes.outputs[matrix.gate] != 'false'
        run: |
          echo "::error::shard gate '${{ matrix.gate }}' resolved to '${{ needs.changes.outputs[matrix.gate] }}' (expected 'true' or 'false') — refusing to report this shard green without a decision"
          exit 1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: needs.changes.outputs[matrix.gate] == 'true'
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        if: needs.changes.outputs[matrix.gate] == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # checkstyle (validate) + Error Prone (compile) + JUnit unit tests +
      # Testcontainers ITs on the pinned production tags (redis:7.4-alpine)
      # + ApplicationModules.verify() + JaCoCo >= 60% line on services
      - name: Build, lint, test, coverage
        if: needs.changes.outputs[matrix.gate] == 'true'
        # rerunFailingTestsCount retries a flaky test in-run (the Testcontainers/awaitility ITs
        # occasionally time out on the 2-core runner); a genuinely failing test still fails after
        # the retries, so this hides flakes without hiding real breakage.
        run: ./mvnw -ntp -B -pl ${{ matrix.modules }} -am verify -Dsurefire.rerunFailingTestsCount=2
      # surefire records rerun results as <flakyFailure>/<flakyError> in TEST-*.xml; without this
      # a retried-green test vanishes — surface it so flake accumulation stays visible.
      - name: Flaky-test paper trail (retried-green markers)
        if: always() && needs.changes.outputs[matrix.gate] == 'true'
        run: |
          flaky=$(grep -rl -e '<flakyFailure' -e '<flakyError' --include 'TEST-*.xml' . || true)
          if [ -n "$flaky" ]; then
            echo "::warning title=Flaky tests retried green (shard ${{ matrix.shard }})::see step log for details"
            for f in $flaky; do
              echo "== $f"
              grep -o 'testcase name="[^"]*"' "$f" | sort -u
            done
          fi

  build-images:
    needs: [changes, build-test]
    # PR wall-clock: on a pull_request this job only VALIDATES that the Dockerfiles build (the
    # login/push steps below are already gated main+push-only), yet `needs: build-test` makes it
    # wait out the ~8m market-data shard first — ~2.5m of pure serial tail on every PR. Skip it on
    # PRs; the Dockerfile build is still validated on the main-push run, before any deploy. On push
    # (main only, per the trigger) the job is UNCHANGED: needs build-test, then build + push.
    # `build-test` now always SUCCEEDS (it materialises the required contexts and no-ops when no
    # JVM path changed), so it can no longer act as this job's implicit "was there Java work?"
    # gate — without the classifier clause a docs-only push to main would package and build
    # images for an unchanged tree. This job is not a required context, so gating the JOB is fine.
    if: github.event_name == 'push' && needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # context/dockerfile mirror deploy/docker-compose.yml exactly: market-data-service's
        # Dockerfile COPYs deploy/dev-certs/ + services/.../target (repo-root context), while
        # edge-gateway's COPYs target/ (service-dir context). A uniform context breaks one or
        # the other.
        include:
          - service: edge-gateway
            context: services/edge-gateway
            dockerfile: services/edge-gateway/Dockerfile
          - service: market-data-service
            context: .
            dockerfile: services/market-data-service/Dockerfile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package ${{ matrix.service }}
        run: ./mvnw -ntp -B -pl services/${{ matrix.service }} -am package -DskipTests
      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }} -f ${{ matrix.dockerfile }} ${{ matrix.context }}
      # GHCR push on main only (private registry BY CHOICE, A.16/A13)
      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }} \
                     ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
          docker push ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
