# ci-java (A.10): the mechanical reviewer for JVM code. Stages: gitleaks ->
# checkstyle/Error Prone + unit + Testcontainers IT (pinned production
# images) + Modulith verify + JaCoCo (services >= 60% line) -> image build
# -> GHCR push on main only.
#
# task_db8bdf1e - WHY THE `paths:` FILTER IS GONE AND THE FILTERING MOVED INTO A JOB.
#
# `gitleaks` and the three `build-test` shards are REQUIRED status checks on main. A
# workflow-level `paths:` filter made them unsatisfiable on any PR that touched none of
# those paths: GitHub's own docs are explicit that the two skip mechanisms are NOT
# equivalent —
#
#   "If a job within a workflow is skipped due to a conditional, it will report its status
#    as 'Success'. [...] if a workflow is skipped due to path filtering, branch filtering or
#    a commit message, then checks associated with that workflow will remain in a 'Pending'
#    state [and] a pull request that requires those checks to be successful will be blocked
#    from merging. [...] You should not use path or branch filtering to skip workflow runs if
#    the workflow is required."
#
# So every docs-only PR sat BLOCKED and got merged with `--admin`, which bypasses ALL
# required checks including a genuinely red one. The workflow now always triggers; a cheap
# `changes` job decides what actually needs to run, and the heavy jobs are `if:`-gated so
# they report Success-by-skip instead of never reporting. Job NAMES are unchanged, so the
# six required contexts on main keep resolving.
#
# `gitleaks` is deliberately NOT gated: a secret can land in any file type, so a docs-only
# PR is exactly when you still want the scan. It costs ~30s.
name: ci-java

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap path classifier. Replaces the workflow-level `paths:` filter (see the header):
  # this ALWAYS runs, so the jobs downstream of it always report a conclusion.
  changes:
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.classify.outputs.java }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The diff needs the merge base (PR) or the pushed range (main); the default
          # shallow fetch contains neither.
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # FAIL SAFE = RUN. Any doubt about what changed (unresolvable base, first push on
          # a branch, an event shape we did not anticipate) must run the full suite; the
          # failure mode of guessing "true" is a wasted 8 minutes, and of guessing "false"
          # is an untested merge.
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" || true
            base="$(git merge-base HEAD "origin/$BASE_REF" 2>/dev/null || true)"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            # A force-push or a squash-merge can leave `before` unreachable in this checkout.
            git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null && base="$BEFORE_SHA" || base=""
          fi

          if [ -z "$base" ]; then
            echo "::notice::change base did not resolve — running the full JVM suite (fail-safe)"
            echo "java=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "diff base: $base"
          files="$(git diff --name-only "$base" HEAD)"
          echo "$files"

          # Same path set the workflow-level `paths:` filter used to carry. deploy/flyway is
          # in it because the ITs migrate the REAL lineages into Testcontainers (audit P2) —
          # else a column rename/type change merges green and breaks every service IT on the
          # NEXT unrelated PR.
          if echo "$files" | grep -Eq '^(services/|libs/|tools/|\.mvn/|config/checkstyle/|deploy/flyway/|pom\.xml$|\.github/workflows/ci-java\.yml$)'; then
            echo "java=true" >> "$GITHUB_OUTPUT"
          else
            echo "java=false" >> "$GITHUB_OUTPUT"
          fi

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      # pinned CLI (same version as the local pre-commit hook); full-history
      # scan, no GitHub-API permissions needed
      - name: gitleaks full-history scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .

  it-naming-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # No failsafe plugin exists: *IT.java / *ITCase.java classes are silently NEVER run by
      # surefire (CLAUDE.md build rule). Fail loudly on the naming instead of trusting prose.
      - name: No silently-skipped *IT.java test classes
        run: |
          hits=$(git ls-files '*IT.java' '*ITCase.java')
          if [ -n "$hits" ]; then
            echo "::error::These test classes match *IT/*ITCase and are silently skipped by surefire — rename to *IntegrationTest or *Test:"
            echo "$hits"
            exit 1
          fi

  build-test:
    needs: changes
    # Skip-as-Success (see the header): on a PR that touches no JVM path the three shards
    # report skipped, which branch protection accepts, instead of never reporting at all.
    if: needs.changes.outputs.java == 'true'
    runs-on: ubuntu-latest
    # Shard the reactor by service so the Testcontainers ITs (the 2-core
    # bottleneck — a single serial `verify` is ~23 min) run on parallel
    # runners. Each shard `-am`-builds its upstream libs, so every lib still
    # gets compiled + checkstyle + Error Prone + JaCoCo + unit-tested in at
    # least one shard; collectively all 4 services + all 5 libs are covered
    # (black76-math rides market-data/backtest, the rest ride every service).
    # jacoco-check is bound PER MODULE (not an aggregate root goal), so the
    # >= 60% line gate is enforced unchanged inside whichever shard owns the
    # module. ModularityTest lives in market-data + strategy-signal — both
    # shards present. fail-fast off so one shard's break doesn't mask others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: market-data
            modules: services/market-data-service
          - shard: backtest
            modules: services/backtest-service
          - shard: strategy-gateway
            modules: services/strategy-signal-service,services/edge-gateway
    name: build-test (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # checkstyle (validate) + Error Prone (compile) + JUnit unit tests +
      # Testcontainers ITs on the pinned production tags (redis:7.4-alpine)
      # + ApplicationModules.verify() + JaCoCo >= 60% line on services
      - name: Build, lint, test, coverage
        # rerunFailingTestsCount retries a flaky test in-run (the Testcontainers/awaitility ITs
        # occasionally time out on the 2-core runner); a genuinely failing test still fails after
        # the retries, so this hides flakes without hiding real breakage.
        run: ./mvnw -ntp -B -pl ${{ matrix.modules }} -am verify -Dsurefire.rerunFailingTestsCount=2
      # surefire records rerun results as <flakyFailure>/<flakyError> in TEST-*.xml; without this
      # a retried-green test vanishes — surface it so flake accumulation stays visible.
      - name: Flaky-test paper trail (retried-green markers)
        if: always()
        run: |
          flaky=$(grep -rl -e '<flakyFailure' -e '<flakyError' --include 'TEST-*.xml' . || true)
          if [ -n "$flaky" ]; then
            echo "::warning title=Flaky tests retried green (shard ${{ matrix.shard }})::see step log for details"
            for f in $flaky; do
              echo "== $f"
              grep -o 'testcase name="[^"]*"' "$f" | sort -u
            done
          fi

  build-images:
    needs: build-test
    # PR wall-clock: on a pull_request this job only VALIDATES that the Dockerfiles build (the
    # login/push steps below are already gated main+push-only), yet `needs: build-test` makes it
    # wait out the ~8m market-data shard first — ~2.5m of pure serial tail on every PR. Skip it on
    # PRs; the Dockerfile build is still validated on the main-push run, before any deploy. On push
    # (main only, per the trigger) the job is UNCHANGED: needs build-test, then build + push.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        # context/dockerfile mirror deploy/docker-compose.yml exactly: market-data-service's
        # Dockerfile COPYs deploy/dev-certs/ + services/.../target (repo-root context), while
        # edge-gateway's COPYs target/ (service-dir context). A uniform context breaks one or
        # the other.
        include:
          - service: edge-gateway
            context: services/edge-gateway
            dockerfile: services/edge-gateway/Dockerfile
          - service: market-data-service
            context: .
            dockerfile: services/market-data-service/Dockerfile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package ${{ matrix.service }}
        run: ./mvnw -ntp -B -pl services/${{ matrix.service }} -am package -DskipTests
      - name: Build image
        run: docker build -t ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }} -f ${{ matrix.dockerfile }} ${{ matrix.context }}
      # GHCR push on main only (private registry BY CHOICE, A.16/A13)
      - name: Login to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }} \
                     ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
          docker push ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
