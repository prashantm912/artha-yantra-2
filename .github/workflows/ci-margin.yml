# ci-margin (§8): the mechanical reviewer for margin-service (Python SPAN
# appliance). Path-filtered so a JVM/frontend commit never runs it. Stages:
# gitleaks -> ruff + pytest (>= 75% line) -> image build -> GHCR push on main only.
# A NEW service that is not added to CI never gets tested (CLAUDE.md sharding rule).
name: ci-margin

on:
  push:
    branches: [main]
    paths:
      - "services/margin-service/**"
      - ".github/workflows/ci-margin.yml"
  pull_request:
    paths:
      - "services/margin-service/**"
      - ".github/workflows/ci-margin.yml"

concurrency:
  group: ci-margin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: gitleaks full-history scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .

  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/margin-service
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies (hash-locked)
        run: pip install --require-hashes -r requirements-dev.lock
      - name: ruff
        run: ruff check .
      - name: pytest (>= 75% line)
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=75

  build-image:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build image
        # repo-root context so the Dockerfile's conditional deploy/dev-certs/ CA layer resolves
        run: docker build -t arthayantra/margin-service:ci -f services/margin-service/Dockerfile .
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag arthayantra/margin-service:ci ghcr.io/${{ github.repository_owner }}/margin-service:latest
          docker push ghcr.io/${{ github.repository_owner }}/margin-service:latest
