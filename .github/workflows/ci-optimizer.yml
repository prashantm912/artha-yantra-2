# ci-optimizer (Phase 33 / CD-15): the mechanical reviewer for optimizer-service
# (Python). Path-filtered so a JVM/frontend commit never runs it. Stages:
# gitleaks -> ruff + pytest (>= 75% line) -> image build -> GHCR push on main only.
name: ci-optimizer

# contracts/metrics/** is in `paths:` because app/metrics_catalog.py DERIVES the objective
# allow-list from the shared trial-metrics catalog — a catalog-only edit changes this service's
# behaviour without touching a file under services/optimizer-service/. Measured 2026-08-03: such
# an edit triggered neither this workflow nor ci-java, so the one file the cross-language contract
# exists to protect was covered by no gate at all.
on:
  push:
    branches: [main]
    paths:
      - "services/optimizer-service/**"
      - "contracts/metrics/**"
      - ".github/workflows/ci-optimizer.yml"
  pull_request:
    paths:
      - "services/optimizer-service/**"
      - "contracts/metrics/**"
      - ".github/workflows/ci-optimizer.yml"

concurrency:
  group: ci-optimizer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: gitleaks full-history scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .

  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/optimizer-service
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev dependencies (hash-locked)
        run: pip install --require-hashes -r requirements-dev.lock
      - name: ruff
        run: ruff check .
      - name: pytest (>= 75% line)
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=75

  build-image:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build image
        # repo-root context so the Dockerfile's conditional deploy/dev-certs/ CA layer resolves
        run: docker build -t arthayantra/optimizer-service:ci -f services/optimizer-service/Dockerfile .
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag arthayantra/optimizer-service:ci ghcr.io/${{ github.repository_owner }}/optimizer-service:latest
          docker push ghcr.io/${{ github.repository_owner }}/optimizer-service:latest
