# Pre-commit hooks (A.9). Lint hooks are added as each stack appears
# (Java checkstyle below per Phase 4 / COMMON 10.6; ruff/ESLint arrive with
# their stacks).
#
# gitleaks runs as a SYSTEM hook against the pinned binary (8.30.1, installed
# via `winget install Gitleaks.Gitleaks` / `brew install gitleaks`): Windows
# Smart App Control blocks the unsigned binary the canonical golang-language
# hook builds locally, so the upstream hook cannot run on the owner machine.
# CI runs its own gitleaks step in every workflow (A.10) — the hook here is
# the first line, not the only line.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        language: system
        # python launcher resolves the gitleaks binary even when it is not on
        # the current shell's PATH (winget puts it on NEW shells only)
        entry: python tools/precommit/run-gitleaks.py
        pass_filenames: false
        always_run: true
      # Phase 4: Checkstyle (google_checks @ 120 col) on commits touching Java
      - id: maven-checkstyle
        name: maven checkstyle (reactor)
        language: system
        entry: python tools/precommit/run-checkstyle.py
        types: [java]
        pass_filenames: false
