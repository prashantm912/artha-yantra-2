# ArthaYantra 2.0 — single compose file, three activation tiers (A.1 / D14, D16)
#   default        : core stateful containers (+ app services as they land)
#   --profile dev-tools : Adminer, RedisInsight, loopback publishes for T2
# Mock vs live is orthogonal: SPRING_PROFILES_ACTIVE in .env (D13).
# Every container: pinned tag, mem_limit, healthcheck, json-file log caps.
# Operate via ay.ps1 only (WSL2: pwsh ./ay.ps1) — project-scoped compose, never docker kill.

name: arthayantra

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

secrets:
  postgres_password:
    # generated locally by `ay up` if missing — never committed (A.9)
    file: ./secrets/postgres_password
  # Phase 12 (B-2/D13): Kite material + AES-GCM master key as FILES, never env
  # vars — `docker inspect` must show no secret values. `ay up` creates empty
  # kite placeholders (mock needs none) and generates a real master key.
  kite_api_key:
    file: ./secrets/kite_api_key
  kite_api_secret:
    file: ./secrets/kite_api_secret
  artha_master_key:
    file: ./secrets/artha_master_key
  # OpenAlgo's OWN generated API key (NOT the fronted broker's secret) — plan §2/§3.
  # market-data-service reads it only when a source.* capability is routed to openalgo.
  openalgo_api_key:
    file: ./secrets/openalgo_api_key
  # Dedicated Upstox Market-Information ANALYTICS token (ADR-0002) — separate from any live broker
  # session; read only when artha.upstox.analytics.enabled=true. Empty placeholder is harmless.
  upstox_analytics_token:
    file: ./secrets/upstox_analytics_token

volumes:
  timescale-data:
  redis-data:           # AOF persistence — sessions + ticker SubscriptionRegistry survive recreates (P2)
  openalgo-data:        # OpenAlgo SQLite (sessions/api-keys/sandbox) + DuckDB persistence (§2)

services:
  timescaledb:
    image: timescale/timescaledb:2.18.2-pg17
    container_name: ay-timescaledb
    command: ["postgres", "-c", "shared_buffers=512MB"]
    environment:
      POSTGRES_USER: artha
      POSTGRES_DB: artha
      # file-mounted secret — never a plain env var (A.9 / T4)
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    ports:
      - "127.0.0.1:5432:5432" # dev tooling only (D7); loopback, never 0.0.0.0
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "artha"]
      interval: 5s
      retries: 10
    # 4 GB: the 1 GB cap OOM-crashed under the expired-instruments bulk backfill (write flood +
    # cagg refresh). Host has ~10 GB free; shared_buffers stays 512 MB, leaving headroom for
    # work_mem/maintenance + page cache during heavy historical loads.
    mem_limit: 4096m
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    container_name: ay-redis
    # CD-16: eviction is instance-wide (volatile-lru; note Spring-Session keys ARE TTL'd and thus
    # evictable under pressure — producers now XTRIM the job streams so TTL-less stream bytes can't
    # build that pressure, audit P2); pubsub buffer limit disconnects pathological subscribers
    # instead of ballooning memory (A.7.2). AOF + a named volume (audit P2) so sessions and the
    # ticker SubscriptionRegistry survive an `ay down`/container recreate — losing the registry
    # silently killed live chart streaming for non-pinned symbols (the 2026-06-15 incident class).
    command:
      - redis-server
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - volatile-lru
      - --client-output-buffer-limit
      - pubsub 16mb 8mb 60
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    mem_limit: 64m
    restart: unless-stopped
    logging: *default-logging

  # ---- one-shot database creator (profile isolation) ----------------------
  # mock and live each get their OWN database in the one Postgres instance
  # (live → artha, mock → artha_mock), so mock's synthetic candles/snapshots
  # can never pollute live data. Idempotently creates BOTH so either profile
  # boots cleanly; flyway-init then migrates only the active ${ARTHA_DB_NAME}.
  # FAIL-CLOSED (audit P1-7): every ${ARTHA_DB_NAME}/${ARTHA_REDIS_DB} interpolation uses :?
  # (error-if-unset) — the old :-artha/:-0 defaults meant a raw compose invocation silently
  # pointed a MOCK-profile stack at the LIVE database (the documented pollution foot-gun).
  db-create:
    image: postgres:17-alpine
    container_name: ay-db-create
    secrets: [postgres_password]
    entrypoint:
      - /bin/sh
      - -c
      - |
        export PGPASSWORD="$$(cat /run/secrets/postgres_password)"
        for db in artha artha_mock; do
          psql -h timescaledb -U artha -d postgres -tAc \
            "SELECT 1 FROM pg_database WHERE datname='$$db'" | grep -q 1 \
            || createdb -h timescaledb -U artha "$$db"
          echo "[db-create] ensured database $$db"
        done
    depends_on:
      timescaledb:
        condition: service_healthy
    mem_limit: 64m
    restart: "no"
    logging: *default-logging

  # ---- one-shot DB init (A.8 / D17, CD-1, CD-7) ---------------------------
  # Runs the four Flyway lineages (admin first) into the active ${ARTHA_DB_NAME}
  # and exits 0; app services gate on service_completed_successfully. Every
  # service runs ddl-auto=none — Flyway owns ALL schema.
  flyway-init:
    image: flyway/flyway:11-alpine
    container_name: ay-flyway-init
    secrets: [postgres_password]
    environment:
      ARTHA_DB_NAME: ${ARTHA_DB_NAME:?unset - run via the ay CLI (derives mock->artha_mock, live->artha); raw compose must export it}
    volumes:
      - ./flyway:/flyway/sql:ro
    entrypoint: ["/bin/sh", "/flyway/sql/flyway-run.sh"]
    depends_on:
      timescaledb:
        condition: service_healthy
      db-create:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: "no"
    logging: *default-logging

  # ---- one-shot: set the read-only console role password (SEC-02) ---------
  # The admin lineage (V002) creates ay_console with PASSWORD NULL — no credential
  # ever lives in a migration (A.9). This sets its password from
  # ARTHA_CONSOLE_DB_PASSWORD every boot (idempotent ALTER ROLE) so the market-data
  # SQL console can authenticate as the least-privilege role (NOSUPERUSER,
  # SELECT-only on marketdata) instead of the artha superuser — closing the
  # `SELECT pg_read_file('/run/secrets/...')` secret-read.
  #
  # PROFILE GATE (fix round): the mock/CI default 'console-readonly-local' is PUBLIC
  # (this file is committed) and Postgres is published on loopback, so on the LIVE
  # profile an empty/default ARTHA_CONSOLE_DB_PASSWORD is FATAL: the one-shot
  # DISABLES ay_console login (the role is cluster-global — a prior mock boot may
  # have left the public default on it) and exits 1, failing `ay up --wait` loudly.
  # The profile is classified EXACTLY like ay.ps1 (split on comma, TRIM each token,
  # then: any list containing 'mock' => mock, EVERY other list => live/strict), so
  # "debug, live" (spaces, no literal ,live, token) is correctly treated as live —
  # the two classifiers can never diverge. Mock still needs ZERO secrets (empty ->
  # the default, applied inside the script). The password reaches ALTER ROLE via
  # psql's :'var' binding fed on STDIN (psql interpolates :var only from a
  # script/stdin/-f, NEVER a -c string; psql does the SQL literal quoting), so
  # quotes/semicolons in the value cannot break out. `set -eu` + an explicit status check on the final
  # ALTER mean a failed password-set can NEVER report success (compose would
  # otherwise treat the exit-0 echo as a healthy init and leave a stale password).
  #
  # market-data-service does NOT depend on this (feed independence: a console-cred
  # problem must never block the feed — the console datasource is lazy+fail-closed),
  # so a deploy that recreates market-data must ALSO recreate this one-shot:
  #   up -d --force-recreate flyway-init console-role-init
  console-role-init:
    image: postgres:17-alpine
    container_name: ay-console-role-init
    secrets: [postgres_password]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-mock}
      ARTHA_CONSOLE_DB_PASSWORD: ${ARTHA_CONSOLE_DB_PASSWORD:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        export PGPASSWORD="$$(cat /run/secrets/postgres_password)"
        pw="$${ARTHA_CONSOLE_DB_PASSWORD}"
        # classify like ay.ps1: split on comma, trim each token (word-splitting on
        # the unquoted command substitution trims + drops empties), membership test.
        is_mock=0
        for tok in $$(printf '%s' "$${SPRING_PROFILES_ACTIVE}" | tr ',' ' '); do
          if [ "$$tok" = "mock" ]; then is_mock=1; fi
        done
        if [ "$$is_mock" = 1 ]; then
          if [ -z "$$pw" ]; then pw="console-readonly-local"; fi
        else
          if [ -z "$$pw" ] || [ "$$pw" = "console-readonly-local" ]; then
            psql -h timescaledb -U artha -d postgres -v ON_ERROR_STOP=1 \
              -c "ALTER ROLE ay_console NOLOGIN"
            echo "[console-role-init] FATAL: live requires a strong ARTHA_CONSOLE_DB_PASSWORD in .env (not empty, not the mock default). ay_console login DISABLED (fail-closed)."
            exit 1
          fi
        fi
        # psql interpolates :'pw' ONLY from a script/stdin/-f, NEVER from a -c
        # command string — a -c "... :'pw'" sends the literal :'pw' to the server
        # and dies with `syntax error at or near ":"` (the SEC-02 live-deploy
        # failure 2026-07-18: role created by V002 but password-set failed, so
        # ay_console stayed fail-closed). Feed the ALTER on STDIN so the
        # injection-safe :'pw' binding actually expands. A pipeline's exit status
        # is its RIGHT-hand command's (psql), so the if-guard still reflects psql.
        if printf '%s\n' "ALTER ROLE ay_console LOGIN PASSWORD :'pw'" \
             | psql -h timescaledb -U artha -d postgres -v ON_ERROR_STOP=1 -v pw="$$pw"; then
          echo "[console-role-init] ay_console password set"
        else
          echo "[console-role-init] FATAL: could not set ay_console password"
          exit 1
        fi
    depends_on:
      timescaledb:
        condition: service_healthy
      flyway-init:
        condition: service_completed_successfully
    mem_limit: 64m
    restart: "no"
    logging: *default-logging

  # ---- always-on nightly backup sidecar (A.11 / D16) ----------------------
  # 00:30 IST WHOLE-DATABASE pg_dump -Fc + cluster globals (post-#395) into
  # the bind-mounted ./backups on the WINDOWS filesystem - outside the WSL2 VM
  # and Docker volumes by design (write-once nightly traffic; survival outside
  # the VM is the point). Retention: 3 newest dumps PER DATABASE across
  # manual/nightly/weekly (backup.sh prune). Failure AND success both POST the
  # ops ntfy topic (success = the dead-man signal: no morning message means the
  # nightly did not run; no-op when ARTHA_NTFY_TOPIC is unset).
  db-backup:
    image: postgres:17-alpine
    container_name: ay-db-backup
    environment:
      TZ: Asia/Kolkata
      PGHOST: timescaledb
      PGUSER: artha
      # Pinned to the LIVE database regardless of the active profile (audit
      # P0-5): mock is reproducible by design; a profile switch must never
      # leave live unbacked-up while mock nightlies rotate live dumps out.
      PGDATABASE: artha
      ARTHA_NTFY_TOPIC: ${ARTHA_NTFY_TOPIC:-}
      ARTHA_NTFY_URL: ${ARTHA_NTFY_URL:-https://ntfy.sh}
    secrets: [postgres_password]
    volumes:
      - ../backups:/backups
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - "echo '30 0 * * * /usr/local/bin/backup.sh nightly' | crontab - && exec crond -f -l 8"
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond"]
      interval: 30s
      retries: 3
    mem_limit: 64m
    restart: unless-stopped
    logging: *default-logging

  # ---- the single front door (A.2 / D7, D13) ------------------------------
  # The ONLY published app port, hardcoded loopback by design (A.1.2) —
  # never parameterized via env. Jar is host-built (mvnw package) before
  # compose build; see services/edge-gateway/Dockerfile.
  edge-gateway:
    build:
      context: ../services/edge-gateway
    image: arthayantra/edge-gateway:dev
    container_name: ay-edge-gateway
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-mock}
      ARTHA_OWNER_PASSWORD_HASH: ${ARTHA_OWNER_PASSWORD_HASH:-}
      GATEWAY_WS_FLUSH_HZ: ${GATEWAY_WS_FLUSH_HZ:-20}
      # Profile isolation: separate Redis logical DB per profile (live 0 / mock 1)
      SPRING_DATA_REDIS_DATABASE: ${ARTHA_REDIS_DB:?unset - run via the ay CLI (derives mock->1, live->0); raw compose must export it}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      retries: 12
      start_period: 40s
    # 512m (was 384m): the JVM idles ~310MiB RSS (-Xmx256m heap + ~70-130MiB
    # metaspace/netty-direct/threads/code-cache) = 81% of 384m, so a GC/traffic
    # spike total-RSS OOM-killed it (exit 137, ~38h front-door outage 2026-07-12).
    # Heap stays capped at -Xmx256m; the extra 128m is off-heap headroom → ~61% idle.
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging

  # ---- market data: ticker + chain + cache hot path (A.7a / D7) -----------
  # Internal port 8081 — never published in the default profile; the
  # dev-tools profile forwards it on loopback for T2 (mds-publish below).
  market-data-service:
    build:
      context: ..
      dockerfile: services/market-data-service/Dockerfile
    image: arthayantra/market-data-service:dev
    container_name: ay-market-data-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-mock}
      MOCK_TICKS_PER_SEC: ${MOCK_TICKS_PER_SEC:-1}
      MOCK_SCENARIO: ${MOCK_SCENARIO:-trend-up}
      # Stage B: marketdata schema access — password via secret file, never env
      ARTHA_DB_PASSWORD_FILE: /run/secrets/postgres_password
      # SEC-02: the read-only SQL console authenticates as the least-privilege ay_console role via its
      # OWN datasource (NOT the artha superuser). The console-role-init one-shot sets this SAME password
      # on the role, so the app and the role agree. Shared .env => one value across mock+live (the role
      # is cluster-global). Name MUST byte-match the application.yml placeholder (#653). The fallback
      # here is the MOCK/CI credential only: on LIVE an empty var makes console-role-init DISABLE
      # ay_console login and fail the boot (fix round), so this app-side fallback can never
      # authenticate on live — it is a dead credential, and the console fails closed.
      ARTHA_CONSOLE_DB_PASSWORD: ${ARTHA_CONSOLE_DB_PASSWORD:-console-readonly-local}
      # Profile isolation: per-profile database + Redis logical DB (live → artha/0, mock → artha_mock/1)
      SPRING_DATASOURCE_URL: jdbc:postgresql://timescaledb:5432/${ARTHA_DB_NAME:?unset - run via the ay CLI (derives mock->artha_mock, live->artha); raw compose must export it}?currentSchema=marketdata
      SPRING_DATA_REDIS_DATABASE: ${ARTHA_REDIS_DB:?unset - run via the ay CLI (derives mock->1, live->0); raw compose must export it}
      # OpenAlgo appliance URL (plan §3/§4); read only when a source.* capability = openalgo
      ARTHA_OPENALGO_BASE_URL: ${ARTHA_OPENALGO_BASE_URL:-http://openalgo:5000}
      # Data-foundation milestone flags (plan §2/§3). Wired here so the application.yml env names
      # actually reach the container — default-OFF, flipped per docs/manual-tests/data-foundation-activation.md.
      ARTHA_OPENALGO_OI_BACKFILL_ENABLED: ${ARTHA_OPENALGO_OI_BACKFILL_ENABLED:-false}
      ARTHA_OPENALGO_GLOBAL_QUOTES_ENABLED: ${ARTHA_OPENALGO_GLOBAL_QUOTES_ENABLED:-false}
      ARTHA_OPENALGO_CANARY_ENABLED: ${ARTHA_OPENALGO_CANARY_ENABLED:-false}
      ARTHA_MD_SOURCE_QUOTES: ${ARTHA_MD_SOURCE_QUOTES:-kite}
      ARTHA_MD_SOURCE_CANDLES: ${ARTHA_MD_SOURCE_CANDLES:-kite}
      ARTHA_MD_SOURCE_OPTIONCHAIN: ${ARTHA_MD_SOURCE_OPTIONCHAIN:-kite}
      # Ops ntfy passthrough (audit P0-6): the contract canaries (Kite/Upstox/OpenAlgo) and the
      # corporate-action job alert via NtfyClient, but the topic only reached the db-backup
      # sidecar — every market-data drift alert silently no-op'd (same passthrough-miss class as
      # ARTHA_MD_SOURCE_TICKER below).
      ARTHA_NTFY_TOPIC: ${ARTHA_NTFY_TOPIC:-}
      ARTHA_NTFY_URL: ${ARTHA_NTFY_URL:-https://ntfy.sh}
      # A14 kill switch (2026-07-10): the 16:30-IST corporate-action sweep OOM-crashed live Postgres
      # 3×; this disarms the @Scheduled job (CorporateActionJob @ConditionalOnProperty). Default true
      # (no behaviour change); flip false in .env to disarm. Name MUST byte-match application.yml's
      # artha.corporate-actions.enabled placeholder ARTHA_CORPORATE_ACTIONS_ENABLED (#653).
      ARTHA_CORPORATE_ACTIONS_ENABLED: ${ARTHA_CORPORATE_ACTIONS_ENABLED:-true}
      # Phase-9 Minervini (MV-9.4): push an ntfy alert when a SEPA funnel candidate transitions into
      # the immediately-buyable band. Default off; flip in the live .env (goes to ARTHA_NTFY_TOPIC).
      ARTHA_MINERVINI_BUYABLE_ALERTS_ENABLED: ${ARTHA_MINERVINI_BUYABLE_ALERTS_ENABLED:-false}
      # Manas Arora selection screener (a separate swing family from Minervini, its own tables): run
      # the daily 19:40-IST EOD 6-criteria screen + vcp/breakout geometry. Default off so CI/mock/fresh
      # stacks stay clean; the live .env flips it true. On-demand POST /run works regardless of the flag.
      ARTHA_MANAS_ARORA_SCREEN_ENABLED: ${ARTHA_MANAS_ARORA_SCREEN_ENABLED:-false}
      # WS live ticker source (Wave-U4 §C). The application.yml binding existed but this passthrough
      # was missing, so a .env ARTHA_MD_SOURCE_TICKER never reached the container (default Kite either
      # way). Added so the owner's ticker flip is a one-line .env change. Default kite (no behaviour change).
      ARTHA_MD_SOURCE_TICKER: ${ARTHA_MD_SOURCE_TICKER:-kite}
      ARTHA_MD_SOURCE_FIIDII: ${ARTHA_MD_SOURCE_FIIDII:-nse}
      ARTHA_MD_SOURCE_OPTIONANALYTICS: ${ARTHA_MD_SOURCE_OPTIONANALYTICS:-native}
      # Upstox Market-Information analytics side-channel (ADR-0002) — default-OFF.
      ARTHA_UPSTOX_ANALYTICS_ENABLED: ${ARTHA_UPSTOX_ANALYTICS_ENABLED:-false}
      ARTHA_UPSTOX_CANARY_ENABLED: ${ARTHA_UPSTOX_CANARY_ENABLED:-false}
      # IV rank/percentile trailing-window floor (days). 60 = pinned honest-null default; the
      # iv_rank dot stays dead until capture history (started 2026-06-15) crosses it. Lower ONLY
      # on rollup evidence (signal-analysis findings item #5) — never below ~15 (rank over a
      # handful of days is noise). Config-only revive: no rebuild.
      ARTHA_IV_RANK_HISTORY_FLOOR_DAYS: ${ARTHA_IV_RANK_HISTORY_FLOOR_DAYS:-60}
      # A10 (owner decision 2026-07-12): options_chain_snapshots retention horizon (days). Feeds
      # OptionsSnapshotPruneJob's 03:30-IST drop_chunks prune. Default 365; no-op until ~2027-06.
      # Name MUST byte-match application.yml's artha.market.snapshot-retention-days placeholder (#653).
      ARTHA_SNAPSHOT_RETENTION_DAYS: ${ARTHA_SNAPSHOT_RETENTION_DAYS:-365}
      # Live option-premium 1m capture: nearest-expiry ATM +/- width, both CE and PE.
      ARTHA_OPTIONS_ATM_PINNER_UNDERLYINGS: ${ARTHA_OPTIONS_ATM_PINNER_UNDERLYINGS:-NIFTY 50,SENSEX}
      ARTHA_OPTIONS_ATM_PINNER_STRIKE_WIDTH: ${ARTHA_OPTIONS_ATM_PINNER_STRIKE_WIDTH:-5}
      ARTHA_OPTIONS_ATM_PINNER_EXPIRY_HORIZON_DAYS: ${ARTHA_OPTIONS_ATM_PINNER_EXPIRY_HORIZON_DAYS:-7}
    # kite_* + master key + the OpenAlgo API key mount into THIS service only (B-2: the token
    # and the credentials never reach any other container). The openalgo key is read only when
    # capture routes through OpenAlgo (Phase 1); an empty placeholder is harmless otherwise.
    secrets: [postgres_password, kite_api_key, kite_api_secret, artha_master_key, openalgo_api_key, upstox_analytics_token]
    depends_on:
      flyway-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      retries: 12
      start_period: 40s
    mem_limit: 640m
    restart: unless-stopped
    logging: *default-logging

  # ---- OpenAlgo appliance (plan §2/§3) — AGPL, UNMODIFIED, digest-pinned ----
  # Broker-swappable unified API (24+ brokers) consumed ONLY over /api/v1 REST + WS; its
  # source is never merged here. OPT-IN via `profiles: [openalgo]` so it stays OUT of the
  # default `ay up --wait` — it needs a broker login through its own UI before it is useful,
  # and nothing depends on it, so the core stack always boots green. Start with `ay up
  # openalgo`. Phase 0 stands it up; routing capture through it is Phase 1 (§4). Sandbox/
  # analyzer mode is a RUNTIME toggle, not an env flag (§17.8) — see deploy/openalgo/README.md.
  openalgo:
    image: marketcalls/openalgo@sha256:892bca7259e2b3253118ec4f0209efe08563bca03bbde3da5a16723c52b4e11d  # 2.0.1.4 (was 2.0.1.3 b1bc2ec) — perf: broker keep-warm + latency caching; UI tools (Scalping/Gamma/OI-Range) unused via API
    container_name: ay-openalgo
    profiles: [openalgo]
    # Config is FILE-BASED: deploy/openalgo/.env is a COMPLETE OpenAlgo config (ay seeds it from the
    # pinned image's /app/.sample.env, then overrides keys + fills secrets) mounted AS /app/.env.
    # start.sh sees an existing non-empty /app/.env and skips its env→file generation, so every
    # required key is present and our FERNET_SALT/APP_KEY/API_KEY_PEPPER persist verbatim across
    # recreates (env_check never rotates them → stored ciphertext keeps decrypting). We deliberately
    # do NOT use `env_file:` — the file is in OpenAlgo's native `KEY = 'value'` dotenv format, which
    # is not compose-env_file-safe; the mount + python-dotenv is the single config source.
    volumes:
      - openalgo-data:/app/db   # SQLite (sessions/api-keys/sandbox) + DuckDB history
      - ./openalgo/.env:/app/.env
    healthcheck:
      # purpose-built, unauthenticated, cheap health endpoint (openalgo blueprints/health.py);
      # returns 200 on a fresh, logged-out container. curl is present in the image.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/health/status >/dev/null || exit 1"]
      interval: 15s
      retries: 8
      start_period: 60s
    mem_limit: 2048m
    restart: unless-stopped
    logging: *default-logging

  # loopback publisher for OpenAlgo's UI + broker OAuth callback (:5001 -> openalgo:5000);
  # needed to log a broker in via the web UI. Rides the openalgo profile.
  openalgo-publish:
    image: alpine/socat:1.8.0.3
    container_name: ay-openalgo-publish
    profiles: [openalgo]
    command: ["TCP-LISTEN:5001,fork,reuseaddr", "TCP:openalgo:5000"]
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      openalgo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "socat", "-V"]
      interval: 30s
      retries: 3
    mem_limit: 16m
    restart: unless-stopped
    logging: *default-logging

  # ---- strategy registry + signal engine (Phase 21+ / D18) ----------------
  # Internal port 8082 — never published in the default profile; the
  # dev-tools profile forwards it on loopback (sss-publish below). Holds NO
  # Kite secrets — only the DB password file (D10 single-writer, schema
  # `strategy`).
  # ---- WireMock ntfy stub (Phase 41 / Q6) ---------------------------------
  # Stubs the signal-notifier's ntfy POST under mock so the push path is testable
  # without a real ntfy server (catch-all 200). Live mode points the notifier
  # elsewhere via ARTHA_NOTIFIER_NTFY_URL. Reused by Stage G alert verification.
  wiremock:
    image: wiremock/wiremock:3.9.2
    container_name: ay-wiremock
    command: ["--port", "8080", "--disable-banner"]
    volumes:
      - ./wiremock:/home/wiremock:ro
    ports:
      - "127.0.0.1:9099:8080"
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging

  strategy-signal-service:
    build:
      context: ../services/strategy-signal-service
    image: arthayantra/strategy-signal-service:dev
    container_name: ay-strategy-signal-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-mock}
      ARTHA_DB_PASSWORD_FILE: /run/secrets/postgres_password
      # Profile isolation: per-profile database + Redis logical DB (live → artha/0, mock → artha_mock/1)
      SPRING_DATASOURCE_URL: jdbc:postgresql://timescaledb:5432/${ARTHA_DB_NAME:?unset - run via the ay CLI (derives mock->artha_mock, live->artha); raw compose must export it}?currentSchema=strategy
      SPRING_DATA_REDIS_DATABASE: ${ARTHA_REDIS_DB:?unset - run via the ay CLI (derives mock->1, live->0); raw compose must export it}
      # Total-response timeout (ms) for the eval-loop candle warm-up fetch — a slow market-data must
      # fail fast, never park signal generation (2026-07-14 incident). Default 10s.
      ARTHA_MARKETDATA_CANDLES_FETCH_TIMEOUT_MS: ${ARTHA_MARKETDATA_CANDLES_FETCH_TIMEOUT_MS:-10000}
      # Subscriber watchdog knobs (retro-fitted from @Value defaults; #653).
      ARTHA_SIGNALS_SUBSCRIBER_WATCHDOG_ENABLED: ${ARTHA_SIGNALS_SUBSCRIBER_WATCHDOG_ENABLED:-true}
      ARTHA_SIGNALS_SUBSCRIBER_WATCHDOG_BAR_GAP_MS: ${ARTHA_SIGNALS_SUBSCRIBER_WATCHDOG_BAR_GAP_MS:-180000}
      ARTHA_SIGNALS_SUBSCRIBER_WATCHDOG_FEED_FRESH_MS: ${ARTHA_SIGNALS_SUBSCRIBER_WATCHDOG_FEED_FRESH_MS:-90000}
      # T9 load-coverage watchdog: ship dormant; owner arms OBSERVE_ONLY, then ARMED.
      ARTHA_SIGNALS_STRATEGY_COVERAGE_WATCHDOG_MODE: ${ARTHA_SIGNALS_STRATEGY_COVERAGE_WATCHDOG_MODE:-DISABLED}
      ARTHA_SIGNALS_STRATEGY_COVERAGE_WATCHDOG_GRACE_MS: ${ARTHA_SIGNALS_STRATEGY_COVERAGE_WATCHDOG_GRACE_MS:-180000}
      # EOD swing missed-batch detector: ship dormant; owner arms after ops ntfy is configured.
      ARTHA_SIGNALS_SWING_MISSED_BATCH_DETECTOR_ENABLED: ${ARTHA_SIGNALS_SWING_MISSED_BATCH_DETECTOR_ENABLED:-false}
      # (The ARTHA_SIGNALS_STARVATION_WATCHDOG_* passthroughs were removed 2026-07-26 with the
      # retirement of SignalStarvationCanary — see the note in strategy-signal's application.yml.)
      # PF-03 risk_suppressions retention (task_f168c23c): daily 02:30-IST prune of rows older than N
      # days (append-only, low volume). Env-tunable without an image rebuild; 0/negative disables.
      ARTHA_SIGNALS_RISK_SUPPRESSION_RETENTION_DAYS: ${ARTHA_SIGNALS_RISK_SUPPRESSION_RETENTION_DAYS:-180}
      # Per-evaluation composite_rejections row (V044) for a COMPOSITE_BELOW_THRESHOLD entry — the
      # RSI/composite tuning record. ON by default; flip to false here to KILL the writes without an
      # image rebuild. CHART_GATE_FAILED is never recorded. Retention: daily 02:30-IST prune of rows
      # older than N days (0/negative = quiet no-op, announced once at boot, never alerts).
      ARTHA_SIGNALS_RECORD_COMPOSITE_REJECTIONS: ${ARTHA_SIGNALS_RECORD_COMPOSITE_REJECTIONS:-true}
      ARTHA_SIGNALS_COMPOSITE_REJECTION_RETENTION_DAYS: ${ARTHA_SIGNALS_COMPOSITE_REJECTION_RETENTION_DAYS:-180}
      # V043 signal_eval_outcomes retention: daily 02:30-IST prune of the 3m engine-evaluation
      # counter rollup (the retroactive liveness record). Env-tunable without an image rebuild;
      # 0/negative disables the prune.
      ARTHA_SIGNALS_EVAL_OUTCOME_RETENTION_DAYS: ${ARTHA_SIGNALS_EVAL_OUTCOME_RETENTION_DAYS:-180}
      # Phase 41 notifier (Q6): the signal-push ntfy endpoint + its OWN topic (distinct from the
      # ops topic). Under mock this points at the WireMock stub; live mode overrides both.
      # Fail-CLOSED defaults (audit P0-6): the old wiremock fallback ran in LIVE too — every
      # live push hit the catch-all-200 stub and was audited SENT (even the owner's test-send
      # falsely passed). Blank = notifier disabled; ay.ps1 exports the wiremock values for the
      # mock profile, live values come from .env.
      ARTHA_NOTIFIER_NTFY_URL: ${ARTHA_NOTIFIER_NTFY_URL:-}
      ARTHA_NOTIFIER_NTFY_TOPIC: ${ARTHA_NOTIFIER_NTFY_TOPIC:-}
      # §18.4: app origin for the scalp alert's /orders deep link. Blank = no link (default); set to the
      # reachable app host (e.g. Tailscale) to arm it. Arm-able via .env without an image rebuild.
      ARTHA_NOTIFIER_APP_BASE_URL: ${ARTHA_NOTIFIER_APP_BASE_URL:-}
      # 2b: opt-in scalper-strategy seeder. Default off so test/CI Spring contexts + a fresh stack stay
      # clean; the live/mock .env flips it true to seed the 36 scalper drafts on boot (idempotent,
      # 409-skips existing). Drafts NEVER auto-emit — the owner publishes each from the UI.
      ARTHA_SCALPER_SEED_STRATEGIES: ${ARTHA_SCALPER_SEED_STRATEGIES:-false}
      # Phase-9 Minervini SEPA swing (MV-9): seed the 4 swing-setup drafts on boot (idempotent) +
      # enable the 20:00-IST daily live-PAPER batch. Default off so CI/mock/fresh stacks stay clean;
      # the live .env flips them true once the owner has published the swing strategies. The batch
      # drives only paper positions (equities do not tick — it evaluates the daily bar post-close).
      ARTHA_MINERVINI_SEED_STRATEGIES: ${ARTHA_MINERVINI_SEED_STRATEGIES:-false}
      ARTHA_MINERVINI_SWING_ENABLED: ${ARTHA_MINERVINI_SWING_ENABLED:-false}
      # Manas Arora live swing (a separate swing family): seed + auto-publish the 2 setup drafts on
      # boot (idempotent) + enable the 20:05-IST daily live-PAPER batch (auto-papers into the
      # manas-arora ₹1.5L book, evaluated on the daily bar post-close). Scoped to universe.mode
      # manas_arora_funnel so it never touches the Minervini funnel. Default off; live .env flips true.
      ARTHA_MANAS_ARORA_SEED_STRATEGIES: ${ARTHA_MANAS_ARORA_SEED_STRATEGIES:-false}
      ARTHA_MANAS_ARORA_SWING_ENABLED: ${ARTHA_MANAS_ARORA_SWING_ENABLED:-false}
      # F2 §3.4 pyramiding: add a lot to a held Manas winner (+min-gain% since the last lot AND a fresh
      # pivot), averaged into the one position, capped at max-lots and the ≤max-portfolio-risk-pct book
      # open-risk cap. Default off (a held symbol is skipped, pre-F2). Tunables live in .env like the
      # scalper relative-volume knobs — no rebuild to re-tune.
      ARTHA_MANAS_ARORA_PYRAMID_ENABLED: ${ARTHA_MANAS_ARORA_PYRAMID_ENABLED:-false}
      ARTHA_MANAS_ARORA_PYRAMID_MIN_GAIN_PCT: ${ARTHA_MANAS_ARORA_PYRAMID_MIN_GAIN_PCT:-5.0}
      ARTHA_MANAS_ARORA_PYRAMID_MAX_LOTS: ${ARTHA_MANAS_ARORA_PYRAMID_MAX_LOTS:-3}
      ARTHA_MANAS_ARORA_PYRAMID_MAX_PORTFOLIO_RISK_PCT: ${ARTHA_MANAS_ARORA_PYRAMID_MAX_PORTFOLIO_RISK_PCT:-6.0}
      # F9 paper risk enforcement (advised_lots + margin snapshot are always-on advisory; this flag
      # only ARMS the portfolio heat-cap BLOCK). Default off — flip true after a clean advisory week.
      ARTHA_PAPER_RISK_ENABLED: ${ARTHA_PAPER_RISK_ENABLED:-false}
      # Audit V3 tick-freshness guards: a paper FILL priced off a last tick older than max-age is
      # rejected DATA_STALE; a SL/TP bracket starved of a fresh tick past the alert threshold pages
      # ntfy once per (position, day). Settles always take the last REAL tick (stale = counted +
      # alerted, never refused). Defaults MIRROR the application.yml @Value defaults.
      ARTHA_PAPER_TICK_MAX_AGE_SECONDS: ${ARTHA_PAPER_TICK_MAX_AGE_SECONDS:-15}
      ARTHA_PAPER_BRACKET_STARVATION_ALERT_MINUTES: ${ARTHA_PAPER_BRACKET_STARVATION_ALERT_MINUTES:-2}
      ARTHA_PAPER_EOD_MANAGED_BOOKS: ${ARTHA_PAPER_EOD_MANAGED_BOOKS:-minervini,manas-arora}
      # HOLD (task_94f40cf6) signal-freshness gate on the MANUAL take path: a signal-linked hand ticket
      # whose SIGNAL is older than this (minutes) on a NON-swing book is rejected SIGNAL_STALE. Swing
      # books (minervini / manas-arora) are exempt; 0/negative disables. Default MIRRORS application.yml.
      ARTHA_PAPER_SIGNAL_TAKE_MAX_AGE_MINUTES: ${ARTHA_PAPER_SIGNAL_TAKE_MAX_AGE_MINUTES:-60}
      # F7 auto-promotion: the daily 21:00-IST evaluator that marks a strategy GRADUATED (measurement +
      # ntfy only, never a live action). Default off; flip true to arm the marker pass.
      ARTHA_GRADUATION_PROMOTION_ENABLED: ${ARTHA_GRADUATION_PROMOTION_ENABLED:-false}
      # Audit M29 — expose the ops-tunable knobs (graduation thresholds, per-trade risk sizing, the
      # batch crons) so an operator can tune via .env WITHOUT editing the image. Defaults MIRROR the
      # code @Value defaults; leaving a var unset keeps the coded default. Graduation is measurement-
      # only (flag above), so these move only the readiness board / promotion marker, never a live order.
      ARTHA_GRADUATION_MIN_TRADES: ${ARTHA_GRADUATION_MIN_TRADES:-20}
      ARTHA_GRADUATION_MIN_PROFIT_FACTOR: ${ARTHA_GRADUATION_MIN_PROFIT_FACTOR:-1.3}
      ARTHA_GRADUATION_MIN_EXPECTANCY: ${ARTHA_GRADUATION_MIN_EXPECTANCY:-0}
      ARTHA_GRADUATION_MAX_DRAWDOWN_PCT: ${ARTHA_GRADUATION_MAX_DRAWDOWN_PCT:-25}
      ARTHA_GRADUATION_BASE_CAPITAL: ${ARTHA_GRADUATION_BASE_CAPITAL:-100000}
      ARTHA_GRADUATION_PROMOTION_MIN_TRADES: ${ARTHA_GRADUATION_PROMOTION_MIN_TRADES:-50}
      ARTHA_GRADUATION_PROMOTION_MIN_SHARPE: ${ARTHA_GRADUATION_PROMOTION_MIN_SHARPE:-0.5}
      ARTHA_GRADUATION_PROMOTION_MIN_EXPECTANCY: ${ARTHA_GRADUATION_PROMOTION_MIN_EXPECTANCY:-0}
      ARTHA_GRADUATION_PROMOTION_MAX_DRAWDOWN_PCT: ${ARTHA_GRADUATION_PROMOTION_MAX_DRAWDOWN_PCT:-25}
      # advisory risk sizing (advised_lots = floor(pct% × equity ÷ stop-distance); advisory only)
      ARTHA_PAPER_RISK_PER_TRADE_RISK_PCT: ${ARTHA_PAPER_RISK_PER_TRADE_RISK_PCT:-1.0}
      # batch/evaluator crons (Asia/Kolkata) — quoted (the value has spaces)
      ARTHA_GRADUATION_PROMOTION_CRON: "${ARTHA_GRADUATION_PROMOTION_CRON:-0 0 21 * * MON-FRI}"
      ARTHA_MINERVINI_SWING_CRON: "${ARTHA_MINERVINI_SWING_CRON:-0 0 20 * * MON-FRI}"
      ARTHA_MANAS_ARORA_SWING_CRON: "${ARTHA_MANAS_ARORA_SWING_CRON:-0 5 20 * * MON-FRI}"
      ARTHA_SWING_CANARY_CRON: "${ARTHA_SWING_CANARY_CRON:-0 30 8 * * MON-FRI}"
      # External dead-man's-switch for the swing batches (catches a whole-stack/host OUTAGE, which the
      # in-stack P0-4 canary can't). Blank = dormant; paste a healthchecks.io/UptimeRobot heartbeat URL
      # to arm, and set the external check to expect a ping on 15 20 * * 1-5 (TZ Asia/Kolkata).
      ARTHA_HEARTBEAT_URL: "${ARTHA_HEARTBEAT_URL:-}"
      ARTHA_HEARTBEAT_SWING_CRON: "${ARTHA_HEARTBEAT_SWING_CRON:-0 15 20 * * MON-FRI}"
      # Session-cadence dead-man's-switch for the LIVE trading session (the swing ping above proves only
      # the 20:15 batch ran — a stack dead 09:15-15:30 but recovered by 20:15 pings it happily). Pings
      # every ~10 min while candles are flowing; the withheld ping is the alarm. Blank = dormant; paste a
      # SEPARATE healthchecks.io/UptimeRobot heartbeat URL to arm, and create a DISTINCT external check
      # expecting a ping every ~10 min within 09:30-15:20 IST (TZ Asia/Kolkata) with a grace window.
      ARTHA_HEARTBEAT_SESSION_URL: "${ARTHA_HEARTBEAT_SESSION_URL:-}"
      ARTHA_HEARTBEAT_SESSION_CRON: "${ARTHA_HEARTBEAT_SESSION_CRON:-0 */10 9-15 * * MON-FRI}"
      # Connect-the-Dots dead-dot recalibration (signal-analysis rollup §Proposals P1/P2, owner-approved
      # 2026-07-10): the iv_pair min-gap + oi_spurt price floor, ops-tunable via .env WITHOUT an image
      # rebuild (like the scalper relative-volume knobs). The compose-side default MUST stay non-empty and
      # MUST equal the code/application.yml default (an unset `${VAR:-}` empty string would override the
      # Spring default; the name must match the application.yml ${ENV} placeholder exactly — #653 trap).
      ARTHA_SCALPER_OI_IV_PAIR_MIN_GAP: ${ARTHA_SCALPER_OI_IV_PAIR_MIN_GAP:-0.02}
      ARTHA_SCALPER_OI_SPURT_OI_PCT: ${ARTHA_SCALPER_OI_SPURT_OI_PCT:-15}
      ARTHA_SCALPER_OI_SPURT_PRICE_PCT: ${ARTHA_SCALPER_OI_SPURT_PRICE_PCT:-3}
      ARTHA_SCALPER_OI_VWAP_MIN_DISTANCE_BPS: ${ARTHA_SCALPER_OI_VWAP_MIN_DISTANCE_BPS:-15}
      # Shadow book (signal-analysis §7.1/§7.2): open composite-passing REJECTED entries as virtual
      # 1-lot positions so the exit sweep labels them with a real PnL (entry-gate tuning evidence).
      # Code default is false; ON for the stack — separate shadow_positions table, never touches
      # paper/risk/notifications. Flip to false to disable without a rebuild.
      ARTHA_SCALPER_SHADOW_BOOK_ENABLED: ${ARTHA_SCALPER_SHADOW_BOOK_ENABLED:-true}
      # Challenger shadow variants (roadmap F1): each entry re-scores every rejection under a config
      # diff and virtually trades what it would have accepted — per-variant PnL labels the knob
      # change before the champion config is touched. Evidence base: 2026-07-02/03 forensics
      # (volume floor 125k unpassable live — bracket it with OFF + the observed p50; composite-055
      # isolates "lower the confluence threshold" — 0.55 vs the live 0.60). The original
      # composite-070 was UNSATISFIABLE by construction (accepts() only sees pure composite-blocks,
      # which have composite < 0.60 < 0.70 — zero rows ever; 2026-07-10 F4 forensics) — a
      # TIGHTENING threshold needs the accepted-entry extension, not a rejected-only variant.
      # Code default is [] (no challengers); edit the
      # literal below to change experiments (flip ARTHA_SCALPER_SHADOW_BOOK_ENABLED off to kill the
      # whole book, challengers included).
      ARTHA_SCALPER_SHADOW_BOOK_VARIANTS_JSON: >-
        [{"name":"vol-off","rails":[{"rail":"volume-floor","disable":true}]},
         {"name":"vol-12k5","rails":[{"rail":"volume-floor","threshold":12500,"passWhen":"GTE"}]},
         {"name":"composite-055","compositeThreshold":0.55}]
      # F6 Telegram command bot (two-way, PAPER stack only: /status /pnl /positions + confirm-
      # guarded /pause /resume /flatten). Triple fail-closed: needs this flag AND the shared
      # notifier bot token AND the chat-id allowlist, all from .env. Unknown chats are ignored
      # silently; accepted commands audit to strategy.bot_commands (V019).
      ARTHA_TELEGRAM_COMMANDS_ENABLED: ${ARTHA_TELEGRAM_COMMANDS_ENABLED:-false}
      ARTHA_NOTIFIER_TELEGRAM_BOT_TOKEN: ${ARTHA_NOTIFIER_TELEGRAM_BOT_TOKEN:-}
      ARTHA_NOTIFIER_TELEGRAM_CHAT_ID: ${ARTHA_NOTIFIER_TELEGRAM_CHAT_ID:-}
    secrets: [postgres_password]
    depends_on:
      flyway-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      market-data-service:
        condition: service_healthy
      wiremock:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      retries: 12
      start_period: 40s
    mem_limit: 640m
    restart: unless-stopped
    logging: *default-logging

  # ---- backtest engine (Stage D Phase 28 / D1) ----------------------------
  # Authoritative Postgres jobs spine + crash-safe Redis Streams dispatch +
  # bounded worker pool. Reads `marketdata` read-only via the CD-1 grant;
  # validates strategy versions over the strategy-signal REST API. Internal
  # :8083, mem_limit 896m (sweep burst, D1).
  backtest-service:
    build:
      context: ../services/backtest-service
    image: arthayantra/backtest-service:dev
    container_name: ay-backtest-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-mock}
      ARTHA_DB_PASSWORD_FILE: /run/secrets/postgres_password
      ARTHA_MARKETDATA_BASE_URL: http://market-data-service:8081
      # Profile isolation: per-profile database + Redis logical DB (live → artha/0, mock → artha_mock/1)
      SPRING_DATASOURCE_URL: jdbc:postgresql://timescaledb:5432/${ARTHA_DB_NAME:?unset - run via the ay CLI (derives mock->artha_mock, live->artha); raw compose must export it}?currentSchema=backtest
      SPRING_DATA_REDIS_DATABASE: ${ARTHA_REDIS_DB:?unset - run via the ay CLI (derives mock->1, live->0); raw compose must export it}
      # B16 / audit A6 worker-pool fairness knobs (defaults match application.yml; .env-overridable).
      ARTHA_BACKTEST_INTERACTIVE_RESERVED: ${ARTHA_BACKTEST_INTERACTIVE_RESERVED:-1}
      ARTHA_BACKTEST_MAX_QUEUED: ${ARTHA_BACKTEST_MAX_QUEUED:-500}
    secrets: [postgres_password]
    depends_on:
      flyway-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      market-data-service:
        condition: service_healthy
      strategy-signal-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      retries: 12
      start_period: 40s
    mem_limit: 896m
    restart: unless-stopped
    logging: *default-logging

  # ---- optimizer-service (Phase 33 / D1) ----------------------------------
  # Python/FastAPI/Optuna ask-tell sweeps; proposes parameter vectors only —
  # backtest-service evaluates every trial through the SAME engine JAR (D6).
  # Internal :8084, mem_limit 256m. Reads the backtest schema as `artha`.
  optimizer-service:
    build:
      context: ..
      dockerfile: services/optimizer-service/Dockerfile
    image: arthayantra/optimizer-service:dev
    container_name: ay-optimizer-service
    environment:
      ARTHA_DB_PASSWORD_FILE: /run/secrets/postgres_password
      DB_HOST: timescaledb
      # Profile isolation: per-profile database + Redis logical DB (live → artha/0, mock → artha_mock/1)
      DB_NAME: ${ARTHA_DB_NAME:?unset - run via the ay CLI (derives mock->artha_mock, live->artha); raw compose must export it}
      REDIS_URL: redis://redis:6379/${ARTHA_REDIS_DB:?unset - run via the ay CLI (derives mock->1, live->0); raw compose must export it}
      STRATEGY_SIGNAL_BASE: http://strategy-signal-service:8082
      BACKTEST_BASE: http://backtest-service:8083
      # ntfy passthrough (EVO E4 item 11): a new PUBLISH_PAPER proposal pushes one fail-soft alert.
      # Blank ARTHA_NTFY_TOPIC → the client no-ops (mock needs no ntfy config).
      ARTHA_NTFY_TOPIC: ${ARTHA_NTFY_TOPIC:-}
      ARTHA_NTFY_URL: ${ARTHA_NTFY_URL:-https://ntfy.sh}
      # EVO E6 item 16 autonomy scheduler — DEFAULT OFF (dormant): no background driver starts, and
      # campaigns advance only via the owner-triggered POST /scheduler/tick. Arming is owner-gated —
      # flip ARTHA_EVO_SCHEDULER_ENABLED=true in the live .env (the passthrough name matches the var
      # the service reads EXACTLY, per the #653 rule). Even armed, the scheduler advances research
      # only; nothing self-arms/self-publishes.
      ARTHA_EVO_SCHEDULER_ENABLED: ${ARTHA_EVO_SCHEDULER_ENABLED:-false}
      ARTHA_EVO_SCHEDULER_INTERVAL_SECONDS: ${ARTHA_EVO_SCHEDULER_INTERVAL_SECONDS:-300}
      # §1.4.6 compute fairness: max scheduler-launched generations in flight across ALL campaigns
      # (default 1 — serial; owner-launched sweeps are not counted). Same exact-name #653 rule.
      ARTHA_EVO_MAX_CONCURRENT_SWEEPS: ${ARTHA_EVO_MAX_CONCURRENT_SWEEPS:-1}
    secrets: [postgres_password]
    depends_on:
      flyway-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      backtest-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8084/health').read() else 1)\""]
      interval: 10s
      retries: 12
      start_period: 30s
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

  # ---- margin-service (SPAN margin / position sizing) (§8) ----------------
  # Python/FastAPI; offline SPAN from daily NSE .spn files (read-only mount).
  # Internal :8086. No DB, no Redis — stateless; reads /spn, memoizes per file.
  # Ships DORMANT: strategy-signal only calls it when artha.margin.span-enabled=true
  # (default false → flat-pct fallback). A missing/stale .spn is visible at /health.
  margin-service:
    build:
      context: ..
      dockerfile: services/margin-service/Dockerfile
    image: arthayantra/margin-service:dev
    container_name: ay-margin-service
    environment:
      SPN_DIR: /spn
    volumes:
      - ../deploy/span-files:/spn:ro      # daily .spn files, host-fetched, read-only
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8086/health').read() else 1)\""]
      interval: 10s
      retries: 12
      start_period: 20s
    mem_limit: 192m
    restart: unless-stopped
    logging: *default-logging

  # ---- SPA static server (React) ----
  # Internal-only; the gateway's catch-all route serves it on / (same origin,
  # zero CORS anywhere - a Stage C acceptance criterion). The original Angular SPA
  # was removed once the React cutover (Phase 25 / PR #104) was complete.
  frontend-react:
    build:
      context: ../frontend-react
    image: arthayantra/frontend-react:dev
    container_name: ay-frontend-react
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 10s
      retries: 6
      start_period: 5s
    mem_limit: 64m
    restart: unless-stopped
    logging: *default-logging

  # ---- dev-tools profile (A.1.2 / S6 ports) -------------------------------
  adminer:
    image: adminer:5.4.2
    container_name: ay-adminer
    profiles: [dev-tools]
    ports:
      - "127.0.0.1:8085:8080" # S6: moved off host 8080 (gateway's port)
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 10s
      retries: 5
    mem_limit: 128m
    restart: unless-stopped
    logging: *default-logging

  redisinsight:
    image: redis/redisinsight:2.70
    container_name: ay-redisinsight
    profiles: [dev-tools]
    ports:
      - "127.0.0.1:5540:5540" # RedisInsight current default port (S6)
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5540/api/health > /dev/null 2>&1 || exit 1"]
      interval: 10s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

  # dev-tools publishes the internal service ports on loopback for T2 (A.14)
  mds-publish:
    image: alpine/socat:1.8.0.3
    container_name: ay-mds-publish
    profiles: [dev-tools]
    command: ["TCP-LISTEN:8081,fork,reuseaddr", "TCP:market-data-service:8081"]
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      market-data-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "socat", "-V"]
      interval: 30s
      retries: 3
    mem_limit: 16m
    restart: unless-stopped
    logging: *default-logging

  sss-publish:
    image: alpine/socat:1.8.0.3
    container_name: ay-sss-publish
    profiles: [dev-tools]
    command: ["TCP-LISTEN:8082,fork,reuseaddr", "TCP:strategy-signal-service:8082"]
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      strategy-signal-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "socat", "-V"]
      interval: 30s
      retries: 3
    mem_limit: 16m
    restart: unless-stopped
    logging: *default-logging

  # dev-tools publishes redis 6379 on loopback for T2 host-run services
  # (A.14). Compose can't gate a port mapping behind a profile, so a tiny
  # socat forwarder carries the publish for the profile.
  redis-publish:
    image: alpine/socat:1.8.0.3
    container_name: ay-redis-publish
    profiles: [dev-tools]
    command: ["TCP-LISTEN:6379,fork,reuseaddr", "TCP:redis:6379"]
    ports:
      - "127.0.0.1:6379:6379"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "socat", "-V"]
      interval: 30s
      retries: 3
    mem_limit: 16m
    restart: unless-stopped
    logging: *default-logging
