# E1 §3.3 Market-Movers — NIFTY-Bank stock-future momentum (long-only v1).
#
# A futures_screener strategy: each day's tradable set = the top bank-sector stock futures the
# market-data Market-Movers screener picks (8/9-day breakout + Open=Low + OI long-quadrant + daily-RSI,
# ranked by move x liquidity). The screener does the WHICH-stock pick; these entry_rules do the WHEN on
# each picked future (momentum: RSI>55 above VWAP, SuperTrend up). The universe re-screens each live
# reload (08:40 + hot-swap) and is submission-pinned for backtest parity.
#
# NOT a boot-seeded scalper (it has no scalper confluence gate) — register via the API:
#   POST /api/v1/strategies  (then publish from the UI to go live).
# Backtest = FUNCTIONAL plumbing only (single-instrument runner signals on the TOP pick; ~0 trades on
# muted history is expected) — judge the edge on FORWARD live paper, like the 12 owner-validated scalpers.
# v2 widens the radar to the full NIFTY-50 via the Upstox active F&O instrument-key lookup; the SHORT
# side is SPAN-gated.
schema: strategy-schema/v1
id: mm-stockfut-bank
name: "Market Movers — Bank Stock Futures (long)"
description: "E1 §3.3 dynamic Market-Movers stock-future momentum on the NIFTY-Bank radar (long-only)."
version: 1.0.0
tags: [market-movers, stock-futures, momentum, e1]
universe:
  mode: futures_screener
  side: long
  max_picks: 5
timeframes: { primary: 5m }
indicators:
  - { name: RSI, alias: rsi, timeframe: 5m, params: { period: 14 }, weight: 1.0 }
  - { name: VWAP, alias: vwap, timeframe: 5m, weight: 1.0 }
  - { name: SUPERTREND, alias: st, timeframe: 5m, params: { period: 10, multiplier: 3.0 }, weight: 1.0 }
entry_rules:
  direction: long
  gate:
    all:
      - "rsi > 55"
      - "close > vwap"
  scoring: { threshold: 0.5 }
exit_rules:
  - { type: stop_loss, params: { basis: atr_multiple, value: 2.0, atr_period: 14 } }
  - { type: signal_exit, params: { rule: "rsi < 50" } }
risk:
  position_sizing: { method: fixed_quantity, params: { quantity: 1 } }
  max_positions: 5
  session: { style: intraday, square_off: "15:12" }
