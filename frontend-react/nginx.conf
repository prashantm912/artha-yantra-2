# frontend-react nginx (React cutover): static SPA behind the gateway. The gateway is
# the SOLE ingress - this server is internal-only, same origin, zero CORS. Mirrors the
# frontend-ui nginx (the SPA fallback / gzip / caching are framework-agnostic); only the
# served dist differs (Vite emits a flat dist/, vs Angular's dist/<project>/browser/).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # immutable hashed assets (Vite emits assets/ with content-hashed names)
    location ~* \.(js|css|woff2?|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_static on;
}
