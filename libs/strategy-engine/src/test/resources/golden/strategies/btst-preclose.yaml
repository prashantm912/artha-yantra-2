# Golden feature: A9/A7 [FP-6] btst pre-close evaluation - once per day at
# pre_close_at against the deterministic pre-close daily view; at_close fill.
schema: strategy-schema/v1
id: golden-btst-preclose
name: "Golden BTST Preclose"
version: 1.0.0
universe:
  mode: explicit
  instruments:
    - { exchange: NSE, tradingsymbol: "NIFTY 50" }
timeframes: { primary: 1d, additional: [1m] }
indicators:
  - { name: SMA, alias: sma3, timeframe: 1d, params: { period: 3 }, weight: 1.0,
      normalize: { type: direction } }
entry_rules:
  direction: long
  gate:
    all:
      - "close > sma3"
  scoring: { threshold: 0.5 }
exit_rules:
  - { type: time_stop, params: { max_holding_days: 1 } }
risk:
  position_sizing: { method: percent_equity, params: { percent: 10 } }
  max_positions: 1
  session:
    style: btst
    pre_close_at: "15:20"
    fill_timing: at_close
