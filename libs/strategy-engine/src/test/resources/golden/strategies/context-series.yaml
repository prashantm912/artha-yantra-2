# Golden feature: A7 [FP-19] indicator-level instrument override - a
# VIX_LEVEL gate plus an RS_VS_INDEX contribution read from a second series.
schema: strategy-schema/v1
id: golden-context-series
name: "Golden Context Series"
version: 1.0.0
universe:
  mode: explicit
  instruments:
    - { exchange: NSE, tradingsymbol: "NIFTY 50" }
timeframes: { primary: 1m }
indicators:
  - { name: EMA, alias: ema_fast, timeframe: 1m, params: { period: 9 }, weight: 1.0 }
  - { name: EMA, alias: ema_slow, timeframe: 1m, params: { period: 21 }, weight: 1.0 }
  - { name: RSI, alias: rsi_1m, timeframe: 1m, params: { period: 14 }, weight: 1.0,
      normalize: { type: rsi_momentum } }
  - { name: RS_VS_INDEX, alias: rs_ctx, timeframe: 1m, params: { lookback: 30 }, weight: 0.5,
      optional: true, instrument: { exchange: NSE, tradingsymbol: "INDIA VIX" },
      normalize: { type: linear, from: -0.5, to: 0.5 } }
  - { name: VIX_LEVEL, alias: vix, timeframe: 1m, weight: 0.0,
      instrument: { exchange: NSE, tradingsymbol: "INDIA VIX" } }
entry_rules:
  direction: long
  gate:
    all:
      - crossover: { fast: ema_fast, slow: ema_slow }
      - "vix < 99999"
  scoring: { threshold: 0.2 }
exit_rules:
  - { type: signal_exit, params: { rule: "crossunder(ema_fast, ema_slow)" } }
risk:
  position_sizing: { method: fixed_quantity, params: { quantity: 1 } }
  max_positions: 1
  session: { style: intraday }
