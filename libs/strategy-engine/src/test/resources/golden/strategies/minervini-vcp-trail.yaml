# Minervini VCP breakout with the FULL swing exit doctrine (MV-7.2 + MV-7.4): the ~8% initial stop
# AND the 50-day-MA trailing stop — sell when a daily close breaks below the rising 50-day line (the
# Minervini "close below the 50-day MA" swing exit that protects an extended gain once the run is on).
#
# Same vcp entry as minervini-vcp.yaml (crossover of the close over the Phase-5 pivot on expanding
# volume, above the 20-day MA). Exits, in precedence order: the protective 8% stop first, then the
# 50-day-MA trail. Both use existing engine exit types (stop_loss basis=percent, trailing_stop
# basis=indicator) — no engine change, so the frozen goldens stay byte-identical. The trail warms 50
# daily bars before it can fire (an unwarmed sma50 → the trail is simply inert).
schema: strategy-schema/v1
id: minervini-vcp-trail
name: "Minervini VCP (50-day-MA trail)"
version: 1.0.0
universe:
  mode: explicit
  instruments:
    - { exchange: NSE, tradingsymbol: "NIFTY 50" }
timeframes: { primary: 1d }
indicators:
  - { name: SMA, alias: px, timeframe: 1d, params: { period: 1 }, weight: 1.0,
      normalize: { type: linear, from: 0, to: 100000 } }
  - { name: SMA, alias: sma20, timeframe: 1d, params: { period: 20 }, weight: 1.0 }
  - { name: SMA, alias: sma50, timeframe: 1d, params: { period: 50 }, weight: 1.0 }
  - { name: VOLUME_RATIO, alias: vol, timeframe: 1d, params: { lookback: 20 }, weight: 1.0 }
  - { name: VCP_PIVOT, alias: pivot, timeframe: 1d, weight: 0.0,
      instrument: { exchange: NSE, tradingsymbol: "MINERVINI_PIVOT" } }
entry_rules:
  direction: long
  gate:
    all:
      - crossover: { fast: px, slow: pivot }
      - "vol > 1.2"
      - "px > sma20"
  scoring: { threshold: 0.0 }
exit_rules:
  - { type: stop_loss, params: { basis: percent, value: 8 } }             # MV-7.2 initial protective stop
  - { type: trailing_stop, params: { basis: indicator, alias: sma50 } }   # MV-7.4 50-day-MA close-below trail
risk:
  position_sizing: { method: percent_equity, params: { percent: 5 } }
  max_positions: 1
  session: { style: swing }
