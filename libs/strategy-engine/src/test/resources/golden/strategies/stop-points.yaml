# Golden feature: E9 index_points stop/target basis — absolute index-point
# stop_loss + take_profit distances off the entry price (Nifty ~30-60 pts),
# deterministic on the frozen 1m fixtures. Exercises ExitEvaluator.levelDistance
# case "index_points".
schema: strategy-schema/v1
id: golden-stop-points
name: "Golden Stop Points"
version: 1.0.0
universe:
  mode: explicit
  instruments:
    - { exchange: NSE, tradingsymbol: "NIFTY 50" }
timeframes: { primary: 1m }
indicators:
  - { name: EMA, alias: ema_fast, timeframe: 1m, params: { period: 9 }, weight: 1.0 }
  - { name: EMA, alias: ema_slow, timeframe: 1m, params: { period: 21 }, weight: 1.0 }
  - { name: RSI, alias: rsi_1m, timeframe: 1m, params: { period: 14 }, weight: 1.0,
      normalize: { type: rsi_momentum } }
entry_rules:
  direction: long
  gate:
    all:
      - crossover: { fast: ema_fast, slow: ema_slow }
  scoring: { threshold: 0.2 }
exit_rules:
  - { type: stop_loss,   params: { basis: index_points, value: 30 } }
  - { type: take_profit, params: { basis: index_points, value: 60 } }
risk:
  position_sizing: { method: fixed_quantity, params: { quantity: 1 } }
  max_positions: 1
  session: { style: intraday }
