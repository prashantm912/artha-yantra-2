# Golden feature: E9 indicator trailing basis — trail to a named level (here the
# built-in VWAP); a long exits when close crosses below the level. Exercises
# ExitEvaluator.trailing case "indicator" + the indicatorLevel built-in branch.
schema: strategy-schema/v1
id: golden-trailing-indicator
name: "Golden Trailing Indicator"
version: 1.0.0
universe:
  mode: explicit
  instruments:
    - { exchange: NSE, tradingsymbol: "NIFTY 50" }
timeframes: { primary: 1m }
indicators:
  - { name: EMA, alias: ema_fast, timeframe: 1m, params: { period: 9 }, weight: 1.0 }
  - { name: EMA, alias: ema_slow, timeframe: 1m, params: { period: 21 }, weight: 1.0 }
  - { name: RSI, alias: rsi_1m, timeframe: 1m, params: { period: 14 }, weight: 1.0,
      normalize: { type: rsi_momentum } }
entry_rules:
  direction: long
  gate:
    all:
      - crossover: { fast: ema_fast, slow: ema_slow }
  scoring: { threshold: 0.2 }
exit_rules:
  - { type: trailing_stop, params: { basis: indicator, alias: vwap } }
risk:
  position_sizing: { method: fixed_quantity, params: { quantity: 1 } }
  max_positions: 1
  session: { style: intraday }
