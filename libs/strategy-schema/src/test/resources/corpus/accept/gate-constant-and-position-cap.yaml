# EVO §13 row 21: the widened grammar lets an optimize block tune a gate-expression constant
# (entry_rules.gate.<lhs> → the unique literal-RHS comparison) and a position cap (risk.max_positions).
# Both must pass the schema-pattern gate AND resolve against this config's tree.
schema: strategy-schema/v1
id: gate-constant-and-position-cap
name: "Gate Constant And Position Cap Optimize"
version: 1.0.0
universe:
  mode: explicit
  instruments:
    - { exchange: NSE, tradingsymbol: RELIANCE }
timeframes: { primary: 1m }
indicators:
  - { name: EMA, alias: ema_fast, timeframe: 1m, params: { period: 9 }, weight: 1.0 }
  - { name: EMA, alias: ema_slow, timeframe: 1m, params: { period: 21 }, weight: 1.0 }
  - { name: RSI, alias: rsi_1m, timeframe: 1m, params: { period: 14 }, weight: 1.0,
      normalize: { type: rsi_momentum } }
entry_rules:
  direction: long
  gate:
    all:
      - crossover: { fast: ema_fast, slow: ema_slow }
      - "rsi_1m > 30"                        # the tunable gate constant (unique literal-RHS comparison)
  scoring: { threshold: 0.5 }
exit_rules:
  - { type: signal_exit, params: { rule: "crossunder(ema_fast, ema_slow)" } }
risk:
  position_sizing: { method: fixed_quantity, params: { quantity: 1 } }
  max_positions: 2
  session: { style: intraday }
backtest:
  optimize:
    parameters:
      - { path: "entry_rules.gate.rsi_1m", range: [20, 40], step: 5 }
      - { path: "risk.max_positions", choices: [1, 2, 3] }
    method: grid
    max_trials: 9
    objective: { metric: sharpe, direction: maximize }
