# expect: /entry_rules/gate
schema: strategy-schema/v1
id: reject-arithmetic-gate
name: "Arithmetic In Gate"
version: 1.0.0
universe:
  mode: explicit
  instruments:
    - { exchange: NSE, tradingsymbol: RELIANCE }
timeframes: { primary: 1m }
indicators:
  - { name: EMA, alias: ema_fast, timeframe: 1m, params: { period: 9 }, weight: 1.0 }
  - { name: VWAP, alias: vwap_1m, timeframe: 1m, weight: 1.0 }
entry_rules:
  direction: long
  gate:
    all:
      - "close > vwap_1m * 1.01"   # NO arbitrary arithmetic in v1 (closed grammar)
  scoring: { threshold: 0.5 }
exit_rules:
  - { type: stop_loss, params: { basis: premium_pct, value: 20 } }
risk:
  position_sizing: { method: fixed_quantity, params: { quantity: 1 } }
  max_positions: 1
  session: { style: intraday }
