# expect: /risk/session/fill_timing
schema: strategy-schema/v1
id: reject-bad-fill-timing
name: "Bad Fill Timing"
version: 1.0.0
universe:
  mode: explicit
  instruments:
    - { exchange: NSE, tradingsymbol: RELIANCE }
timeframes: { primary: 1d }
indicators:
  - { name: EMA, alias: ema20, timeframe: 1d, params: { period: 20 }, weight: 1.0 }
entry_rules:
  direction: long
  gate:
    all:
      - "close > ema20"
  scoring: { threshold: 0.5 }
exit_rules:
  - { type: time_stop, params: { max_holding_days: 2 } }
risk:
  position_sizing: { method: fixed_quantity, params: { quantity: 1 } }
  max_positions: 1
  session:
    style: btst
    fill_timing: at_open      # A7 enum is next_open | at_close
