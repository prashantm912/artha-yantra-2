# expect: /indicators/0/normalize
schema: strategy-schema/v1
id: reject-bad-normalize
name: "Bad Normalize Type"
version: 1.0.0
universe:
  mode: explicit
  instruments:
    - { exchange: NSE, tradingsymbol: RELIANCE }
timeframes: { primary: 1m }
indicators:
  - { name: RSI, alias: rsi_1m, timeframe: 1m, params: { period: 14 }, weight: 1.0,
      normalize: { type: sigmoid, steepness: 2 } }   # unknown normalizer type
entry_rules:
  direction: long
  gate:
    all:
      - "rsi_1m > 50"
  scoring: { threshold: 0.5 }
exit_rules:
  - { type: stop_loss, params: { basis: r_multiple, value: 1.5 } }
risk:
  position_sizing: { method: fixed_quantity, params: { quantity: 1 } }
  max_positions: 1
  session: { style: intraday }
