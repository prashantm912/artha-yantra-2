# expect: /risk/session/touch_basis
schema: strategy-schema/v1
id: reject-bad-touch-basis
name: "Bad Touch Basis"
version: 1.0.0
universe:
  mode: explicit
  instruments:
    - { exchange: NSE, tradingsymbol: RELIANCE }
timeframes: { primary: 1d }
indicators:
  - { name: EMA, alias: ema20, timeframe: 1d, params: { period: 20 }, weight: 1.0 }
entry_rules:
  direction: long
  gate:
    all:
      - "close > ema20"
  scoring: { threshold: 0.5 }
exit_rules:
  - { type: time_stop, params: { max_holding_days: 2 } }
risk:
  position_sizing: { method: fixed_quantity, params: { quantity: 1 } }
  max_positions: 1
  session:
    style: swing
    touch_basis: bar_close      # P1-10 enum is bar_hl_worstof only
