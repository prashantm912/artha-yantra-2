# expect: /indicators/1/timeframe
schema: strategy-schema/v1
id: reject-undeclared-timeframe
name: "Undeclared Timeframe"
version: 1.0.0
universe:
  mode: explicit
  instruments:
    - { exchange: NSE, tradingsymbol: RELIANCE }
timeframes: { primary: 1m }
indicators:
  - { name: EMA, alias: ema_fast, timeframe: 1m, params: { period: 9 }, weight: 1.0 }
  - { name: SUPERTREND, alias: st_5m, timeframe: 5m, params: { period: 10, multiplier: 2.0 },
      weight: 1.0, normalize: { type: direction } }   # 5m is not declared under timeframes
entry_rules:
  direction: long
  gate:
    all:
      - "close > ema_fast"
  scoring: { threshold: 0.5 }
exit_rules:
  - { type: stop_loss, params: { basis: r_multiple, value: 1.5 } }
risk:
  position_sizing: { method: fixed_quantity, params: { quantity: 1 } }
  max_positions: 1
  session: { style: intraday }
