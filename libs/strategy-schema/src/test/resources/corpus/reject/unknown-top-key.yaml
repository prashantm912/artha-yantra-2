# expect: paper_trading
schema: strategy-schema/v1
id: reject-unknown-top-key
name: "Unknown Top-Level Key"
version: 1.0.0
paper_trading: true            # not part of strategy-schema/v1 (notification settings etc. live OUTSIDE the document)
universe:
  mode: explicit
  instruments:
    - { exchange: NSE, tradingsymbol: RELIANCE }
timeframes: { primary: 1m }
indicators:
  - { name: EMA, alias: ema_fast, timeframe: 1m, params: { period: 9 }, weight: 1.0 }
entry_rules:
  direction: long
  gate:
    all:
      - "close > ema_fast"
  scoring: { threshold: 0.5 }
exit_rules:
  - { type: stop_loss, params: { basis: r_multiple, value: 1.5 } }
risk:
  position_sizing: { method: fixed_quantity, params: { quantity: 1 } }
  max_positions: 1
  session: { style: intraday }
