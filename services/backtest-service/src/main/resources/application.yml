# backtest-service (Stage D Phase 28). Internal :8083; PG schema `backtest`
# (single writer, D10; reads `marketdata` read-only via the CD-1 grant);
# password via Docker secret file (A.9). Mock is the default profile (D13) —
# the backtest engine is fully credential-free.
server:
  port: 8083

spring:
  application:
    name: backtest-service
  # Bounded HTTP for the auto-configured RestClient.Builder clients (market-data warm /
  # connecting-dots, strategy-signal version resolve) — audit P0-4. 180s read: the cache-first
  # auto-warm GET can page Kite history for minutes on a fresh window; generous but finite.
  http:
    client:
      connect-timeout: 2s
      read-timeout: 180s
  profiles:
    default: mock
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:timescaledb}:${DB_PORT:5432}/artha?currentSchema=backtest
    username: artha
    password: ${ARTHA_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

artha:
  db:
    password-file: ${ARTHA_DB_PASSWORD_FILE:/run/secrets/postgres_password}
  strategy:
    # D14: immutable strategy-version reads over REST (Caffeine-cached); the
    # backtest engine holds NO strategy-schema grant.
    base-url: ${ARTHA_STRATEGY_BASE_URL:http://strategy-signal-service:8082}
  marketdata:
    # Cache-first candle warm before the §D.6 pre-flight + replay: backtest never
    # fetches on demand, so a fresh/uncovered window is warmed via market-data's GET
    # /api/v1/market/candles (which backfills the shared store CandleReader reads).
    base-url: ${ARTHA_MARKETDATA_BASE_URL:http://market-data-service:8081}
  backtest:
    # 0 => max(1, availableProcessors - 2) platform workers (D12); override for tests.
    workers: ${ARTHA_BACKTEST_WORKERS:0}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

---
# loopback overrides for bare-metal dev runs (T2)
spring:
  config:
    activate:
      on-profile: dev
  data:
    redis:
      host: 127.0.0.1
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/artha?currentSchema=backtest
artha:
  db:
    password-file: ${ARTHA_DB_PASSWORD_FILE:deploy/secrets/postgres_password}
  strategy:
    base-url: ${ARTHA_STRATEGY_BASE_URL:http://127.0.0.1:8082}
