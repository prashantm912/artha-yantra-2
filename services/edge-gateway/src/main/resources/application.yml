# edge-gateway (A.2). Logging defaults (ECS JSON + masking) come from
# common-web-core's ArthaLoggingDefaultsPostProcessor (A.6).
server:
  port: 8080
  reactive:
    session:
      cookie:
        name: SESSION
        http-only: true     # A.2.3
        same-site: strict   # A.2.3 (Secure added dynamically behind X-Forwarded-Proto: https)
        path: /
      timeout: 12h

spring:
  application:
    name: edge-gateway
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  session:
    timeout: 12h            # covers a full trading day (A.2.3)
    redis:
      namespace: artha:session
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            # A.2.6: generous 50 req/s global valve on ROUTED traffic —
            # catches runaway frontend loops, not humans
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
                key-resolver: "#{@globalKeyResolver}"
          routes:
            # ---- D8 route table (A.2.2). In Stage A every target except
            # market-data-service is absent -> 503 + envelope, never a trace.
            - id: market-data
              uri: ${ARTHA_ROUTE_MARKET_DATA:http://market-data-service:8081}
              predicates:
                - Path=/api/v1/market/**,/api/v1/instruments/**,/api/v1/watchlists/**,/api/v1/auth/kite/**
            - id: strategy-signal
              uri: ${ARTHA_ROUTE_STRATEGY:http://strategy-signal-service:8082}
              predicates:
                - Path=/api/v1/strategies/**,/api/v1/signals/**,/api/v1/paper/**,/api/v1/risk/**,/api/v1/journal/**
            - id: backtest
              uri: ${ARTHA_ROUTE_BACKTEST:http://backtest-service:8083}
              predicates:
                # /api/v1/indicators/** is the Phase-40B chart indicator-series surface (A13),
                # served by backtest-service (it embeds the engine JAR + holds marketdata grants)
                - Path=/api/v1/backtests/**,/api/v1/indicators/**
            - id: optimizer
              uri: ${ARTHA_ROUTE_OPTIMIZER:http://optimizer-service:8084}
              predicates:
                - Path=/api/v1/optimizations/**
            # CD-8 (Phase 24): service api-docs proxied for the aggregated
            # Swagger UI; the UI itself is enabled under mock only (below)
            - id: docs-market-data
              uri: ${ARTHA_ROUTE_MARKET_DATA:http://market-data-service:8081}
              predicates:
                - Path=/docs/market-data/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            - id: docs-strategy-signal
              uri: ${ARTHA_ROUTE_STRATEGY:http://strategy-signal-service:8082}
              predicates:
                - Path=/docs/strategy-signal/v3/api-docs
              filters:
                - SetPath=/v3/api-docs
            # everything else -> frontend static files (gateway-local
            # controllers and actuator mappings take precedence over routes)
            - id: frontend-ui
              uri: ${ARTHA_ROUTE_FRONTEND:http://frontend-ui:80}
              order: 10000
              predicates:
                - Path=/**

artha:
  owner-password-hash: ${ARTHA_OWNER_PASSWORD_HASH:}
  ws:
    # A.7.2: conflated flush rate for tick topics, 10-20 Hz sane range
    flush-hz: ${GATEWAY_WS_FLUSH_HZ:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# CD-8: the gateway's own spec is always capturable; the aggregated Swagger
# UI is a mock-profile convenience (plan 5.3) and stays off otherwise
springdoc:
  swagger-ui:
    enabled: false

---
# plan 5.3: aggregated Swagger UI for the owner, MOCK profile only
spring:
  config:
    activate:
      on-profile: mock
springdoc:
  swagger-ui:
    enabled: true
    urls:
      - name: edge-gateway
        url: /v3/api-docs
      - name: market-data-service
        url: /docs/market-data/v3/api-docs
      - name: strategy-signal-service
        url: /docs/strategy-signal/v3/api-docs

---
# T2 host-run inner loop (docs/dev-setup.md): compose Redis published on
# loopback by the dev-tools profile
spring:
  config:
    activate:
      on-profile: dev
  data:
    redis:
      host: 127.0.0.1
