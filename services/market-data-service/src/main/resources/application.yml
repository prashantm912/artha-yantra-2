# market-data-service (A.7a). Logging defaults (ECS JSON + masking) come from
# common-web-core (A.6). Mock is the DEFAULT profile — bare starts are always
# credential-free (D13); live must be selected explicitly and fails fast
# without secrets.
server:
  port: 8081

spring:
  application:
    name: market-data-service
  # Bounded HTTP backstop for auto-configured RestClient.Builder clients — chiefly the four
  # kite/live gateways (quote/historical/session/instrument-dump), whose unbounded reads could
  # park the fixedDelay OI-snapshot loop forever on a half-open socket (audit P0-4). Clients
  # that set their own SimpleClientHttpRequestFactory (Upstox/NSE/BSE) keep their tighter values.
  http:
    client:
      connect-timeout: 3s
      read-timeout: 60s
  profiles:
    default: mock
  threads:
    virtual:
      enabled: true   # B-3: blocking on limiters is cheap on virtual threads
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  datasource:
    # schema-per-service: marketdata, written ONLY by this service (D10)
    url: jdbc:postgresql://${DB_HOST:timescaledb}:${DB_PORT:5432}/artha?currentSchema=marketdata
    username: artha
    password: ${ARTHA_DB_PASSWORD:}   # secret-file override via artha.db.password-file
    hikari:
      maximum-pool-size: 5            # COMMON §9.6 single-user sizing
      minimum-idle: 1
  cache:
    type: caffeine

artha:
  db:
    # read into spring.datasource.password by SecretFilePasswordPostProcessor
    password-file: ${ARTHA_DB_PASSWORD_FILE:/run/secrets/postgres_password}
  console:
    # SEC-02: the B5 read-only SQL console runs under a DEDICATED least-privilege Postgres LOGIN role
    # (ay_console — NOSUPERUSER, SELECT-only on marketdata; admin lineage V002) via its OWN datasource,
    # NOT the artha superuser — so `SELECT pg_read_file(...)` can no longer read container secrets.
    # The role's password is set by the console-role-init compose one-shot from the SAME env var, so
    # the app and the role always agree; a single shared .env keeps mock+live consistent. The URL is
    # reused from spring.datasource.url. Name MUST byte-match the compose passthrough
    # ARTHA_CONSOLE_DB_PASSWORD (#653). Default below is the documented mock/CI credential.
    datasource:
      username: ay_console
      password: ${ARTHA_CONSOLE_DB_PASSWORD:console-readonly-local}
  feed:
    autostart: ${ARTHA_FEED_AUTOSTART:true}
  mock:
    ticks-per-sec: ${MOCK_TICKS_PER_SEC:1}
    scenario: ${MOCK_SCENARIO:trend-up}
    seed: ${MOCK_SEED:42}
    instrument-count: ${MOCK_INSTRUMENT_COUNT:10}
  corporate-actions:
    # A14 kill switch (2026-07-10): the 16:30-IST anchor-close CA sweep. Default-armed
    # (matchIfMissing=true on CorporateActionJob's @ConditionalOnProperty); flip false via
    # ARTHA_CORPORATE_ACTIONS_ENABLED to disarm the scheduled job entirely — after the OOM incident
    # the operator needs a one-line .env disarm without a code change. Name MUST byte-match the
    # docker-compose passthrough key ARTHA_CORPORATE_ACTIONS_ENABLED (#653).
    enabled: ${ARTHA_CORPORATE_ACTIONS_ENABLED:true}
    # V057 rebuild retry cooldown (days). A FAILED staged rebuild suppresses re-detection for this
    # long. Needed because the staged swap leaves the cache INTACT on failure, which restores nightly
    # re-detection — unbounded, that is a ~196-page Kite re-fetch per symbol per night against the
    # shared limiter for any symbol that can never pass verification. Given a placeholder + compose
    # passthrough deliberately: a bare @Value default is pinned until an image rebuild (#653), and
    # this is exactly the knob whose right value is only learnable from live behaviour. Name MUST
    # byte-match the docker-compose passthrough key ARTHA_CORPORATE_ACTIONS_REBUILD_RETRY_COOLDOWN_DAYS.
    rebuild-retry-cooldown-days: ${ARTHA_CORPORATE_ACTIONS_REBUILD_RETRY_COOLDOWN_DAYS:7}
  market:
    # A10 (owner decision 2026-07-12): retention horizon (days) for the compressed
    # options_chain_snapshots hypertable. OptionsSnapshotPruneJob drops whole 1-day chunks older
    # than this at 03:30 IST via drop_chunks (compression-safe; NEVER a row-wise DELETE). Overrides
    # the V006/V010 A2 ">= 5y floor, default no-drop". No-op until ~2027-06 (capture began 2026-06-15).
    # The property key (artha.market.snapshot-retention-days) does NOT relaxed-bind from the desired
    # env name, so the ${...} placeholder MUST byte-match the compose passthrough
    # ARTHA_SNAPSHOT_RETENTION_DAYS (#653) for a .env override to reach the container.
    snapshot-retention-days: ${ARTHA_SNAPSHOT_RETENTION_DAYS:365}
  # OpenAlgo broker-swap spine (plan §3/§4). Per-capability source selector — DEFAULT kite, so
  # Phase 0 changes NO routing (the live OpenAlgo gateways bind only when a capability is flipped to
  # openalgo). The production cutover + OI-coverage canary is Phase 1 (§4).
  marketdata:
    source:
      ticker: ${ARTHA_MD_SOURCE_TICKER:kite}             # kite | upstox (WS live tick feed; upstox=Wave U3 direct v3 market-data-feed WS on the login-free 1-yr analytics token, REQUIRES the analytics token file. GATED §17.3: BUILT but DORMANT — flip ONLY after a live scalp place-ack/tick-latency A/B vs Kite-WS is green. Kite stays default; exactly one feed runs)
      quotes: ${ARTHA_MD_SOURCE_QUOTES:kite}             # kite | openalgo | upstox (spot/FUT live quotes; upstox=Wave U2 direct /v2/market-quote/quotes batch on the login-free 1-yr analytics token, REQUIRES the analytics token file — Kite stays the fallback for unmapped keys, e.g. FUT symbols)
      candles: ${ARTHA_MD_SOURCE_CANDLES:kite}           # kite | openalgo
      optionchain: ${ARTHA_MD_SOURCE_OPTIONCHAIN:kite}   # kite | openalgo | upstox (per-strike OI capture; flip ONLY after the live OI-coverage canary is green, §17.11. upstox=Wave U1 direct /v2/option/chain on the login-free 1-yr analytics token, REQUIRES the analytics token file)
      fiidii: ${ARTHA_MD_SOURCE_FIIDII:nse}              # nse | upstox (ADR-0002 U2; upstox REQUIRES artha.upstox.analytics.enabled=true)
      optionanalytics: ${ARTHA_MD_SOURCE_OPTIONANALYTICS:native}  # native | upstox — PCR + max-pain source (upstox = full chain; REQUIRES artha.upstox.analytics.enabled=true)
    # Auto-resume the expired-instruments backfill so it survives restarts WITHOUT a manual re-POST
    # (the job is an in-memory thread — any market-data/Docker/host restart kills it). On boot it fires
    # the coverage-aware resume; hourly it self-heals a stalled/idle run + picks up newly-expired
    # contracts. Double-gated on the analytics client being present, so mock (no Upstox client) no-ops.
    # See ExpiredBackfillAutoResume.
    expired-backfill:
      auto-resume: ${ARTHA_EXPIRED_BACKFILL_AUTORESUME:true}
      self-heal-cron: ${ARTHA_EXPIRED_BACKFILL_SELFHEAL_CRON:0 17 * * * *}   # second 0, minute 17, every hour
      catchup-hours: ${ARTHA_EXPIRED_BACKFILL_CATCHUP_HOURS:20}
  openalgo:
    base-url: ${ARTHA_OPENALGO_BASE_URL:http://openalgo:5000}
    api-key-file: ${ARTHA_OPENALGO_API_KEY_FILE:/run/secrets/openalgo_api_key}
    # Phase-1 entry gate (§17.11): must be green vs the LIVE appliance before any source.* flips
    contract-canary-enabled: ${ARTHA_OPENALGO_CANARY_ENABLED:false}
    # Data-foundation milestone (plan §2/§3) — dedicated OpenAlgo clients, INDEPENDENT of source.*
    # routing. Dormant by default; flipped on the live profile only AFTER an Upstox-backed appliance
    # is connected (no SDK in this repo; the appliance fronts the broker).
    oi-backfill-enabled: ${ARTHA_OPENALGO_OI_BACKFILL_ENABLED:false}      # POST /market/admin/oi-backfill 1m-OHLC+OI importer
    global-quotes-enabled: ${ARTHA_OPENALGO_GLOBAL_QUOTES_ENABLED:false}  # Connecting-Dots Dow factor (DOWJONES@GLOBAL_INDEX)
  # Upstox Market-Information analytics side-channel (ADR-0002). A SEPARATE, dedicated analytics token
  # (NOT the OpenAlgo broker session), read from its secret file. Dormant by default; the U1
  # entitlement probe (GET /market/admin/upstox-entitlement) gates the rest of the analytics build.
  upstox:
    analytics:
      enabled: ${ARTHA_UPSTOX_ANALYTICS_ENABLED:false}
      base-url: ${ARTHA_UPSTOX_ANALYTICS_BASE_URL:https://api.upstox.com}
      token-file: ${ARTHA_UPSTOX_ANALYTICS_TOKEN_FILE:/run/secrets/upstox_analytics_token}
    canary-enabled: ${ARTHA_UPSTOX_CANARY_ENABLED:false}   # U7 daily contract drift probe (ntfy on drift)
    # Connecting-Dots Dow factor off the ALREADY-LIVE Upstox world-indices feed (GLOBAL_INDEX|^DJI).
    # HOLD-tier: arming makes the Dow dot real, which CHANGES WHICH SIGNALS FIRE (today it contributes
    # Neutral to every composite) — owner decision after forward measurement. Requires analytics.enabled;
    # mutually exclusive with artha.openalgo.global-quotes-enabled (both on ⇒ context refuses to start).
    global-quotes-enabled: ${ARTHA_UPSTOX_GLOBAL_QUOTES_ENABLED:false}
    fno-master:
      # Default-on when the F&O master client is bound. The canary overrides it off because its
      # WireMock stubs are installed after ApplicationReadyEvent; failed loads retry after 5 minutes.
      warm-enabled: ${ARTHA_UPSTOX_FNO_MASTER_WARM_ENABLED:true}
      warm-interval: ${ARTHA_UPSTOX_FNO_MASTER_WARM_INTERVAL:PT6H}

# B-3: the per-endpoint-family resilience stack — exactly one resilience
# dependency. Limiter saturation queues up to 5s (virtual threads), then 429
# RATE_LIMIT_LOCAL. Retry is built programmatically (full jitter +
# Retry-After honoring) in KiteCallExecutor.
resilience4j:
  ratelimiter:
    instances:
      kite-historical:
        limit-for-period: 3
        limit-refresh-period: 1s
        timeout-duration: 5s
      kite-quote:
        limit-for-period: 1
        limit-refresh-period: 1s
        timeout-duration: 5s
      kite-dump:
        limit-for-period: 1
        limit-refresh-period: 30m
        timeout-duration: 5s
      kite-misc:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 5s
      # OpenAlgo REST budgets (plan §3/§4). Conservative placeholders — MEASURE the appliance's
      # real per-endpoint limits before the Phase-1 cutover (Risk R3).
      openalgo-quote:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 5s
      openalgo-historical:
        limit-for-period: 5
        limit-refresh-period: 1s
        timeout-duration: 5s
  circuitbreaker:
    instances:
      kite-rest:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        # A LOCAL limiter rejection is not an upstream fault. Since the breaker now sits OUTSIDE the
        # limiter (so an open breaker cannot burn a scarce permit, F-SYNC), RequestNotPermitted would
        # otherwise propagate THROUGH the breaker and be recorded as a failure — 5 local saturations
        # in a 10-call window would open the SHARED breaker while Kite is perfectly healthy and 503
        # every family. Ignore it: it says "we paced ourselves", never "the upstream is broken".
        ignore-exceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
      # OpenAlgo gets its OWN breaker so an OpenAlgo outage never trips Kite-direct calls (§4)
      openalgo-rest:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        # Same reasoning as kite-rest above — a local pacing rejection must never open this breaker.
        ignore-exceptions:
          - io.github.resilience4j.ratelimiter.RequestNotPermitted
      kite-ticker:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

---
# T2 host-run inner loop: compose Redis/Postgres published on loopback
spring:
  config:
    activate:
      on-profile: dev
  data:
    redis:
      host: 127.0.0.1
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/artha?currentSchema=marketdata
artha:
  db:
    password-file: ${ARTHA_DB_PASSWORD_FILE:deploy/secrets/postgres_password}
---
# Live: oipulse OI capture — full chain for ALL 6 F&O indices, every in-horizon expiry.
# Indices only (NSE: NIFTY 50/BANK/FIN SERVICE/MID SELECT; BSE: SENSEX/BANKEX) — no stock
# options. At Kite's 1 req/s /quote limit the 6-index snapshot cycle (~71 batched quote calls,
# per-expiry) self-spaces via @Scheduled(fixedDelay) to an effective ~2-min OI cadence; tighter
# needs the whole-universe batch refactor (deferred).
spring:
  config:
    activate:
      on-profile: live
artha:
  subscriptions:
    # WS ticker — all 6 F&O index SPOTS + INDIA VIX, PINNED (eviction-resistant). EXCHANGE:SYMBOL.
    pinned-indices: NSE:NIFTY 50,NSE:NIFTY BANK,NSE:NIFTY FIN SERVICE,NSE:NIFTY MID SELECT,BSE:SENSEX,BSE:BANKEX,NSE:INDIA VIX
  options:
    # full option chain (OI/IV/greeks) for ALL 6 F&O indices, every expiry <=90d
    snapshot-underlyings: NIFTY 50,NIFTY BANK,NIFTY FIN SERVICE,NIFTY MID SELECT,SENSEX,BANKEX
    snapshot-interval-ms: 60000
    snapshot-expiry-horizon-days: 90
    # Live premium 1m capture: nearest expiry, ATM +/- configured width, both CE and PE.
    atm-pinner:
      underlyings: ${ARTHA_OPTIONS_ATM_PINNER_UNDERLYINGS:NIFTY 50,SENSEX}
      strike-width: ${ARTHA_OPTIONS_ATM_PINNER_STRIKE_WIDTH:5}
      expiry-horizon-days: ${ARTHA_OPTIONS_ATM_PINNER_EXPIRY_HORIZON_DAYS:7}
  data-quality:
    # FID P2-4: settled-day per-symbol completeness (chain capture, primary 1m, NSE EQ bhavcopy).
    eod-cron: "0 50 19 * * MON-FRI"
    enabled: true
    chain-expected-passes: 187
    chain-min-coverage-pct: 80
    intraday-1m-instruments: NSE:NIFTY 50,NSE:NIFTY BANK,BSE:SENSEX
    intraday-min-coverage-pct: 95
    bhavcopy-min-ratio: 0.98
  futures:
    # WS ticker pinned futures (front/next/far, auto-roll) — the 6 F&O indices.
    # Drives FuturesPinner (live ticker) + ContinuousFuturesRoller (EOD roll).
    underlyings: NIFTY 50,NIFTY BANK,NIFTY FIN SERVICE,NIFTY MID SELECT,SENSEX,BANKEX
    # REST futures-OI snapshots: the 6 F&O index futs + all 17 NSE bank-sector F&O stocks (forward-only
    # OI capture; one batched quotes() call per pass — see FuturesOiSnapshotService).
    oi-snapshot-underlyings: NIFTY 50,NIFTY BANK,NIFTY FIN SERVICE,NIFTY MID SELECT,SENSEX,BANKEX,HDFCBANK,ICICIBANK,SBIN,AXISBANK,KOTAKBANK,INDUSINDBK,BANKBARODA,PNB,AUBANK,FEDERALBNK,IDFCFIRSTB,CANBK,BANDHANBNK,BANKINDIA,RBLBANK,UNIONBANK,YESBANK
    oi-snapshot-interval-ms: 60000
    # /banks-grid sector universe: the 17 bank-sector stocks (indices have their own /banks view).
    bank-stocks: HDFCBANK,ICICIBANK,SBIN,AXISBANK,KOTAKBANK,INDUSINDBK,BANKBARODA,PNB,AUBANK,FEDERALBNK,IDFCFIRSTB,CANBK,BANDHANBNK,BANKINDIA,RBLBANK,UNIONBANK,YESBANK
  nse:
    base-url: https://www.nseindia.com
    archives-url: https://nsearchives.nseindia.com
    eod-cron: "0 0 19 * * MON-FRI"
    bhavcopy:
      # NSE series projected into candles as 1d source=BHAVCOPY (cash equities). EQ = rolling
      # settlement, BE = trade-to-trade. Non-equity series (GS gilts, etc.) stay raw-only.
      candle-series: EQ,BE
  bse:
    base-url: https://www.bseindia.com
    api-url: https://api.bseindia.com   # corporate-actions JSON (DefaultData/w)
  bhavcopy:
    # Self-healing EOD universe backfill (Phase A/B). Runs daily after both exchanges publish
    # (NSE ~19:00, BSE ~18:00 IST) and on startup; catches up every missing trading day from the
    # table watermark to today. ca-lookback-days bounds the corporate-action ratio refresh (Phase C).
    eod-cron: "0 30 19 * * MON-FRI"
    # Deep universe history (~1 year): the first boot backfills a year of daily candles so the
    # split/bonus adjustment reaches old corporate actions, and a long downtime self-heals back that
    # far. The full-window anti-join (reconcile == window) re-scans the whole span each run, skipping
    # dates already stored, so even a hole left by a throttled deep backfill is re-probed and heals.
    catchup-floor-days: 365      # first-boot depth (empty table)
    catchup-max-days: 365        # hard cap on the catch-up span
    reconcile-lookback-days: 365 # full-window re-scan (heals deep holes, not just a trailing window)
    ca-lookback-days: 420
