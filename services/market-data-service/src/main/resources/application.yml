# market-data-service (A.7a). Logging defaults (ECS JSON + masking) come from
# common-web-core (A.6). Mock is the DEFAULT profile — bare starts are always
# credential-free (D13); live must be selected explicitly and fails fast
# without secrets.
server:
  port: 8081

spring:
  application:
    name: market-data-service
  profiles:
    default: mock
  threads:
    virtual:
      enabled: true   # B-3: blocking on limiters is cheap on virtual threads
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  datasource:
    # schema-per-service: marketdata, written ONLY by this service (D10)
    url: jdbc:postgresql://${DB_HOST:timescaledb}:${DB_PORT:5432}/artha?currentSchema=marketdata
    username: artha
    password: ${ARTHA_DB_PASSWORD:}   # secret-file override via artha.db.password-file
    hikari:
      maximum-pool-size: 5            # COMMON §9.6 single-user sizing
      minimum-idle: 1
  cache:
    type: caffeine

artha:
  db:
    # read into spring.datasource.password by SecretFilePasswordPostProcessor
    password-file: ${ARTHA_DB_PASSWORD_FILE:/run/secrets/postgres_password}
  feed:
    autostart: ${ARTHA_FEED_AUTOSTART:true}
  mock:
    ticks-per-sec: ${MOCK_TICKS_PER_SEC:1}
    scenario: ${MOCK_SCENARIO:trend-up}
    seed: ${MOCK_SEED:42}
    instrument-count: ${MOCK_INSTRUMENT_COUNT:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

---
# T2 host-run inner loop: compose Redis/Postgres published on loopback
spring:
  config:
    activate:
      on-profile: dev
  data:
    redis:
      host: 127.0.0.1
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/artha?currentSchema=marketdata
artha:
  db:
    password-file: ${ARTHA_DB_PASSWORD_FILE:deploy/secrets/postgres_password}
