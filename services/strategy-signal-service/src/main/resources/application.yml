# strategy-signal-service (Phase 21+). Internal :8082; PG schema `strategy`
# (single writer, D10); password via Docker secret file (A.9). Mock is the
# default profile (D13) - the registry is fully credential-free.
server:
  port: 8082

spring:
  application:
    name: strategy-signal-service
  # Bounded HTTP for every auto-configured RestClient.Builder client (market-data candles/OI
  # fan-out, notifier, margin, instrument meta). All of them run on the single signal-eval
  # thread, so an unbounded read once parked live evaluation (entries AND stop/exit passes)
  # forever (audit P0-4). 30s read: a cache-miss candle warm can legitimately page upstream.
  http:
    client:
      connect-timeout: 2s
      read-timeout: 30s
  profiles:
    default: mock
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:timescaledb}:${DB_PORT:5432}/artha?currentSchema=strategy
    username: artha
    password: ${ARTHA_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

artha:
  db:
    password-file: ${ARTHA_DB_PASSWORD_FILE:/run/secrets/postgres_password}
  marketdata:
    # D8: context-instrument existence checks resolve via market-data REST
    # (strategy-signal-service holds NO marketdata grant)
    base-url: ${ARTHA_MARKETDATA_BASE_URL:http://market-data-service:8081}
    # Total-response timeout (ms) for the eval-loop candle warm-up fetch — a slow market-data must
    # fail fast so it can never park signal generation for the session (2026-07-14 incident).
    candles-fetch-timeout-ms: ${ARTHA_MARKETDATA_CANDLES_FETCH_TIMEOUT_MS:10000}
  openalgo:
    # §18.1 order-READ surface (orderbook/positions/tradebook/funds). Default OFF — the
    # DisabledOrderGateway then returns empty lists + a NOT_CONFIGURED funds row, so a mock or
    # Kite-only live stack needs no OpenAlgo API key. Flip on the LIVE profile to wire the
    # RestOpenAlgoOrderReadGateway (reads only — the order-WRITE path stays separately gated).
    order-read-enabled: ${ARTHA_OPENALGO_ORDER_READ_ENABLED:false}
    base-url: ${ARTHA_OPENALGO_BASE_URL:http://openalgo:5000}
    api-key-file: ${ARTHA_OPENALGO_API_KEY_FILE:/run/secrets/openalgo_api_key}
    # §17.3 order-WRITE strategy tag stamped on every OpenAlgo /api/v1/placeorder (it logs/routes by
    # it). The WRITE gateway itself is gated ONLY on artha.scalper.execution=live (default `paper` →
    # the DisabledOrderGateway places nothing); this key just names the tag when that is armed.
    strategy: ${ARTHA_OPENALGO_STRATEGY:ArthaYantra}
  signals:
    engine-enabled: ${ARTHA_SIGNAL_ENGINE_ENABLED:true}
    # Persist one composite_rejections row (V044) per entry evaluation that ended
    # COMPOSITE_BELOW_THRESHOLD, so the RSI/composite operand distribution is analysable. Everything
    # written is already computed by EntryEvaluator — the engine used to discard it. ON by default;
    # this is the KILL SWITCH if the added row rate (~192/session, ~141 KB/day) ever needs stopping
    # without an image rebuild. CHART_GATE_FAILED is never recorded (~3.4x the volume, no signal).
    # Env name MUST match the compose passthrough exactly (#653 trap: a mismatch swallows the override).
    record-composite-rejections: ${ARTHA_SIGNALS_RECORD_COMPOSITE_REJECTIONS:true}
    # composite_rejections retention prune (V044), mirroring the PF-03 risk_suppressions job below:
    # a daily 02:30-IST off-market DELETE of rows older than this horizon (live-only; the mock DB is
    # ephemeral). Generous by design — this is tuning history at ~141 KB/day, ~25 MB/year.
    # 0/negative DISABLES the prune: it is a QUIET no-op (announced once at INFO on boot, silent on
    # every tick, no ops alert — disabling a prune is a legitimate choice, not a fault) and it also
    # guards the wipe, since a non-positive horizon would make the cutoff now() and delete every row.
    composite-rejection-retention-days: ${ARTHA_SIGNALS_COMPOSITE_REJECTION_RETENTION_DAYS:180}
    # PF-03 risk_suppressions retention prune (task_f168c23c). The table is append-only with a low row
    # rate (most sessions zero; worst ~2-3k/day) — retained GENEROUSLY (180d). A daily 02:30-IST
    # off-market DELETE removes rows older than this horizon (live-only; mock DB is ephemeral).
    # 0/negative DISABLES the prune (the guard never lets a non-positive horizon delete everything).
    # Env name MUST match the compose passthrough exactly (#653 trap: a mismatch swallows the override).
    risk-suppression-retention-days: ${ARTHA_SIGNALS_RISK_SUPPRESSION_RETENTION_DAYS:180}
    # V045 signal_eval_outcomes retention. The 3m rollup of the engine's entry-evaluation counters
    # is what makes "was the engine alive on date X" answerable after a restart (the Micrometer
    # counters reset to zero on boot). ~980 rows/day, so 180d is ~176k narrow rows — a few MB.
    # Same shape/default as the risk-suppression knob above: daily 02:30-IST off-market DELETE,
    # live-only, 0/negative DISABLES the prune (the guard never lets it delete everything).
    # Env name MUST match the compose passthrough exactly (#653 trap: a mismatch swallows the override).
    eval-outcome-retention-days: ${ARTHA_SIGNALS_EVAL_OUTCOME_RETENTION_DAYS:180}
    # Subscriber-side watchdog knobs were previously pinned to @Value defaults (#653) — no yml key
    # and no compose passthrough meant .env did NOTHING and they could not be tuned or disabled
    # without an image rebuild. Names MUST match the compose passthroughs exactly (the #653 trap: a
    # mismatch resolves to the default and swallows the override with no error).
    subscriber-watchdog:
      enabled: ${ARTHA_SIGNALS_SUBSCRIBER_WATCHDOG_ENABLED:true}
      bar-gap-ms: ${ARTHA_SIGNALS_SUBSCRIBER_WATCHDOG_BAR_GAP_MS:180000}
      feed-fresh-ms: ${ARTHA_SIGNALS_SUBSCRIBER_WATCHDOG_FEED_FRESH_MS:90000}
    # DRILL-ONLY fault injection for the watchdog above (SignalFaultInjector). Its receive-stall
    # branch is the one live path no external action can reach: the 2026-08-03 drill proved a
    # transport drop self-heals in ~22ms via Lettuce's ConnectionWatchdog, ~4 orders of magnitude
    # under bar-gap-ms, so only an in-process listener-container stop produces a DETECTOR-EQUIVALENT
    # receive stall. It validates the DETECTOR, not the 2026-07-07 DIAGNOSIS — the real incident's
    # mechanism (socket up, listeners gone) is still unreproduced and remains a hypothesis.
    # Enabling it lets an operator BREAK this service on purpose.
    # ⚠️ Deliberately has NO compose passthrough (unlike every knob above) — turning it on requires
    # editing the compose env explicitly, which is the intended friction. This is the ONE place the
    # #653 name-mismatch rule is inverted on purpose: there is no .env name to match.
    fault-injection:
      enabled: false
    # T9 load-coverage watchdog. DISABLED ships the bean with no detector work; OBSERVE_ONLY
    # logs would-page episodes; ARMED publishes named per-slug ntfy alerts through notifier.
    # Names MUST match the compose passthroughs exactly (#653).
    strategy-coverage-watchdog:
      mode: ${ARTHA_SIGNALS_STRATEGY_COVERAGE_WATCHDOG_MODE:DISABLED}
      grace-ms: ${ARTHA_SIGNALS_STRATEGY_COVERAGE_WATCHDOG_GRACE_MS:180000}
    # Entry-side swing data-coverage gate (#1283). DISABLED skips the probe; OBSERVE_ONLY records
    # and logs would-be refusals as WOULD_REFUSE_* rows while the entry PROCEEDS; ARMED refuses.
    # Ships OBSERVE_ONLY (owner, 2026-08-11) so the refusal rate can be measured in production
    # before arming. Names MUST match the compose passthrough exactly (#653).
    swing-coverage-gate:
      mode: ${ARTHA_SIGNALS_SWING_COVERAGE_GATE_MODE:OBSERVE_ONLY}
    # EOD swing missed-batch detector. Ship dormant; the owner arms paging deliberately after
    # configuring the ops ntfy channel. Names MUST match the compose passthrough exactly (#653).
    swing-missed-batch-detector:
      enabled: ${ARTHA_SIGNALS_SWING_MISSED_BATCH_DETECTOR_ENABLED:false}
    # NOTE (2026-07-26): the `starvation-watchdog` block is GONE — SignalStarvationCanary was
    # RETIRED, not merely left dormant. It keyed on the gate-output heartbeat, which stops on any
    # SuperTrend-DOWN leg while bars keep arriving and evaluation keeps up, so arming it would have
    # paged on ordinary bearish tape. The ONLY two oracles a liveness detector may key on are
    # SignalEngine.lastBarReceivedAtMs and lastBarEvaluatedAtMs (SubscriberHealthCanary uses BOTH —
    # receive-gap and eval-lag; SessionLivenessHeartbeat uses the receive gap). Do NOT reintroduce a
    # detector fed by rejections, signals, gate output or eval-outcome counters — all four are
    # confounded by market direction, session window, open positions or engine-mixing.
  notifier:
    # Z1 scalp-signal alerts: a richer ntfy/Telegram push (underlying/strike/option-side, entry/SL/
    # target, confluence) for SCALPER entries, on top of the per-strategy opt-in. Default OFF so a
    # fresh stack never pushes; when on, the generic per-signal push is skipped for scalper entries
    # (the scalp alert is the single push). window-seconds dedupes the same leg (strategy+underlying+
    # side+strike) so a re-printing pattern doesn't re-fire.
    scalp-alerts:
      enabled: ${ARTHA_NOTIFIER_SCALP_ALERTS_ENABLED:false}
      window-seconds: ${ARTHA_NOTIFIER_SCALP_ALERTS_WINDOW_SECONDS:300}
    # §18.4: the deployed app origin used to build the /orders pre-fill deep link in a scalp alert.
    # Blank (default) → the alert carries no link (a relative path can't be tapped from a phone push);
    # set it to the reachable origin (e.g. the Tailscale host) to arm the deep link. The ${ENV} name
    # MUST match the compose passthrough exactly (#653 placeholder trap).
    app-base-url: ${ARTHA_NOTIFIER_APP_BASE_URL:}
  scalper:
    # Tier-1 OI-analytics thresholds (Phase-3.5 T2.1/T2.6/T2.7/T2.8) read by the confluence scorer
    # and the #5 trending-OI pre-gate. ivPairMinGap/ivBothHighFloor are on the 0..1 IV FRACTION scale
    # (10 IV points = 0.10; 40/40 both-high = 0.40). drasticFloor is a conservative, DB-tunable,
    # index-agnostic v1 placeholder dOI magnitude. All values are tunable (DB params later, §12.2).
    oi:
      cross-filter-pct: 50
      drastic-floor: 50000
      # dead-dot recalibration (P1/P2 2026-07-10; T22+T6 2026-07-25): iv-pair 0.10->0.02 (a 10-IV-pt
      # gap never occurs on NIFTY weeklies); spurt floors (50,8)->(15,3) — the OI floor 50 sat at the
      # p95 of its own operand, joint pass 1.26% -> 15.5% measured; vwap-min-distance-bps 15 makes
      # the vwap DOT need a real distance (the entry gate already enforces the side; the dot was free
      # at 100% support over six sessions). Ops-tunable via .env WITHOUT an image rebuild; the ${ENV}
      # names MUST match the compose passthroughs exactly (#653 placeholder trap).
      iv-pair-min-gap: ${ARTHA_SCALPER_OI_IV_PAIR_MIN_GAP:0.02}
      iv-both-high-floor: 0.40
      spurt-oi-pct: ${ARTHA_SCALPER_OI_SPURT_OI_PCT:15}
      spurt-price-pct: ${ARTHA_SCALPER_OI_SPURT_PRICE_PCT:3}
      vwap-min-distance-bps: ${ARTHA_SCALPER_OI_VWAP_MIN_DISTANCE_BPS:15}
      # F5 U4b §5.3 dot-plane data-coverage floor. INERT unless a strategy carries the DEFAULT-OFF
      # `dot-coverage-floor` (or `dot-null-withheld`, which implies it) tag — this is the VALUE, not
      # the arming. 0.90 is an empirical natural break: zero of 11,068 measured rows fall in
      # [0.828, 0.947], so it separates "one dot happened to be missing" from "a whole data plane is
      # gone" without splitting any observed population.
      dot-coverage-floor: ${ARTHA_SCALPER_OI_DOT_COVERAGE_FLOOR:0.90}
      # #2 (section 3.2) Open=High faithful grading (Table-1 / Table-2 / LOW rules). min-strikes is the
      # per-side OH-strike count for a HIGH footprint; fall-volume-floor downgrades a fall-on-volume OH
      # to LOW; max-prev-close-fall-pct is the >50% fall = bigger-player LOW rule; window is the ATM+-N
      # listed-strike footprint; rsi-floor relaxes #2's RSI gate to ">50" (source), not the 60-80 band.
      open-high-min-strikes: 3
      open-high-fall-volume-floor: 50000
      open-high-max-prev-close-fall-pct: 50
      open-high-window: 3
      open-high-rsi-floor: 50
  paper:
    # Audit V3 tick-freshness guards (paper exit path). A paper FILL priced off a last tick older than
    # tick-max-age-seconds is rejected DATA_STALE (a fill against a stale LTP is fiction); a SL/TP bracket
    # that cannot get a fresh tick for bracket-starvation-alert-minutes pages ntfy once per (position, day)
    # so a dead-tick-deferred stop no longer hides. Settles take the last REAL tick at ANY age (stale =
    # counted + alerted, never refused). Env-tunable via the matching compose passthroughs (.env override).
    tick-max-age-seconds: ${ARTHA_PAPER_TICK_MAX_AGE_SECONDS:15}
    bracket-starvation-alert-minutes: ${ARTHA_PAPER_BRACKET_STARVATION_ALERT_MINUTES:2}
    # T10 (owner 2026-07-25): books whose bracket starvation is BY DESIGN (EOD-managed swing —
    # equities not on the live tick subscription; the 20:00/20:05 batch is the real exit path).
    # Metric still counts; WARN+page suppressed. Env name MUST match the compose passthrough
    # exactly (#653 placeholder trap).
    eod-managed-books: ${ARTHA_PAPER_EOD_MANAGED_BOOKS:minervini,manas-arora}
    # HOLD (task_94f40cf6) signal-freshness gate on the MANUAL take path (POST /api/v1/paper/orders):
    # a signal-linked hand ticket whose SIGNAL is older than this on a NON-swing book is rejected
    # SIGNAL_STALE (the setup's thesis is gone even though the fill prices fresh). Swing books
    # (minervini / manas-arora) are always exempt (EOD signals taken next session); 0/negative disables.
    # Separate from the tick-freshness guard above. Env-tunable (.env override) via the compose passthrough.
    signal-take-max-age-minutes: ${ARTHA_PAPER_SIGNAL_TAKE_MAX_AGE_MINUTES:60}
    # V058 / option D (HOLD, owner-approved 2026-08-03): books whose OPEN-position key is
    # STRATEGY-SCOPED — two strategies entering the same (exchange, tradingsymbol, side) hold
    # SEPARATE rows with their own brackets and their own exits, instead of the second averaging into
    # the first and both exiting on whichever doctrine fires first. Capital is NOT forked: one book,
    # one paper_account row, one kill switch, one heat cap, and a co-firing sibling INHERITS the key's
    # existing sub-account. EMPTY = DISARMED and byte-identical to pre-V058; arming a book (e.g.
    # `scalper`) CHANGES REALISED P&L on every co-fired trade, so it is an owner decision, not a
    # deploy default. Env name MUST match the compose passthrough exactly (#653 placeholder trap).
    strategy-scoped-books: ${ARTHA_PAPER_STRATEGY_SCOPED_BOOKS:}
    # A12 per-class capital-usage margin approximations (no Kite margin API).
    # Equities use full notional; long options the premium; futures & short
    # options a margin-pct-of-notional approximation (real SPAN+exposure varies).
    margin-pct:
      future: ${ARTHA_PAPER_MARGIN_FUTURE:0.15}
      short-option: ${ARTHA_PAPER_MARGIN_SHORT_OPTION:0.12}
    risk:
      # F9 paper risk application layer (owner numbers 2026-07-05). The per-book heat-cap % and
      # daily-loss % live in the risk_settings DB table (live-tunable); these are the app-layer knobs.
      # `enabled` is the master ENFORCEMENT gate for the portfolio heat cap: OFF (default) = advisory
      # (audit + ntfy on a breach, no block); ON = a hot book blocks new entries. advised_lots + the
      # margin snapshot are always computed (advisory), independent of this flag.
      enabled: ${ARTHA_PAPER_RISK_ENABLED:false}
      per-trade-risk-pct: ${ARTHA_PAPER_RISK_PER_TRADE_RISK_PCT:1.0}
  margin:
    # §8 SPAN appliance capability flag (off by default → flat-pct fallback above).
    # When true, futures & short options price via margin-service /api/v1/margin/size;
    # any miss (appliance down, no .spn) falls back to flat-pct. Advisory only.
    span-enabled: ${ARTHA_MARGIN_SPAN_ENABLED:false}
    base: ${ARTHA_ROUTE_MARGIN:http://margin-service:8086}
  graduation:
    # F7 auto-promotion: the daily 21:00-IST evaluator that marks a published strategy GRADUATED once
    # its closed paper trades clear a stricter bar than TAKE_ELIGIBLE. Measurement + ntfy only — never
    # a live action. Default OFF; dormant until a strategy accrues promotion-min-trades closed trades.
    promotion-enabled: ${ARTHA_GRADUATION_PROMOTION_ENABLED:false}
    promotion-min-trades: ${ARTHA_GRADUATION_PROMOTION_MIN_TRADES:50}
    promotion-min-sharpe: ${ARTHA_GRADUATION_PROMOTION_MIN_SHARPE:0.5}
    promotion-min-expectancy: ${ARTHA_GRADUATION_PROMOTION_MIN_EXPECTANCY:0}
    promotion-max-drawdown-pct: ${ARTHA_GRADUATION_PROMOTION_MAX_DRAWDOWN_PCT:25}
  insights:
    # Intelligence layer I1 (INT design §2.5/§3.2): the decision-support insight engine. SHADOW mode —
    # rows + read APIs only, no ntfy/Telegram/WS delivery (that arms in I3/I4). These are YAML-only
    # knobs: shadow mode arms nothing, so there is no .env override to wire yet (the #653 placeholder
    # trap applies only when the I4 delivery flags land with their compose passthroughs). Every value
    # here is hashed into each insight row's config_hash — a weight change is visible in every row.
    priority:
      degraded-trust-cap: 0.79          # DEGRADED trust multiplier — mechanically caps the ceiling at B-band
      closed-trades-floor: 20           # < N closed paper trades → track-record neutral 0.5 prior
      weights:                          # the five component weights (sum 1.00)
        edge: 0.30
        context: 0.20
        track: 0.20
        risk: 0.15
        freshness: 0.15
      bands:                            # A >= a, B >= b, C >= c, else D
        a: 80
        b: 60
        c: 40
      edge-band:                        # (composite - threshold) normalization band width, per family
        scalper: 0.10
        swing: 0.10
      half-life-seconds:                # freshness half-life, per family (scalper 10 min / swing 2 sessions)
        scalper: 600
        swing: 172800
      signal-ttl-minutes:               # signal-scoped insight expiry, per family
        scalper: 30
        swing: 2880
    risk:
      warn-pct: 70                      # book heat % (of equity/cap) → NOTICE
      critical-pct: 90                  # book heat % → WARN
      cap-warn-fraction: 0.80           # heat >= cap x fraction (when a cap is set) → NOTICE
      concentration-min: 2              # >= N open positions in one underlying+side → concentration insight
      cooldown-minutes: 15              # RISK_HEAT re-fire cooldown (recorded now; delivery-gates in I3/I4)
    retention:
      prune-days: 90                    # suppressed-INFO prune horizon (the prune job itself lands later)
    # I2 — context breadth + rejection intelligence (INT §6.2/§4.2/§2.2/§10.2). YAML-only knobs (still
    # shadow mode); every value is hashed into config_hash, so a threshold change is visible in each row.
    context:
      underlyings: [NIFTY, SENSEX]      # options-digest underlyings scanned per 15-min context sweep
      pcr-delta: 0.15                   # |ΔPCR since open| crossing → CONTEXT_SHIFT
      max-pain-drift: 50                # |max-pain drift| (index points) since open → CONTEXT_SHIFT
      straddle-pct: 20                  # |ATM straddle Δ%| vs open → CONTEXT_SHIFT
      active-strike-change: 2           # active (top-N peak-OI) strikes changed vs open → CONTEXT_SHIFT
      gap-open-pct: 0.5                 # |index gap-open %| vs prior close → CONTEXT_SHIFT
      shift-cooldown-minutes: 45        # per-(underlying, metric) CONTEXT_SHIFT re-fire cooldown
      structure-cooldown-minutes: 60    # MARKET_STRUCTURE regime re-fire cooldown
    rejection:
      near-miss-window-minutes: 120     # REJECTION_NEARMISS look-back window
      near-miss-top-n: 5                # top-N closest-to-firing rejections listed
      near-miss-max-closeness: 0.05     # only rejections within 5% (|margin|/|threshold|) of firing
      near-miss-cooldown-minutes: 45    # REJECTION_NEARMISS re-fire cooldown
      rail-trend-sessions: 5            # trailing sessions for the rail-share mean
      rail-trend-ratio: 2.0             # today-share / mean-share ratio → REJECTION_RAIL_TREND
      rail-trend-min-count: 5           # min rejections on a rail today (noise floor)
    hygiene:
      window-days: 7                    # trailing window for the HYGIENE nudge counts
      min-unrated: 1                    # >= N unrated journal entries in-window → HYGIENE
    expiry:
      days-ahead: 1                     # T-1: positions expiring within N days → EXPIRY_EVENT
    quality:
      window-days: 7                    # QUALITY_REPORT trailing window
      act-rate-target: 0.60             # A-band act-rate target (report escalates to WARN below it)
      dismiss-rate-threshold: 0.40      # per-type NOT_USEFUL share above which a type is a retirement candidate
      top-suppressed-keys: 5            # suppression-audit: top-N most-suppressed dedupe keys
    # I3/I4 — actions + strategy evidence + delivery. Priority weights remain deliberately YAML-only;
    # the delivery flags are env-tunable and default OFF. The floor defaults to the owner-decided NOTICE.
    sell-decision:
      escalate-sessions: 1              # sessions a SELL stays un-acked before NOTICE escalates to WARN
    delivery:
      ws: ${ARTHA_INSIGHTS_DELIVERY_WS:false}
      ntfy-enabled: ${ARTHA_INSIGHTS_DELIVERY_NTFY_ENABLED:false}
      telegram-enabled: ${ARTHA_INSIGHTS_DELIVERY_TELEGRAM_ENABLED:false}
      severity-floor: ${ARTHA_INSIGHTS_DELIVERY_SEVERITY_FLOOR:NOTICE}
    # I2 sweep crons (IST). Market-hours context sweep + the calendar-driven EOD/T-1/weekly jobs.
    context-cron: ${ARTHA_INSIGHTS_CONTEXT_CRON:0 */15 9-15 * * MON-FRI}
    eod-cron: ${ARTHA_INSIGHTS_EOD_CRON:0 5 16 * * MON-FRI}
    expiry-cron: ${ARTHA_INSIGHTS_EXPIRY_CRON:0 30 15 * * MON-FRI}
    quality-cron: ${ARTHA_INSIGHTS_QUALITY_CRON:0 0 8 * * SAT}
    # I3 sweep crons (IST) — post the 21:00 graduation eval + the 20:05 swing batch.
    strategy-evidence-cron: ${ARTHA_INSIGHTS_STRATEGY_EVIDENCE_CRON:0 10 21 * * MON-FRI}
    sell-decision-cron: ${ARTHA_INSIGHTS_SELL_DECISION_CRON:0 15 21 * * MON-FRI}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

---
# loopback overrides for bare-metal dev runs (T2)
spring:
  config:
    activate:
      on-profile: dev
  data:
    redis:
      host: 127.0.0.1
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/artha?currentSchema=strategy
artha:
  db:
    password-file: ${ARTHA_DB_PASSWORD_FILE:deploy/secrets/postgres_password}
  marketdata:
    base-url: ${ARTHA_MARKETDATA_BASE_URL:http://127.0.0.1:8081}
