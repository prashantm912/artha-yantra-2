# strategy-signal-service (Phase 21+). Internal :8082; PG schema `strategy`
# (single writer, D10); password via Docker secret file (A.9). Mock is the
# default profile (D13) - the registry is fully credential-free.
server:
  port: 8082

spring:
  application:
    name: strategy-signal-service
  profiles:
    default: mock
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:timescaledb}:${DB_PORT:5432}/artha?currentSchema=strategy
    username: artha
    password: ${ARTHA_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

artha:
  db:
    password-file: ${ARTHA_DB_PASSWORD_FILE:/run/secrets/postgres_password}
  marketdata:
    # D8: context-instrument existence checks resolve via market-data REST
    # (strategy-signal-service holds NO marketdata grant)
    base-url: ${ARTHA_MARKETDATA_BASE_URL:http://market-data-service:8081}
  openalgo:
    # §18.1 order-READ surface (orderbook/positions/tradebook/funds). Default OFF — the
    # DisabledOrderGateway then returns empty lists + a NOT_CONFIGURED funds row, so a mock or
    # Kite-only live stack needs no OpenAlgo API key. Flip on the LIVE profile to wire the
    # RestOpenAlgoOrderReadGateway (reads only — the order-WRITE path stays separately gated).
    order-read-enabled: ${ARTHA_OPENALGO_ORDER_READ_ENABLED:false}
    base-url: ${ARTHA_OPENALGO_BASE_URL:http://openalgo:5000}
    api-key-file: ${ARTHA_OPENALGO_API_KEY_FILE:/run/secrets/openalgo_api_key}
    # §17.3 order-WRITE strategy tag stamped on every OpenAlgo /api/v1/placeorder (it logs/routes by
    # it). The WRITE gateway itself is gated ONLY on artha.scalper.execution=live (default `paper` →
    # the DisabledOrderGateway places nothing); this key just names the tag when that is armed.
    strategy: ${ARTHA_OPENALGO_STRATEGY:ArthaYantra}
  signals:
    engine-enabled: ${ARTHA_SIGNAL_ENGINE_ENABLED:true}
  notifier:
    # Z1 scalp-signal alerts: a richer ntfy/Telegram push (underlying/strike/option-side, entry/SL/
    # target, confluence) for SCALPER entries, on top of the per-strategy opt-in. Default OFF so a
    # fresh stack never pushes; when on, the generic per-signal push is skipped for scalper entries
    # (the scalp alert is the single push). window-seconds dedupes the same leg (strategy+underlying+
    # side+strike) so a re-printing pattern doesn't re-fire.
    scalp-alerts:
      enabled: ${ARTHA_NOTIFIER_SCALP_ALERTS_ENABLED:false}
      window-seconds: ${ARTHA_NOTIFIER_SCALP_ALERTS_WINDOW_SECONDS:300}
  scalper:
    # Tier-1 OI-analytics thresholds (Phase-3.5 T2.1/T2.6/T2.7/T2.8) read by the confluence scorer
    # and the #5 trending-OI pre-gate. ivPairMinGap/ivBothHighFloor are on the 0..1 IV FRACTION scale
    # (10 IV points = 0.10; 40/40 both-high = 0.40). drasticFloor is a conservative, DB-tunable,
    # index-agnostic v1 placeholder dOI magnitude. All values are tunable (DB params later, §12.2).
    oi:
      cross-filter-pct: 50
      drastic-floor: 50000
      iv-pair-min-gap: 0.10
      iv-both-high-floor: 0.40
      spurt-oi-pct: 50
      spurt-price-pct: 50
      # #2 (section 3.2) Open=High faithful grading (Table-1 / Table-2 / LOW rules). min-strikes is the
      # per-side OH-strike count for a HIGH footprint; fall-volume-floor downgrades a fall-on-volume OH
      # to LOW; max-prev-close-fall-pct is the >50% fall = bigger-player LOW rule; window is the ATM+-N
      # listed-strike footprint; rsi-floor relaxes #2's RSI gate to ">50" (source), not the 60-80 band.
      open-high-min-strikes: 3
      open-high-fall-volume-floor: 50000
      open-high-max-prev-close-fall-pct: 50
      open-high-window: 3
      open-high-rsi-floor: 50
  paper:
    # A12 per-class capital-usage margin approximations (no Kite margin API).
    # Equities use full notional; long options the premium; futures & short
    # options a margin-pct-of-notional approximation (real SPAN+exposure varies).
    margin-pct:
      future: ${ARTHA_PAPER_MARGIN_FUTURE:0.15}
      short-option: ${ARTHA_PAPER_MARGIN_SHORT_OPTION:0.12}
  margin:
    # §8 SPAN appliance capability flag (off by default → flat-pct fallback above).
    # When true, futures & short options price via margin-service /api/v1/margin/size;
    # any miss (appliance down, no .spn) falls back to flat-pct. Advisory only.
    span-enabled: ${ARTHA_MARGIN_SPAN_ENABLED:false}
    base: ${ARTHA_ROUTE_MARGIN:http://margin-service:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

---
# loopback overrides for bare-metal dev runs (T2)
spring:
  config:
    activate:
      on-profile: dev
  data:
    redis:
      host: 127.0.0.1
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/artha?currentSchema=strategy
artha:
  db:
    password-file: ${ARTHA_DB_PASSWORD_FILE:deploy/secrets/postgres_password}
  marketdata:
    base-url: ${ARTHA_MARKETDATA_BASE_URL:http://127.0.0.1:8081}
