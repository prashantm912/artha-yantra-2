# Manas Arora Breakout — the live swing (daily-primary) strategy. Fires a long ENTRY as the daily
# close breaks out above the base pivot (the consolidation-breakout level from the Manas geometry) on
# expanding volume, above the 20-day MA. Universe = the Manas selection funnel (the day's buyable +
# on-deck names); the daily EOD batch drives evaluation per funnel symbol with the per-symbol pivot
# seeded into MANAS_PIVOT. Exit doctrine (§2.1/§3.5, parity-safe proxy): the ~10% protective stop, then
# the 20-day-MA close-below trail (a live-v1 proxy for the "+8-10% then 2×ATR trail" doctrine — the true
# 2×ATR trail + the too-fast/parabolic square-off are modelled in the BACKTEST, not the live v1). Paper-
# only (auto-paper into the manas-arora book) until the reliability bar is met.
schema: strategy-schema/v1
id: manas-arora-breakout
name: "Manas Arora Breakout"
version: 1.0.0
description: >-
  Manas Arora swing long: buy the base-pivot breakout on expanding volume above the 20-day MA;
  protect with a ~10% stop then trail the 20-day MA. Universe = the daily Manas selection funnel.
author: owner
tags: [manas-arora, swing, equity, breakout]
universe:
  mode: manas_arora_funnel
  bucket: buyable_on_deck
timeframes: { primary: 1d }
# Gate-only setup: the entry is decided by the gate (breakout + volume + trend). Only `vol` carries a
# scoring weight (breakout-volume strength, linear 0→3) so the composite is a meaningful, gate-aligned
# number that always clears the 0.1 floor once the gate's `vol > 1.2` holds; every other indicator is a
# gate/exit input at weight 0.0. Mirrors minervini-vcp.
indicators:
  - { name: SMA, alias: px, timeframe: 1d, params: { period: 1 }, weight: 0.0 }
  - { name: SMA, alias: sma20, timeframe: 1d, params: { period: 20 }, weight: 0.0 }
  - { name: SMA, alias: sma50, timeframe: 1d, params: { period: 50 }, weight: 0.0 }
  - { name: VOLUME_RATIO, alias: vol, timeframe: 1d, params: { lookback: 20 }, weight: 1.0,
      normalize: { type: linear, from: 0, to: 3 } }
  - { name: VCP_PIVOT, alias: pivot, timeframe: 1d, weight: 0.0,
      instrument: { exchange: NSE, tradingsymbol: "MANAS_PIVOT" } }
entry_rules:
  direction: long
  gate:
    all:
      - crossover: { fast: px, slow: pivot }
      - "vol > 1.2"
      - "px > sma20"
  scoring: { threshold: 0.1 }
exit_rules:
  - { type: stop_loss, params: { basis: percent, value: 10 } }          # §2.1 ~10% initial protective stop
  - { type: trailing_stop, params: { basis: indicator, alias: sma20 } } # §3.5 proxy: 20-day-MA close-below trail
risk:
  position_sizing: { method: atr_risk, params: { risk_pct_equity: 1.0 } } # qty = (1% equity)/stop distance
  max_positions: 7
  session: { style: swing }
