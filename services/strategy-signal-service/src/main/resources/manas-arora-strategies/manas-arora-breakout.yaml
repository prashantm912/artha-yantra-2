# Manas Arora Breakout — the live swing (daily-primary) strategy. Fires a long ENTRY as the daily
# close breaks out above the base pivot (the consolidation-breakout level from the Manas geometry) on
# expanding volume, above the 20-day MA. Universe = the Manas selection funnel (the day's buyable +
# on-deck names); the daily EOD batch drives evaluation per funnel symbol with the §3.2 breakout pivot
# seeded into MANAS_BREAKOUT_PIVOT (this strategy fires off its OWN setup's pivot, not the shared best).
# Exit doctrine (§3.5, now faithful to the doc, same math as the BACKTEST):
# the initial stop = entry − 2×ATR(20) capped at ~10%; the armed ATR trail (2×ATR, arms once up ~9%);
# and the exhaustion square-off (too-fast +35% in ≤3 sessions OR parabolic +40% over the 10-day MA).
# Paper-only (auto-paper into the manas-arora book) until the reliability bar is met.
schema: strategy-schema/v1
id: manas-arora-breakout
name: "Manas Arora Breakout"
version: 1.0.0
description: >-
  Manas Arora swing long: buy the base-pivot breakout on expanding volume above the 20-day MA;
  protect with a 2×ATR(20) stop capped ~10%, an armed 2×ATR trail (+9%), and a too-fast/parabolic
  square-off. Universe = the daily Manas selection funnel.
author: owner
tags: [manas-arora, swing, equity, breakout]
universe:
  mode: manas_arora_funnel
  bucket: buyable_on_deck
timeframes: { primary: 1d }
# Gate-only setup: the entry is decided by the gate (breakout + volume + trend). Only `vol` carries a
# scoring weight (breakout-volume strength, linear 0→3) so the composite is a meaningful, gate-aligned
# number that always clears the 0.1 floor once the gate's `vol > 1.2` holds; every other indicator is a
# gate/exit input at weight 0.0. Mirrors minervini-vcp.
indicators:
  - { name: SMA, alias: px, timeframe: 1d, params: { period: 1 }, weight: 0.0 }
  - { name: SMA, alias: sma20, timeframe: 1d, params: { period: 20 }, weight: 0.0 }
  - { name: SMA, alias: sma50, timeframe: 1d, params: { period: 50 }, weight: 0.0 }
  - { name: VOLUME_RATIO, alias: vol, timeframe: 1d, params: { lookback: 20 }, weight: 1.0,
      normalize: { type: linear, from: 0, to: 3 } }
  - { name: VCP_PIVOT, alias: pivot, timeframe: 1d, weight: 0.0,
      instrument: { exchange: NSE, tradingsymbol: "MANAS_BREAKOUT_PIVOT" } }
entry_rules:
  direction: long
  gate:
    all:
      - crossover: { fast: px, slow: pivot }
      - "vol > 1.2"
      - "px > sma20"
  scoring: { threshold: 0.1 }
exit_rules:
  # §3.5A initial stop = entry − 2×ATR(20), capped at ~10% of entry (the tighter wins). atr_risk sizes
  # off THIS stop's distance (min(2×ATR, 10%)), so a wide-ATR name takes a smaller position.
  - { type: stop_loss, params: { basis: atr_multiple, value: 2, atr_period: 20, cap_pct: 10 } }
  # §3.5B armed ATR trail: inert until up ~9%, then ratchets peak − 2×ATR (monotone up).
  - { type: trailing_stop, params: { basis: atr_multiple, value: 2, atr_period: 20, arm_pct: 9 } }
  # §3.5C exhaustion square-off: too-fast (+35% in ≤3 sessions) OR parabolic (+40% over the 10-day MA).
  - { type: square_off, params: { fast_pct: 35, fast_bars: 3, parabolic_ma: 10, parabolic_dist_pct: 40 } }
risk:
  position_sizing: { method: atr_risk, params: { risk_pct_equity: 1.0 } } # qty = (1% equity)/stop distance
  max_positions: 7
  session: { style: swing }
