# Manas Arora VCP — the live swing (daily-primary) strategy. The same base-pivot breakout as the
# breakout setup but off a tightening VCP base (the Manas geometry marks the vcp footprint + pivot).
# Fires a long ENTRY as the daily close breaks out above the VCP pivot on expanding volume, above the
# 20-day MA. Universe = the Manas selection funnel; the daily EOD batch drives evaluation per funnel
# symbol with the §3.3 VCP pivot seeded into MANAS_VCP_PIVOT (this strategy fires off its OWN setup's
# pivot, not the shared best). Same exit doctrine as the breakout setup
# (§3.5, faithful to the doc, same math as the BACKTEST): the 2×ATR(20) stop capped ~10%, an armed
# 2×ATR trail (+9%), and a too-fast/parabolic square-off. Paper-only (auto-paper into the manas-arora
# book) until the reliability bar is met. Mirrors minervini-vcp.
schema: strategy-schema/v1
id: manas-arora-vcp
name: "Manas Arora VCP"
version: 1.0.0
description: >-
  Manas Arora swing long: buy the VCP-base breakout on expanding volume above the 20-day MA;
  protect with a 2×ATR(20) stop capped ~10%, an armed 2×ATR trail (+9%), and a too-fast/parabolic
  square-off. Universe = the daily Manas selection funnel.
author: owner
tags: [manas-arora, swing, equity, vcp]
universe:
  mode: manas_arora_funnel
  bucket: buyable_on_deck
timeframes: { primary: 1d }
# Gate-only setup (see manas-arora-breakout for the scoring rationale): only `vol` scores (linear 0→3),
# all other indicators are gate/exit inputs at weight 0.0.
indicators:
  - { name: SMA, alias: px, timeframe: 1d, params: { period: 1 }, weight: 0.0 }
  - { name: SMA, alias: sma20, timeframe: 1d, params: { period: 20 }, weight: 0.0 }
  - { name: SMA, alias: sma50, timeframe: 1d, params: { period: 50 }, weight: 0.0 }
  - { name: VOLUME_RATIO, alias: vol, timeframe: 1d, params: { lookback: 20 }, weight: 1.0,
      normalize: { type: linear, from: 0, to: 3 } }
  - { name: VCP_PIVOT, alias: pivot, timeframe: 1d, weight: 0.0,
      instrument: { exchange: NSE, tradingsymbol: "MANAS_VCP_PIVOT" } }
entry_rules:
  direction: long
  gate:
    all:
      - crossover: { fast: px, slow: pivot }
      - "vol > 1.2"
      - "px > sma20"
  scoring: { threshold: 0.1 }
exit_rules:
  # §3.5A initial stop = entry − 2×ATR(20), capped at ~10% of entry (the tighter wins). atr_risk sizes
  # off THIS stop's distance (min(2×ATR, 10%)), so a wide-ATR name takes a smaller position.
  - { type: stop_loss, params: { basis: atr_multiple, value: 2, atr_period: 20, cap_pct: 10 } }
  # §3.5B armed Chandelier ATR trail (H4 doctrine-faithful): inert until up ~9%, then ratchets
  # highest-high − 2×ROLLING-ATR(20), floored at breakeven (cost). Same doctrine as the backtest.
  - { type: trailing_stop, params: { basis: atr_multiple, value: 2, atr_period: 20, arm_pct: 9, atr_basis: rolling, breakeven_floor: true } }
  # §3.5C exhaustion square-off: too-fast (+35% in ≤3 sessions) OR parabolic (+40% over the 10-day MA).
  - { type: square_off, params: { fast_pct: 35, fast_bars: 3, parabolic_ma: 10, parabolic_dist_pct: 40 } }
risk:
  # qty = (0.8% equity)/stop distance. Was 1.0 until 2026-08-13, which made the book's declared 7th
  # slot UNREACHABLE BY CONSTRUCTION: 1.0% per trade against the 6.0% portfolio open-risk cap
  # (artha.manas-arora.pyramid.max-portfolio-risk-pct) saturates at exactly 6 positions — measured
  # live at 5.9947% of cap with ₹7.55 of headroom, refusing a 7th every business day since 08-03.
  # 7 × 0.8 = 5.6% leaves 0.4pp (~₹600) of real headroom. Deliberately NOT 6/7 = 0.857%: that lands
  # on 6.0000% exactly, and the cap compares strictly `>`, so admission would be decided by BigDecimal
  # rounding in the 6th decimal — the same knife-edge one slot further out.
  # BOTH manas YAMLs must carry the same value: they share one Books.MANAS_ARORA risk budget.
  position_sizing: { method: atr_risk, params: { risk_pct_equity: 0.8 } }
  max_positions: 7
  session: { style: swing }
