# Minervini VCP Early-Pivot (3-C) — live swing long (Phase-9 MV-9.1). Enters EARLY, as the daily close
# breaks out above the cheat-area pause high (the C of the A-B-C-D turn), a lower/earlier trigger than
# the final VCP pivot — WITHIN a base that has already cleared the full 8-gate Trend-Template screen
# (incl. close > 50-day MA). This is NOT the doctrine's "Low Cheat" (an entry below the 50-day MA in
# the lower third of the base), which this funnel structurally cannot reach (audit H8, renamed
# 2026-08-02; was "Minervini Cheat (3-C)" — see docs/signal-analysis/2026-08-01-e4-e8-decision-sheet.md
# §2a). CHEAT_PIVOT is seeded per-symbol from Phase-5 geometry. Universe = the SEPA funnel; exit
# doctrine = 8% stop then the 50-day-MA trail. Paper-only (auto-paper) until the reliability bar.
schema: strategy-schema/v1
id: minervini-cheat-3c
name: "Minervini VCP Early-Pivot (3-C)"
version: 1.0.0
description: >-
  SEPA swing long: buy the earlier cheat-pause breakout on expanding volume, within a base that has
  already cleared the full Trend-Template screen — an earlier trigger inside a standard VCP, NOT the
  doctrine's below-50-day-MA "Low Cheat" (structurally unreachable here). Protect with an 8% stop
  then trail the 50-day MA. Universe = the daily SEPA funnel.
author: owner
tags: [minervini, swing, equity, cheat]
universe:
  mode: minervini_funnel
  bucket: buyable_on_deck
timeframes: { primary: 1d }
# Gate-only setup (see minervini-vcp for the scoring rationale): only `vol` scores (linear 0→3), all
# other indicators are gate/exit inputs at weight 0.0.
indicators:
  - { name: SMA, alias: px, timeframe: 1d, params: { period: 1 }, weight: 0.0 }
  - { name: SMA, alias: sma50, timeframe: 1d, params: { period: 50 }, weight: 0.0 }
  - { name: VOLUME_RATIO, alias: vol, timeframe: 1d, params: { lookback: 20 }, weight: 1.0,
      normalize: { type: linear, from: 0, to: 3 } }
  - { name: CHEAT_PIVOT, alias: cheat, timeframe: 1d, weight: 0.0,
      instrument: { exchange: NSE, tradingsymbol: "MINERVINI_CHEAT" } }
entry_rules:
  direction: long
  gate:
    all:
      - crossover: { fast: px, slow: cheat }
      - "vol > 1.2"
  scoring: { threshold: 0.1 }
exit_rules:
  - { type: stop_loss, params: { basis: percent, value: 8 } }           # MV-7.2 initial protective stop
  - { type: trailing_stop, params: { basis: indicator, alias: sma50 } } # MV-7.4 50-day-MA close-below trail
risk:
  position_sizing: { method: percent_equity, params: { percent: 6.5 } }
  max_positions: 10
  session: { style: swing }
