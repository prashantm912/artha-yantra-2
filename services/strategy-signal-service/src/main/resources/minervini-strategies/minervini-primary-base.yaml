# Minervini Primary Base — live swing long (Phase-9 MV-9.1). Fires as the daily close breaks out
# above the prior 52-week high (a fresh high after the first base) on expanding volume. WEEK52_HIGH
# is computed in-engine over the prior 252 bars (no seeding needed). Universe = the SEPA funnel; exit
# doctrine = 8% stop then the 50-day-MA trail. Paper-only (auto-paper) until the reliability bar is met.
schema: strategy-schema/v1
id: minervini-primary-base
name: "Minervini Primary Base"
version: 1.0.0
description: >-
  SEPA swing long: buy a fresh 52-week-high breakout on expanding volume; protect with an
  8% stop then trail the 50-day MA. Universe = the daily SEPA funnel.
author: owner
tags: [minervini, swing, equity, primary-base]
universe:
  mode: minervini_funnel
  bucket: buyable_on_deck
timeframes: { primary: 1d }
# Gate-only setup (see minervini-vcp for the scoring rationale): only `vol` scores (linear 0→3), all
# other indicators are gate/exit inputs at weight 0.0.
indicators:
  - { name: SMA, alias: px, timeframe: 1d, params: { period: 1 }, weight: 0.0 }
  - { name: SMA, alias: sma50, timeframe: 1d, params: { period: 50 }, weight: 0.0 }
  - { name: WEEK52_HIGH, alias: w52h, timeframe: 1d, params: { period: 252 }, weight: 0.0 }
  - { name: VOLUME_RATIO, alias: vol, timeframe: 1d, params: { lookback: 50 }, weight: 1.0,
      normalize: { type: linear, from: 0, to: 3 } }
entry_rules:
  direction: long
  gate:
    all:
      - crossover: { fast: px, slow: w52h }
      - "vol > 1.2"
  scoring: { threshold: 0.1 }
exit_rules:
  - { type: stop_loss, params: { basis: percent, value: 8 } }           # MV-7.2 initial protective stop
  - { type: trailing_stop, params: { basis: indicator, alias: sma50 } } # MV-7.4 50-day-MA close-below trail
risk:
  position_sizing: { method: percent_equity, params: { percent: 5 } }
  max_positions: 10
  session: { style: swing }
