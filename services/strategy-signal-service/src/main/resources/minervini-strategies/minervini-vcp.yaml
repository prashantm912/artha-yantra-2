# Minervini VCP Breakout — the live swing (daily-primary) strategy (Phase-9 MV-9.1). Fires a long
# ENTRY as the daily close breaks out above the Phase-5 VCP pivot on expanding volume, above the
# 20-day MA. Universe = the SEPA funnel (the day's buyable + on-deck VCP names); the Phase-9 daily
# batch drives evaluation per funnel symbol with the per-symbol pivot seeded into VCP_PIVOT. Exit
# doctrine (§0.5): the ~8% protective stop, then the 50-day-MA close-below trail. Paper-only (auto-
# paper) until the reliability bar is met.
schema: strategy-schema/v1
id: minervini-vcp
name: "Minervini VCP Breakout"
version: 1.0.0
description: >-
  SEPA swing long: buy the VCP-pivot breakout on expanding volume above the 20-day MA;
  protect with an 8% stop then trail the 50-day MA. Universe = the daily SEPA funnel.
author: owner
tags: [minervini, swing, equity, vcp]
universe:
  mode: minervini_funnel
  bucket: buyable_on_deck
timeframes: { primary: 1d }
# Gate-only setup: the entry is decided by the gate (breakout + volume + trend). Only `vol` carries a
# scoring weight (breakout-volume strength, linear 0→3) so the composite is a meaningful, gate-aligned
# number that always clears the 0.1 floor once the gate's `vol > 1.2` holds; every other indicator is a
# gate/exit input at weight 0.0.
indicators:
  - { name: SMA, alias: px, timeframe: 1d, params: { period: 1 }, weight: 0.0 }
  - { name: SMA, alias: sma20, timeframe: 1d, params: { period: 20 }, weight: 0.0 }
  - { name: SMA, alias: sma50, timeframe: 1d, params: { period: 50 }, weight: 0.0 }
  - { name: VOLUME_RATIO, alias: vol, timeframe: 1d, params: { lookback: 20 }, weight: 1.0,
      normalize: { type: linear, from: 0, to: 3 } }
  - { name: VCP_PIVOT, alias: pivot, timeframe: 1d, weight: 0.0,
      instrument: { exchange: NSE, tradingsymbol: "MINERVINI_PIVOT" } }
entry_rules:
  direction: long
  gate:
    all:
      - crossover: { fast: px, slow: pivot }
      - "vol > 1.2"
      - "px > sma20"
  scoring: { threshold: 0.1 }
exit_rules:
  - { type: stop_loss, params: { basis: percent, value: 8 } }           # MV-7.2 initial protective stop
  - { type: trailing_stop, params: { basis: indicator, alias: sma50 } } # MV-7.4 50-day-MA close-below trail
risk:
  position_sizing: { method: percent_equity, params: { percent: 6.5 } }
  max_positions: 10
  session: { style: swing }
