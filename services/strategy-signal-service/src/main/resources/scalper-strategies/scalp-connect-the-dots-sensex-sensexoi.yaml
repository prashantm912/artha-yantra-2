# AUTO-DERIVED (2b-1) variant of the scalp-connect-the-dots family — signal on NFO/NIFTY-FUT-CONT. Executes on SENSEX options (strike anchored on BFO/SENSEX-FUT-CONT).
# Siva #10 — Connect-the-Dots framework (the master confluence). Phase 3 / Model A:
# evaluates on the NIFTY FRONT FUTURE; the confluence seam buys the nearest-weekly
# ATM-band CE on full chart+OI+macro confluence. Chart gate is deliberately permissive
# (close > VWAP) — the §12.3 ScalperConfluenceGate does the real gating.
schema: strategy-schema/v1
id: scalp-connect-the-dots-sensex-sensexoi
name: "Scalper · Connect-the-Dots · SENSEX CE (SENSEX-OI)"
version: 1.0.0
description: "Master Connect-the-Dots confluence scalp (Siva #10) on the NIFTY front future; long-premium CE only."
author: owner
tags: [scalper, options, intraday, sensex, rsi-s24-bands, delta-s24-floor, premium-s24-band, indicator-distance-veto, s24-trade-window, iv-per-strike, flat-oi-stand-aside, max-oi-sr-gate, relative-volume-floor]

universe:
  mode: options_of_underlying
  underlying: { exchange: BSE, tradingsymbol: "SENSEX" }
  signal_underlying: { exchange: NFO, tradingsymbol: "NIFTY-FUT-CONT" }
  strike_reference: { exchange: BFO, tradingsymbol: "SENSEX-FUT-CONT" }
  options:
    expiry: nearest_weekly
    strikes: { selector: atm_window, width: 3 }   # ATM±3; the StrikePicker delta/premium band refines
    option_types: [CE]

timeframes:
  primary: 3m                    # the Siva scalp clock
  additional: [1h]               # the 60-minute bias the confluence requires to agree

indicators:
  - { name: VWMA,       alias: vwma20,    timeframe: 3m, params: { period: 20 } }
  - { name: PSAR,       alias: psar,      timeframe: 3m, params: { step: 0.02, max: 0.2 } }
  - { name: RSI,        alias: rsi14,     timeframe: 3m, params: { period: 14 }, weight: 1.0,
      normalize: { type: rsi_momentum } }
  - { name: SUPERTREND, alias: supertrend, timeframe: 3m, params: { period: 10, multiplier: 2.0 },
      weight: 1.0, normalize: { type: direction } }
  - { name: SUPERTREND, alias: bias60m,   timeframe: 1h, params: { period: 7, multiplier: 3.0 } }
  - { name: SUPERTREND_LINE, alias: supertrend_line, timeframe: 3m, params: { period: 10, multiplier: 2.0 } } # E9 §3: the ST LINE for the trail-with-Super-Trend exit

entry_rules:
  direction: long                # long bias → CE (the seam derives CE/PE from price vs VWAP)
  gate:
    all:
      - "close > vwap"           # coarse pre-gate; the confluence seam is the real filter
  scoring:
    threshold: 0.2               # easy to clear → the seam runs; §0B + confluence then decide

exit_rules:
  - { type: take_profit, params: { basis: premium_pct, value: 35 } }   # T21 (owner 2026-07-25): +35% premium target for the bracket-less families
  - { type: stop_loss, params: { basis: premium_pct, value: 25 } }     # T21: -25% premium stop on the OPTION leg (paper bracket path); index-side levels stay structural/index_points
  - { type: signal_exit, params: { rule: "close < vwap", min_volume: 125000 } }   # structural exit on the future
  - { type: stop_loss, params: { basis: index_points, value: 60 } }   # §2.4 scalp point-SL — all 2b scalpers signal on NIFTY-FUT-CONT, so this is 60 NIFTY-future points (≈ the ~250 SENSEX-native risk); a FALLBACK stop for this no-native-SL family + a cap on a too-wide structural stop
  - { type: trailing_stop, params: { basis: indicator, alias: supertrend_line } }   # E9 §3: trail with the Super Trend line as the move matures
  - { type: time_stop,   params: { max_bars: 10 } }           # scalps go stale fast

risk:
  position_sizing: { method: premium_budget, params: { budget_inr: 15000, max_lots: 5 } }
  max_positions: 1
  max_positions_per_underlying: 1
  max_daily_loss_pct: 2.0
  session:
    style: intraday
    window: { from: "09:45", to: "15:00" }
    square_off: "15:15"

backtest:
  defaults: { interval: 1m, lookback_days: 120, initial_capital: 200000, costs: { per_lot_inr: 20, slippage_ticks: 1 } }
  oi_confluence_gate: { enabled: true, interval: "5m", index: "SENSEX" }
  optimize:
    parameters:
      - { path: "indicators[alias=vwma20].params.period",         range: [10, 30], step: 1 }
      - { path: "indicators[alias=rsi14].params.period",          range: [9, 21], step: 1 }
      - { path: "indicators[alias=supertrend].params.period",     range: [7, 14], step: 1 }
      - { path: "indicators[alias=supertrend].params.multiplier", range: [1.5, 3.5] }
      - { path: "entry_rules.scoring.threshold",                  range: [0.1, 0.5] }
      - { path: "exit_rules[type=time_stop].params.max_bars",   range: [6, 16], step: 1 }
    method: tpe
    max_trials: 40
    objective: { metric: expectancy, direction: maximize, fold_aggregation: mean }
    constraints: { min_trades: 10 }
    walk_forward: { train_days: 30, test_days: 30, step_days: 20, anchored: false }
