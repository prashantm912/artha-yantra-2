# AUTO-DERIVED (2b-1) variant of the scalp-morning-trade family — signal on NFO/NIFTY-FUT-CONT.
# Siva #9 — Morning Trade (section 3.9). The `opening-tick` tag arms the §12.3 Morning Trade path: an
# OPENING-TICK scalp executed in the FIRST candle(s) at ~09:16-09:18, governed by its own opening-tick
# window (the general "after 09:45" cross-strategy rule does NOT apply — owner-confirmed). The view is
# EOD-FORMED the prior evening (prior-day Futures positioning + Trending OI + Sentiment + FII/DII —
# already read into the confluence ctx); the global cues (Dow / Asian / USD) are a MANUAL checklist
# item, not automated here. VWAP is "not actionable before 10:30", so in the opening window VWAP is NOT
# the hard gate — the OI/sentiment/FII confluence carries the signal and VWAP stays a SOFT dot in the
# aggregate. SL = the FIRST session candle's low (CE) / high (PE). Small size, profits-only (a risk-
# layer discipline note, not enforced here). Index-option intraday — squared off same day, NO carry.
# Evaluates on the NIFTY front future (Model A); the confluence seam buys the nearest-weekly ATM-band CE.
schema: strategy-schema/v1
id: scalp-morning-trade-nifty
name: "Scalper · Morning Trade · NIFTY CE"
version: 1.0.0
description: "Morning Trade opening-tick scalp (Siva #9) on the NIFTY front future at ~09:16; EOD-formed OI/sentiment/FII view carries the signal, VWAP is degraded (soft, not hard) before 10:30, SL = first session candle low; long-premium CE only; profits-only small size; global cues (Dow/Asian/USD) are a MANUAL checklist item."
author: owner
tags: [scalper, options, intraday, nifty, opening-tick, rsi-s24-bands, delta-s24-floor, premium-s24-band, gap-size-side-gate, prior-day-vwap-stop, morning-opening-formation, morning-eod-precondition, relative-volume-floor]

universe:
  mode: options_of_underlying
  underlying: { exchange: NSE, tradingsymbol: "NIFTY 50" }
  signal_underlying: { exchange: NFO, tradingsymbol: "NIFTY-FUT-CONT" }
  options:
    expiry: nearest_weekly
    strikes: { selector: atm_window, width: 3 }
    option_types: [CE]

timeframes:
  primary: 3m
  additional: [1h]

indicators:
  - { name: VWMA,       alias: vwma20,    timeframe: 3m, params: { period: 20 } }
  - { name: PSAR,       alias: psar,      timeframe: 3m, params: { step: 0.02, max: 0.2 } }
  - { name: RSI,        alias: rsi14,     timeframe: 3m, params: { period: 14 }, weight: 1.0,
      normalize: { type: rsi_momentum } }
  - { name: SUPERTREND, alias: supertrend, timeframe: 3m, params: { period: 10, multiplier: 2.0 },
      weight: 1.0, normalize: { type: direction } }
  - { name: SUPERTREND, alias: bias60m,   timeframe: 1h, params: { period: 7, multiplier: 3.0 } }
  - { name: SUPERTREND_LINE, alias: supertrend_line, timeframe: 3m, params: { period: 10, multiplier: 2.0 } } # E9 §3: the ST LINE for the trail-with-Super-Trend exit

entry_rules:
  direction: long
  gate:
    all:
      - "close > vwma20"          # opening-tick momentum lean; VWAP is a soft confluence dot before 10:30
  scoring:
    threshold: 0.2

exit_rules:
  - { type: take_profit, params: { basis: premium_pct, value: 35 } }   # T21 (owner 2026-07-25): +35% premium target for the bracket-less families
  - { type: stop_loss, params: { basis: premium_pct, value: 25 } }     # T21: -25% premium stop on the OPTION leg (paper bracket path); index-side levels stay structural/index_points
  - { type: signal_exit, params: { rule: "close < vwap", min_volume: 125000 } }
  - { type: trailing_stop, params: { basis: indicator, alias: supertrend_line } }   # E9 §3: trail with the Super Trend line as the move matures
  - { type: time_stop,   params: { max_bars: 10 } }

risk:
  position_sizing: { method: premium_budget, params: { budget_inr: 25000, max_lots: 5 } }
  max_positions: 1
  max_positions_per_underlying: 1
  max_daily_loss_pct: 2.0
  session:
    style: intraday
    window: { from: "09:16", to: "15:00" }
    square_off: "15:15"

backtest:
  defaults: { interval: 1m, lookback_days: 120, initial_capital: 200000, costs: { per_lot_inr: 20, slippage_ticks: 1 } }
  oi_confluence_gate: { enabled: false, interval: "5m" }
  optimize:
    parameters:
      - { path: "indicators[alias=vwma20].params.period",         range: [10, 30], step: 1 }
      - { path: "indicators[alias=rsi14].params.period",          range: [9, 21], step: 1 }
      - { path: "indicators[alias=supertrend].params.period",     range: [7, 14], step: 1 }
      - { path: "indicators[alias=supertrend].params.multiplier", range: [1.5, 3.5] }
      - { path: "entry_rules.scoring.threshold",                  range: [0.1, 0.5] }
      - { path: "exit_rules[type=time_stop].params.max_bars",   range: [6, 16], step: 1 }
    method: tpe
    max_trials: 40
    objective: { metric: expectancy, direction: maximize, fold_aggregation: mean }
    constraints: { min_trades: 10 }
    walk_forward: { train_days: 30, test_days: 30, step_days: 20, anchored: false }
