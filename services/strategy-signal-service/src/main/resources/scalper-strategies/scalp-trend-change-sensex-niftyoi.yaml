# AUTO-DERIVED (2b-1) variant of the scalp-trend-change family — signal on NFO/NIFTY-FUT-CONT. Executes on SENSEX options (strike anchored on BFO/SENSEX-FUT-CONT). Re-homed off BankNifty (now monthly-expiry) per the 2b LOCKED decision.
# Siva #12 - Trend Change. The `trend-change` tag arms the §12.3 TrendChangeGate: a reversal-capture
# strategy that trades a SHIFT in direction (sideways->up / down->up, and the mirror) rather than a
# continuation breakout. The hard pre-gate requires ALL of: (a) a price market-structure break in the
# side's direction (a 3-bar fractal swing-high taken out to the upside for CE / a swing-low taken out
# to the downside for PE), (b) a Trending-OI momentum shift in that direction with a >=50% quantified
# shift (CE: put-OI rising AND call-OI falling; PE mirror) read off the Tier-1 signed CE/PE dOI +
# call-put delta imbalance %, (c) the §3.1 2-candle 3rd-candle confirmation, and (d) the ~14:30
# late-reversal cap (avoid a fresh DOWN-reversal after 14:30; after that both OIs falling = the day is
# over). OI leads price by ~15-30 min, so the structure break + 2-candle confirm are the price half the
# OI shift has already telegraphed. Any missing leg BLOCKS (a trend change is high-conviction-only -
# never a false fire); null OI deltas degrade to a block.
#
# The >=50% OI shift is enforced INSIDE the TrendChangeGate, so this strategy does NOT also carry the
# `oi-cross-filter` tag - that would stack a second, redundant >=50% hard pre-gate on the same Tier-1
# imbalance for no added signal.
#
# Structural stop: the broken swing pivot (the swing-high for a long / the swing-low for a short). §3.12
# gives no numeric SL and permits a ~10-20 pt benefit-of-doubt allowance ONLY when the OI convincingly
# confirms; v1 anchors on the raw swing pivot (the documented, bar-derivable anchor) and leaves the
# allowance to live SL-management, so the persisted stop stays pure/deterministic. VWAP is the
# defend/patience line (a VWAP break WITH volume invalidates; do NOT enter on a VWAP break without
# volume - the volume floor + RSI bands are the §0B rails the confluence already enforces).
#
# Evaluates on the NIFTY front future (Model A); the confluence seam buys the nearest-weekly
# ATM-band CE.
#
# NO `fii-bias` tag on the CE side (owner decision 2026-07-27). That gate passes CE only when the
# FII index-future LONG share is >=50%, but measured across 11 recent sessions that share ran
# 8.1-15.7% - FII net-short in index futures is the structural norm, not a bearish signal. So on a
# CE strategy the gate is not a directional filter, it is an unconditional off switch. The PE mirror
# KEEPS the tag: `<=50` passes today, and it still bites if FII ever flips genuinely net-long.
# The gate had never actually run - `Macro.fiiLongPct` was null on every bar because the EOD read
# asked for the live bar's own date (fixed in the same PR), so nothing was lost by it until now.
schema: strategy-schema/v1
id: scalp-trend-change-sensex-niftyoi
name: "Scalper · Trend Change · SENSEX CE (NIFTY-OI)"
version: 1.0.0
description: "Trend-change / reversal-capture scalp (Siva #12) on the NIFTY 3-min front future: a price swing-structure break + a >=50% Trending-OI momentum shift + the §3.1 2-candle 3rd-candle confirm, capped to the 09:45-14:30 window (no fresh down-reversal after ~14:30); broken-swing-pivot SL; long-premium CE only."
author: owner
tags: [scalper, options, intraday, sensex, trend-change, constituent-gate, rsi-s24-bands, delta-s24-floor, premium-s24-band, divergence-vol-gate, psar-durability, s24-trade-window, oi-confluence-exit, directional-vix-gate, rsi-cooloff, rsi-recovery, relative-volume-floor]

universe:
  mode: options_of_underlying
  underlying: { exchange: BSE, tradingsymbol: "SENSEX" }
  signal_underlying: { exchange: NFO, tradingsymbol: "NIFTY-FUT-CONT" }
  strike_reference: { exchange: BFO, tradingsymbol: "SENSEX-FUT-CONT" }
  options:
    expiry: nearest_weekly
    strikes: { selector: atm_window, width: 3 }
    option_types: [CE]

timeframes:
  primary: 3m
  additional: [1h]

indicators:
  - { name: VWMA,       alias: vwma20,    timeframe: 3m, params: { period: 20 } }
  - { name: PSAR,       alias: psar,      timeframe: 3m, params: { step: 0.02, max: 0.2 } }
  - { name: RSI,        alias: rsi14,     timeframe: 3m, params: { period: 14 }, weight: 1.0,
      normalize: { type: rsi_momentum } }
  - { name: SUPERTREND, alias: supertrend, timeframe: 3m, params: { period: 10, multiplier: 2.0 },
      weight: 1.0, normalize: { type: direction } }
  - { name: SUPERTREND, alias: bias60m,   timeframe: 1h, params: { period: 7, multiplier: 3.0 } }
  - { name: SUPERTREND_LINE, alias: supertrend_line, timeframe: 3m, params: { period: 10, multiplier: 2.0 } } # E9 §3: the ST LINE for the trail-with-Super-Trend exit

entry_rules:
  direction: long
  gate:
    all:
      - "close > vwap"           # the reversal must hold the correct side of VWAP post-break
  scoring:
    threshold: 0.2

exit_rules:
  - { type: take_profit, params: { basis: premium_pct, value: 35 } }   # T21 (owner 2026-07-25): +35% premium target for the bracket-less families
  - { type: stop_loss, params: { basis: premium_pct, value: 25 } }     # T21: -25% premium stop on the OPTION leg (paper bracket path); index-side levels stay structural/index_points
  - { type: signal_exit, params: { rule: "close < vwap", min_volume: 125000 } }   # §3.12: VWAP break invalidates the reversal
  - { type: trailing_stop, params: { basis: indicator, alias: supertrend_line } }   # E9 §3: trail with the Super Trend line as the move matures
  - { type: time_stop,   params: { max_bars: 30 } }

risk:
  position_sizing: { method: premium_budget, params: { budget_inr: 20000, max_lots: 5 } }
  max_positions: 1
  max_positions_per_underlying: 1
  max_daily_loss_pct: 2.0
  session:
    style: intraday
    window: { from: "09:45", to: "14:30" }   # §3.12: trend-change window 09:45-14:30
    square_off: "15:15"

backtest:
  defaults: { interval: 1m, lookback_days: 120, initial_capital: 200000, costs: { per_lot_inr: 20, slippage_ticks: 1 } }
  oi_confluence_gate: { enabled: false, interval: "5m", index: "NIFTY 50" }
  optimize:
    parameters:
      - { path: "indicators[alias=vwma20].params.period",         range: [10, 30], step: 1 }
      - { path: "indicators[alias=rsi14].params.period",          range: [9, 21], step: 1 }
      - { path: "indicators[alias=supertrend].params.period",     range: [7, 14], step: 1 }
      - { path: "indicators[alias=supertrend].params.multiplier", range: [1.5, 3.5] }
      - { path: "entry_rules.scoring.threshold",                  range: [0.1, 0.5] }
      - { path: "exit_rules[type=time_stop].params.max_bars",   range: [20, 42], step: 1 }
    method: tpe
    max_trials: 40
    objective: { metric: expectancy, direction: maximize, fold_aggregation: mean }
    constraints: { min_trades: 10 }
    walk_forward: { train_days: 30, test_days: 30, step_days: 20, anchored: false }
